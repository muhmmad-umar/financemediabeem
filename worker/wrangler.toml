# Cloudflare Workers config for the Media Beem API (Workers + D1 only).
# Deliberately NOT in the repo root, so Cloudflare Pages does not pick it up.
# The frontend (public/) is deployed separately to Cloudflare Pages — see README.md.
name = "mediabeem-api"
main = "src/index.js"
compatibility_date = "2024-09-23"

[vars]
# Comma-separated list of frontend origins allowed to call the API (CORS).
ALLOWED_ORIGINS = "https://admin.mediabeem.com,https://employee.mediabeem.com,https://client.mediabeem.com"

[[d1_databases]]
binding = "DB"
database_name = "mediabeem-db"
database_id = "b1f11e8f-e83b-4020-a1a3-1f925c1bcdf9"
migrations_dir = "migrations"

# JWT_SECRET is a secret, not a var:  npx wrangler secret put JWT_SECRET
# (for local dev put JWT_SECRET=... in .dev.vars)
