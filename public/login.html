<!doctype html>
<html lang="en" data-portal="login" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css?v=20261023d">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Media Beem — Sign in</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal.css?v=20261023d">
</head>
<body>
<div class="login-wrap">
  <form class="login-card" id="f" autocomplete="on">
    <h1>MEDIA BEEM</h1>
    <div class="login-err" id="err" style="display:none" role="alert"></div>
    <div class="f"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required autofocus></div>
    <div class="f"><label for="pw">Password</label><input id="pw" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn" id="go">Login</button>
  </form>
</div>
<script src="config.js?v=20261023d"></script>
<script src="portal.js?v=20261023d"></script>
<script>
/* Self-contained redirect: login keeps working even if a stale cached portal.js is served that predates goPortal. */
function toPortal(role, token) {
  if (window.MB && typeof MB.goPortal === 'function') return MB.goPortal(role, token);
  var cfg = window.MB_CONFIG || {}, P = cfg.PORTALS || { admin: 'https://admin.mediabeem.com', employee: 'https://employee.mediabeem.com', client: 'https://client.mediabeem.com' };
  var HOME = { admin: '/admin', employee: '/employee', client: '/client' }, h = location.hostname;
  if (!HOME[role]) return location.replace('/login');
  if (h === 'localhost' || h === '127.0.0.1') return location.replace(HOME[role]);
  var url = P[role] + HOME[role];
  location.replace(new URL(url).origin === location.origin ? url : url + '#t=' + encodeURIComponent(token || (window.MB && MB.token && MB.token()) || ''));
}
(async () => {
  // already signed in? go straight to the right portal
  if (MB.token()) { try { const { user } = await MB.api('/api/auth/me', { noRedirect: true }); toPortal(user.role); return; } catch (e) { MB.clear(); } }
  const f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
  f.addEventListener('submit', async ev => {
    ev.preventDefault(); err.style.display = 'none'; go.disabled = true; go.textContent = 'Signing in…';
    try {
      const r = await MB.api('/api/auth/login', { method: 'POST', body: { email: f.email.value, password: f.password.value }, noRedirect: true });
      MB.setSession(r.token, r.user);
      toPortal(r.user.role, r.token);   // admin → admin.mediabeem.com, employee → employee.mediabeem.com, client → client.mediabeem.com
    } catch (e) { err.textContent = e.message; err.style.display = 'block'; go.disabled = false; go.textContent = 'Login'; }
  });
})();
</script>
</body>
</html>
