<style>
:root{
  --teal:#0f766e; --teal-d:#0b5a54; --navy:#0f2a3d; --side:#0d1f2d;
  --gold:#b8860b; --gold-l:#f6e7b4; --green:#15803d; --green-l:#dcfce7;
  --bg:#f1f5f9; --card:#fff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --red:#dc2626; --amber:#d97706; --blue:#2563eb;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;display:flex;min-height:100vh}
button{font-family:inherit;cursor:pointer}
/* sidebar */
.rc-host{flex:1;min-height:0;display:flex;flex-direction:column}.chat-main>.rc-host{min-height:0}
.rc-badge{background:#ef4444;color:#fff;border-radius:99px;font-size:10px;font-weight:700;padding:0 6px;margin-left:auto;font-style:normal}.cdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-left:6px;flex:none}.cdot.off{background:#555}
#cuRoomSlot .rc-task{height:100%;display:flex}#cuRoomSlot .rc-task .rc-feed{flex:1;max-height:none;padding:0 14px}#cuRoomSlot .rc-task .rc-c{padding:10px 12px;border-top:1px solid #1f1f1f}#cuRoomSlot .rc-task .rc-head{padding:6px 14px}
.att-alert{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fca5a5;border-radius:6px;padding:8px 12px;margin-top:10px;font-size:13px}.att-n{color:#c4b5fd;cursor:pointer;text-decoration:none}.att-n:hover{text-decoration:underline}
/* keep Log out visible: the menu scrolls, the footer never gets pushed off-screen */
.sidebar{overflow:hidden}.sidebar .nav{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.side-foot{flex:0 0 auto;margin-top:auto;border-top:1px solid #2a2a2a;padding:12px 6px 0;font-size:12px}.side-foot .who{color:#ccc;margin-bottom:4px;word-break:break-all}
.sidebar{width:240px;background:var(--side);color:#cbd5e1;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;padding:20px 14px;z-index:30;transition:transform .25s}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:17px;padding:4px 8px 22px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--teal),#14b8a6);display:grid;place-items:center;font-size:18px}
.nav button{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;color:#94a3b8;padding:11px 12px;border-radius:9px;font-size:14px;font-weight:500;margin-bottom:3px;text-align:left;transition:.15s}
.nav button:hover{background:#16324a;color:#fff}
.nav button.active{background:var(--teal);color:#fff}
.nav button.allah.active{background:linear-gradient(135deg,#a37507,#d4a017);color:#fff}
.nav button.allah{color:#e6c35c}
/* main */
main{margin-left:240px;flex:1;padding:26px 30px 50px;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:24px;font-weight:700}
.topbar p{color:var(--muted);font-size:13px;margin-top:2px}
.menu-btn{display:none;background:var(--navy);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:18px}
.btn{background:var(--teal);color:#fff;border:0;border-radius:9px;padding:9px 16px;font-weight:600;font-size:13px;transition:.15s}
.btn:hover{background:var(--teal-d);transform:translateY(-1px)}
.btn.gold{background:var(--gold)}.btn.gold:hover{background:#8f6808}
.btn.ghost{background:#fff;color:var(--text);border:1px solid var(--line)}.btn.ghost:hover{background:#f8fafc}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn.danger{background:#fff;color:var(--red);border:1px solid #fecaca}.btn.danger:hover{background:#fef2f2}
/* cards */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.g-main{grid-template-columns:2fr 1fr}
.card{background:var(--card);border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(15,23,42,.06);border:1px solid var(--line);transition:.2s}
.card:hover{box-shadow:0 6px 18px rgba(15,23,42,.08)}
.card h3{font-size:15px;font-weight:600;margin-bottom:14px}
.stat .label{color:var(--muted);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.stat .value{font-size:24px;font-weight:700;margin-top:6px}
.stat .sub{color:var(--muted);font-size:12px;margin-top:4px}
.stat.teal{border-top:4px solid var(--teal)}.stat.navy{border-top:4px solid var(--navy)}.stat.amber{border-top:4px solid var(--amber)}
.allah-card{background:linear-gradient(135deg,#14532d,#166534 55%,#a37507);color:#fff;border:0;position:relative;overflow:hidden}
.allah-card::after{content:"☪";position:absolute;right:-8px;top:-24px;font-size:110px;opacity:.1}
.allah-card .label,.allah-card .sub{color:#e6e9c0}
.allah-card .value{color:#ffe58a}
.bar{height:12px;background:rgba(0,0,0,.18);border-radius:99px;overflow:hidden;margin-top:12px}
.bar>div{height:100%;background:linear-gradient(90deg,#fde68a,#f59e0b);border-radius:99px;transition:width .6s}
.bar.light{background:#e8e4cc}
.bar.light>div{background:linear-gradient(90deg,#16a34a,#b8860b)}
/* invoice cards */
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.inv-card{cursor:pointer}.inv-card:hover{transform:translateY(-2px)}
.inv-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.inv-nums span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.inv-nums b{font-size:14px}
.inv-actions{display:flex;gap:6px;flex-wrap:wrap}
.modal.wide{max-width:860px;padding:14px;background:#e9eef3}
.nav-sep{margin:14px 12px 6px;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#475569}
.nav button.personal{color:#c4b5fd}.nav button.personal:hover{background:#2a2250;color:#fff}
.nav button.personal.active{background:linear-gradient(135deg,#6d28d9,#8b5cf6);color:#fff}
.btn.pv{background:#7c3aed}.btn.pv:hover{background:#6d28d9}
.pbanner{background:linear-gradient(135deg,#ede9fe,#f5f3ff);border:1px solid #c4b5fd;color:#5b21b6;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600;margin-bottom:14px}
.psub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.psub button{border:1px solid #ddd6fe;background:#fff;color:#6d28d9;padding:8px 16px;border-radius:10px;font-size:13px;font-weight:600}
.psub button.on{background:#7c3aed;color:#fff;border-color:#7c3aed}
.ppanel{border-top:5px solid #7c3aed}
.ppanel .trk-row b{font-size:19px}
.catbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px}
.catbar .nm{width:120px;flex:none;font-weight:600}.catbar .tr{flex:1;height:10px;background:#f1f5f9;border-radius:99px;overflow:hidden}
.catbar .tr>div{height:100%;border-radius:99px}.catbar .vl{width:150px;text-align:right;flex:none;white-space:nowrap}
@media(max-width:520px){.catbar{flex-wrap:wrap}.catbar .vl{width:auto;margin-left:auto}}
.nbadge{margin-left:auto;background:#ef4444;color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:1px 8px;box-shadow:0 0 0 3px rgba(239,68,68,.25)}
.rem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.rem-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.rem-card.due{background:#fffbeb;border-color:#f4c542}.rem-card.overdue{background:#fef2f2;border-color:#fca5a5}
.rem-title{font-size:14px;line-height:1.35}
.rem-rows{margin:12px 0}.rem-rows>div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.rem-rows span{color:var(--muted)}
.b-due{background:#fde68a;color:#92400e}.b-upcoming{background:#e0f2fe;color:#075985}
.modal.xl{max-width:760px}
.av{border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;overflow:hidden;flex:none;object-fit:cover}
.emp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.emp-card{cursor:pointer}.emp-card:hover{transform:translateY(-2px)}
.emp-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.emp-meta{display:flex;justify-content:space-between;font-size:13px;margin:6px 0}
.emp-meta span{color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px 20px}
.kv div span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:3px}
.kv div b{font-weight:600;word-break:break-word}
.sec-t{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin:16px 0 10px;grid-column:1/-1}
.b-active{background:#dcfce7;color:#166534}.b-leave{background:#fef3c7;color:#92400e}.b-resigned{background:#e2e8f0;color:#475569}.b-terminated{background:#fee2e2;color:#991b1b}
.profile-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.profile-head .grow{flex:1;min-width:200px}
.brand small{display:block}
.dsec{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:6px 2px 10px}
.qa{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.card.stat[onclick]:hover{transform:translateY(-2px)}
.kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;align-items:start}
.kcol{background:#e9eef4;border-radius:12px;padding:10px;min-height:120px}
.khead{display:flex;justify-content:space-between;align-items:center;margin:2px 4px 10px}
.kcard{background:#fff;border:1px solid var(--line);border-left:4px solid #94a3b8;border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:grab;box-shadow:0 1px 2px rgba(15,23,42,.06);font-size:13px}
.kcard:hover{box-shadow:0 4px 12px rgba(15,23,42,.12)}
.kcard.overdue{background:#fef2f2;border-color:#fca5a5}
.kfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:12px}
.tagchip{display:inline-block;background:#eef2ff;color:#4338ca;font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;margin:0 4px 2px 0}
.qadd{border-style:dashed;background:transparent;font-size:12px;padding:7px 9px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calh{text-align:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;padding:4px}
.cald{min-height:92px;border:1px solid var(--line);border-radius:8px;padding:4px 5px;cursor:pointer;background:#fff;overflow:hidden}
.cald:hover{border-color:var(--teal)}.cald.today{background:#f0fdfa;border-color:var(--teal)}.cald.sel{box-shadow:0 0 0 2px var(--teal)}
.cald.empty-cell{background:transparent;border:0;cursor:default}
.dn{font-size:12px;font-weight:700;color:var(--muted)}.cald.today .dn{color:var(--teal)}
.cchip{color:#fff;font-size:11px;border-radius:5px;padding:1px 6px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
@media(max-width:640px){.cald{min-height:60px}.cchip{font-size:9px;padding:0 3px}}
/* ---- Tasks workspace: ClickUp replica (dark) ---- */
body.cu-mode{background:#0d0d0d}
main.cu{padding:0;background:#0d0d0d;color:#fff}
main.cu .topbar{display:none}
@media(max-width:820px){main.cu .topbar{display:flex;padding:8px 12px;margin:0;background:#111;color:#fff}}
.cu-wrap{display:flex;min-height:100vh;background:#0d0d0d;color:#fff;font-size:13px}
.cu-wrap .muted,body.cu-mode .modal .muted{color:#888}
.cu-wrap input,.cu-wrap select,.cu-wrap textarea,body.cu-mode .modal input,body.cu-mode .modal select,body.cu-mode .modal textarea{background:#161616;color:#fff;border:1px solid #2a2a2a;border-radius:6px;font-size:13px;padding:6px 9px;width:auto}
.cu-wrap input:focus,.cu-wrap select:focus,.cu-wrap textarea:focus{outline:1px solid #7c3aed;border-color:#7c3aed}
.cu-wrap textarea,.cu-wrap input.qadd,.cu-wrap input.dtitle{width:100%}
.cu-wrap select option,body.cu-mode .modal select option{background:#1a1a1a;color:#fff}
body.cu-mode .modal{background:#1a1a1a;color:#fff;border:1px solid #2a2a2a}
body.cu-mode .modal input,body.cu-mode .modal select,body.cu-mode .modal textarea{width:100%}
body.cu-mode .modal input[type=checkbox],body.cu-mode .modal input[type=radio],body.cu-mode .modal input[type=color]{width:auto}
body.cu-mode .modal .field label,body.cu-mode .modal .chk{color:#aaa}
body.cu-mode .modal .btn.ghost{background:#222;color:#ddd;border-color:#333}
body.cu-mode .modal .hint{background:#222;border-color:#333;color:#ccc}
body.cu-mode .modal .tx{border-color:#2a2a2a}body.cu-mode .modal .tx .t2{color:#888}
.chk{display:flex;align-items:center;gap:10px;padding:7px 0;font-weight:500;cursor:pointer}.chk input{width:auto!important}
/* sidebar */
.cu-tree{width:260px;flex:none;background:#111;border-right:1px solid #1d1d1d;color:#d4d4d4;height:100vh;position:sticky;top:0;overflow:auto;padding:10px 8px}
.tr-row{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:6px;cursor:pointer;min-height:26px;color:#cfcfcf}
.tr-row:hover{background:#1a1a1a}.tr-row.sel{background:#232323;color:#fff}
.tr-row.top{font-weight:600}.tr-row.ch{padding-left:30px;color:#a3a3a3}.tr-row.li{padding-left:30px}.tr-row.rf{padding-left:30px}.tr-row.addl{padding-left:30px;color:#6b7280;font-size:12px}.tr-row.addl:hover{color:#c4b5fd}.hash{color:#888;font-weight:700;width:12px;text-align:center}.lico{font-size:12px;cursor:pointer}.tr-row.dm{padding-left:10px}
.tr-row.newmsg{color:#888;font-size:12px}.tr-row.newmsg:hover{color:#fff}
.tr-row .arr{font-size:10px;color:#666;width:10px}.tr-row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr-row .cnt{font-size:11px;color:#777}
.sq{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff;flex:none;cursor:pointer}
.tr-row .acts{display:none;gap:2px}.tr-row:hover .acts,.tr-row.menuopen .acts{display:flex}.tr-row .cu-menu{left:auto;right:0;z-index:40}
.tr-row .acts button,.tr-sec button{background:none;border:0;color:#888;font-size:14px;padding:0 5px;border-radius:4px;line-height:1.4}
.tr-row .acts button:hover,.tr-sec button:hover{background:#2a2a2a;color:#fff}
.tr-sec{display:flex;justify-content:space-between;align-items:center;margin:14px 8px 4px;font-size:10px;font-weight:700;letter-spacing:.14em;color:#666}
.tr-note{font-size:12px;color:#666;padding:4px 10px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;cursor:pointer;display:inline-block}
.av{border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;flex:none}
.av.empty{border:1.5px dashed #444;background:transparent}.av.more{background:#333;color:#ddd}
.stack{display:inline-flex}.stack .av{border:2px solid #0d0d0d;margin-left:-7px}.stack .av:first-child{margin-left:0}
.cu-card .stack .av{border-color:#1e1e2e}
/* main */
.cu-main{flex:1;min-width:0;padding:14px 22px 90px}
.cu-main.has-detail{padding:0}
.cu-treebtn{display:none;margin-bottom:10px;background:#1a1a1a!important;color:#fff!important;border-color:#2a2a2a!important}
.cu-crumb{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:14px;flex-wrap:wrap}
.cu-crumb i{color:#555;font-style:normal}.cu-crumb .cur{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.cu-crumb .back{cursor:pointer;color:#aaa}.cu-crumb .back:hover{color:#fff}
.star{background:none;border:0;color:#888;font-size:17px;padding:0 4px}.star.on{color:#eab308}
.tsel{width:auto!important}
.cu-tabs{display:flex;gap:2px;border-bottom:1px solid #222;margin-bottom:10px}
.cu-tabs button{background:none;border:0;padding:8px 13px;font-size:13px;font-weight:600;color:#888;border-bottom:2px solid transparent;margin-bottom:-1px}
.cu-tabs button:hover{color:#fff}.cu-tabs button.on{color:#fff;border-color:#7c3aed}
.cu-tool{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.cu-tool .tl,.cu-tool .tr{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tbtn{background:#161616;border:1px solid #2a2a2a;color:#ccc;border-radius:6px;padding:5px 10px;font-size:12px}
.tbtn:hover{background:#202020;color:#fff}.tbtn.on{border-color:#7c3aed;color:#c4b5fd;background:#1d1830}
.addbtn{background:#7c3aed;color:#fff;border:0;border-radius:6px;padding:6px 14px;font-size:12px;font-weight:600}.addbtn:hover{background:#6d28d9}
.cu-menuwrap{position:relative;display:inline-block}
.cu-menu{position:absolute;top:calc(100% + 4px);left:0;min-width:170px;background:#1a1a1a;border:1px solid #2f2f2f;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.6);padding:4px;z-index:30}
.cu-tool .tr .cu-menu{left:auto;right:0}
.mi{padding:6px 10px;border-radius:5px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:7px;white-space:nowrap}.mi:hover{background:#262626}.mi.on{color:#c4b5fd}
.cu-search{width:150px!important}
.cu-fpanel{display:flex;gap:8px;flex-wrap:wrap;background:#141414;border:1px solid #232323;border-radius:8px;padding:8px;margin-bottom:12px}
.cu-empty{text-align:center;padding:70px 20px;color:#ccc}.cu-empty h2{color:#fff;margin-bottom:8px}.cu-empty .btn{margin:6px 4px}
.spill{display:inline-block;color:#fff;font-size:11px;font-weight:700;letter-spacing:.03em;padding:2px 9px;border-radius:5px;white-space:nowrap}
.spill b{opacity:.85;margin-left:5px}
.pflag{display:inline-flex;align-items:center;gap:4px;color:#cfcfcf;font-size:12px}
.tagchip{display:inline-block;background:#262040;color:#c4b5fd;font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;margin:0 4px 2px 0}
.tagchip a{cursor:pointer;opacity:.7;margin-left:2px}
.cdue{color:#888;font-size:12px}.cdue.od{color:#ef4444;font-weight:700}.cdue.td{color:#f59e0b;font-weight:700}
/* list */
.cu-list .lg{margin-bottom:14px}
.lgh,.lr{display:grid;align-items:center;column-gap:8px;padding:0 10px}
.lgh{min-height:30px;border-bottom:1px solid #1f1f1f}
.lg1{display:flex;align-items:center;gap:8px}.garr{cursor:pointer;color:#888;width:12px}
.lh{font-size:11px;color:#777;font-weight:600;cursor:pointer;white-space:nowrap}.lh:hover{color:#ccc}.lh.plus{text-align:center;font-size:15px}
.lr{min-height:34px;border-bottom:1px solid #181818}
.lr:hover{background:#1e1e1e}.lr.overdue{background:rgba(239,68,68,.09)}.lr.today{background:rgba(245,158,11,.09)}
.lr.sub{background:#0f0f0f;min-height:28px}
.ln{display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden}
.circ{width:16px;height:16px;border-radius:50%;border:2px solid #666;flex:none;display:inline-grid;place-items:center;font-size:10px;color:#fff;cursor:pointer}
.circ.sm{width:13px;height:13px;font-size:8px}
.arrow{width:12px;cursor:pointer;color:#777;font-size:11px;flex:none}
.ttl{cursor:pointer;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ttl:hover{color:#c4b5fd}

<script>
/* ========= Cloud storage shim =========
   The app below was written against localStorage. `store` keeps the same getItem/setItem interface, but is backed by
   Cloudflare D1: setItem() diffs the collection against the last server snapshot and POSTs only the changes. */
const SYNC_KEYS = ['income_entries','invoices','charity_expenses','expenses','personal_expenses','personal_income','personal_withdrawals','recurring_alerts','employees','salary_payments','employee_leaves','clients','cu_spaces','cu_lists','cu_tasks','cu_subtasks','cu_comments','cu_time_logs','cu_messages','channels','resource_folders','resource_files'];
const SETTING_KEYS = ['data_version','cu_migrated','cu_nofolders','allah_share_credit','allah_share_credit_manual','allah_share_credit_manual_at','allah_share_credit_last'];
const SHARED_KEYS = ['cu_tasks','cu_subtasks','cu_comments','cu_time_logs'];
const slugOf = s => String(s || '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const syncId = (key, it) => key === 'recurring_alerts' ? 'ra-' + slugOf(it.client_name) : String(it.id);
const store = (() => {
  const mem = {}, snap = {}, dirty = new Set(), pendingSettings = {};
  let timer = null, running = Promise.resolve(), failing = false;
  const stat = (t, bad) => { const el = document.getElementById('syncStat'); if (el) { el.textContent = t; el.style.color = bad ? '#f87171' : ''; } };
  const forSync = (key, raw) => {   // only what lives in the database
    let arr; try { arr = JSON.parse(raw); } catch (e) { return null; }

   When income later raises the obligation, credit is used automatically — each use is an auto-generated type:'credit' row. */
const r2 = n => Math.round(n * 100) / 100;

function creditLedger(){
  const inc = {}, exp = {}, pays = {};
  received().forEach(e => { inc[e.date] = (inc[e.date] || 0) + e.received_amount; });
  expenses.forEach(e => { exp[e.date] = (exp[e.date] || 0) + e.amount; });
  charity.filter(c => c.type !== 'credit').forEach(c => { (pays[c.date] = pays[c.date] || []).push(c); });
  const dates = [...new Set([...Object.keys(inc), ...Object.keys(exp), ...Object.keys(pays)])].sort();

/* ========= Date filter (shared by every tab, defaults to This Month) ========= */
let period = {mode:'month', from:'', to:''};
function rangeOf(){
  const n = new Date(), y = n.getFullYear(), m = n.getMonth();
  switch (period.mode) {
    case 'today': return {from:today(), to:today()};
    case 'week': { const dow = (n.getDay() + 6) % 7, a = new Date(y, m, n.getDate() - dow), b = new Date(y, m, n.getDate() - dow + 6); return {from:iso(a), to:iso(b)}; }
    case 'month': return {from:iso(new Date(y, m, 1)), to:iso(new Date(y, m + 1, 0))};
    case 'last': return {from:iso(new Date(y, m - 1, 1)), to:iso(new Date(y, m, 0))};
    case 'custom': return {from:period.from, to:period.to};
    default: return null;   // all time
  }
}
const inRange = d => { const r = rangeOf(); return !r || (d >= r.from && d <= r.to); };
const PERIODS = [['today','Today'],['week','This Week'],['month','This Month'],['last','Last Month'],['custom','Custom Range'],['all','All Time']];
function periodLabel(){
  const r = rangeOf(); if (!r) return 'All time';
  if (period.mode === 'month' || period.mode === 'last') return new Date(r.from + 'T00:00:00').toLocaleDateString('en-US', {month:'long', year:'numeric'});
  return r.from === r.to ? fdate(r.from) : fdate(r.from) + ' – ' + fdate(r.to);
}
function setPeriod(mode){
  period.mode = mode;
  if (mode === 'custom' && !period.from) { period.from = iso(new Date(new Date().getFullYear(), new Date().getMonth(), 1)); period.to = today(); }
  render();
}
function setCustom(which, v){
  if (!v) return;
  period[which] = v;
  if (period.from > period.to) { if (which === 'from') period.to = v; else period.from = v; }   // keep From ≤ To
  render();
}
function filterBar(){
  return `<div class="fbar"><div class="fpills">${PERIODS.map(([k,l]) => `<button class="${period.mode === k ? 'on' : ''}" onclick="setPeriod('${k}')">${l}</button>`).join('')}</div>
    <div class="fcur">📅 <b>${periodLabel()}</b></div>
    ${period.mode === 'custom' ? `<div class="fcustom"><label>From <input type="date" value="${period.from}" max="${period.to}" onchange="setCustom('from',this.value)"></label><label>To <input type="date" value="${period.to}" min="${period.from}" onchange="setCustom('to',this.value)"></label></div>` : ''}</div>`;
}

/* ========= Derived values ========= */
function totals(){
  const rec = rcv(), invs = invoicesIn();
  const totalIn = sum(rec, e => e.received_amount), totalExp = sum(expensesIn(), e => e.amount);
  const net = totalIn - totalExp;
  const allahTotal = allahOf(net), chIn = charityIn();
  const pay = chIn.filter(c => c.type !== 'credit');
  const given = sum(pay, oblPart);   // cash that settled the obligation (obligated payments + the applied part of voluntary ones)
  const voluntary = sum(pay.filter(c => c.type === 'voluntary'), c => Math.max(0, c.amount - oblPart(c) - credAdded(c)));   // legacy "extra" gifts
  const creditAdded = sum(pay, credAdded), creditApplied = sum(chIn.filter(c => c.type === 'credit'), c => c.amount);
  const netAll = sum(received(), e => e.received_amount) - sum(expenses, e => e.amount);
  return {
    invoiced: sum(invs, i => i.total_amount),
    outstanding: sum(invs, invRemaining),
    overdueAmt: sum(invs.filter(i => invStatus(i) === 'overdue'), invRemaining),
    totalIn, totalExp, net,
    mine: mineOf(net), allahTotal, given, voluntary, creditAdded, creditApplied, creditBalance: allahCredit, totalGiven: sum(pay, c => c.amount), remaining: allahTotal - given - creditApplied,
    allRemaining: allahOf(netAll) - sum(charity.filter(c => c.type !== 'credit'), oblPart) - sum(charity.filter(c => c.type === 'credit'), c => c.amount),
    pct: allahTotal > 0 ? Math.min(100, (given + creditApplied) / allahTotal * 100) : 0
  };
}

/* chart buckets: by day for ranges up to ~2 months, otherwise by month */
function addDays(d, n){ const x = new Date(d + 'T00:00:00'); x.setDate(x.getDate() + n); return iso(x); }
function chartBuckets(){
  const rec = rcv(), ex = expensesIn();
  const dates = [...rec.map(e => e.date), ...ex.map(e => e.date)].sort();
  if (!dates.length) return {labels:[], inc:[], exp:[]};
  const r = rangeOf(), lo = r ? r.from : dates[0];
  const hi = r ? (r.to > today() ? (dates[dates.length-1] > today() ? dates[dates.length-1] : today()) : r.to) : dates[dates.length-1];
  const daily = (new Date(hi) - new Date(lo)) / 864e5 <= 62;
  const keys = [];
  if (daily) for (let d = lo; d <= hi; d = addDays(d, 1)) keys.push(d);
  else { let [y, m] = [+lo.slice(0,4), +lo.slice(5,7)]; while (y + '-' + String(m).padStart(2,'0') <= monthKey(hi)) { keys.push(y + '-' + String(m).padStart(2,'0')); if (++m > 12) { m = 1; y++; } } }
  const k = d => daily ? d : monthKey(d);
  return {labels:keys.map(x => daily ? new Date(x + 'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}) : monthLabel(x)),
    inc:keys.map(x => sum(rec.filter(e => k(e.date) === x), e => e.received_amount)),
    exp:keys.map(x => sum(ex.filter(e => k(e.date) === x), e => e.amount))};
}

  chart('cDash', {type:'bar', data:{labels:b.labels, datasets:[

    {label:'Expenses', data:b.exp, backgroundColor:'#06b6d4', borderRadius:5}
  ]}, options:{...chartOpts, scales:{x:{grid:{display:false}}, y:{ticks:{callback:axisFmt}}}}});
}

function saveEdit(e, id){
  e.preventDefault(); const i = invById(id); if (!i) return; const f = Object.fromEntries(new FormData(e.target));
  const total = +f.total_amount, rec = +f.received_amount;
  if (!(total > 0) || !(rec >= 0)) { alert('Enter a valid Total Amount and Amount Received.'); return; }
  if (rec > total) { alert('Amount Received cannot be more than Total Amount.'); return; }
  Object.assign(i, {client:f.client.trim(), service:f.service.trim(), date:f.date, category:f.category, expectedBy:f.expectedBy || '', notes:f.notes.trim(), total_amount:total});
  const diff = rec - invReceived(i);
  if (diff > 0) addPayment(i, diff, today(), 'Added via edit');
  else if (diff < 0) {   // remove the difference from the most recent payments
    let cutBy = -diff;
    for (let k = i.payments.length - 1; k >= 0 && cutBy > 0; k--) {
      const p = i.payments[k];
      if (p.amount <= cutBy) { cutBy -= p.amount; i.payments.splice(k, 1); } else { p.amount -= cutBy; cutBy = 0; }
    }
  }
  const type = f.clientType === 'retainer' ? 'retainer' : 'onetime', msgs = ['Invoice updated · totals recalculated', ...linkInvoiceClient(i, type)];
  save(); closeModal(); render(); toastSeq(msgs);
}

const curMonth = () => today().slice(0, 7);

const onPayroll = e => !e.archived && (e.status === 'Active' || e.status === 'On Leave');
const empPayments = (id, m) => salaryPay.filter(p => p.employee_id === id && (!m || p.month === m));
/* Pro-rata for the joining month: (salary ÷ days in month) × days worked, rounded to the nearest rupee. Joining on the 1st = full salary. */
const monthDays = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo, 0).getDate(); };
function proInfo(e){
  if (!e.joinDate) return null;
  const m = e.joinDate.slice(0, 7), day = +e.joinDate.slice(8, 10);
  if (day <= 1) return null;
  const total = monthDays(m), days = total - day + 1;
  return {month:m, days, total, amount:Math.round((+e.salary || 0) / total * days), lastDay: day === total};
}
const dueAmount = (e, m) => { const p = proInfo(e); return p && p.month === m ? p.amount : (+e.salary || 0); };
const proText = p => `${p.days} day${p.days > 1 ? 's' : ''} of ${p.total} — ${fmt(p.amount)}`;
function payDueDate(e, m){ const [y, mo] = m.split('-').map(Number), last = new Date(y, mo, 0).getDate(); return m + '-' + String(Math.min(+e.payDay || 1, last)).padStart(2, '0'); }
/* paid = a salary payment has been recorded for this month; overdue = past this month's pay date and still unpaid */
function empMonthStatus(e){
  const m = curMonth();
  if (empPayments(e.id, m).length) return 'paid';
  if (!onPayroll(e) || (e.joinDate && e.joinDate.slice(0, 7) > m)) return 'na';
  return today() > payDueDate(e, m) ? 'overdue' : 'unpaid';
}

  return `<span class="av" style="width:${size}px;height:${size}px;font-size:${size * .38}px;background:hsl(${hue} 45% 42%)">${esc(ini)}</span>`;
}

  const paid = rows.filter(r => r.p);

/* ----- salary payments → agency expense (category Salaries) ----- */
function salaryForm(id, month){

}
const proHint = pro => `<div class="hint" style="background:#2a2210;border-color:#78560f;color:#f4c542"><span class="badge b-due">Pro-Rata</span> Joining month — ${proText(pro)}${pro.lastDay ? ' · ⚠ joined on the last day of the month (1 day)' : ''}</div>`;
function salMonthChanged(input, id){
  const e = empById(id), form = input.form, pro = proInfo(e), isPro = pro && pro.month === input.value;
  form.amount.value = dueAmount(e, input.value) || '';

/* a salary payment and its Agency Expense (category Salaries) are always created together */
function addSalaryPayment(e, month, amount, date, method, notes){
  const pid = uid(), xid = uid();
  salaryPay.push({id:pid, employee_id:e.id, month, amount, date, method, notes, expense_id:xid});
  expenses.push({id:xid, date, category:'Salaries', description:'Salary – ' + e.name + ' (' + monthName(month) + ')' + (notes ? ' · ' + notes : ''), amount, employee_id:e.id, salary_payment_id:pid});
}
function saveSalary(ev, id){
  ev.preventDefault(); const e = empById(id); const f = Object.fromEntries(new FormData(ev.target));
  if (!e || !(+f.amount > 0)) { alert('Enter the amount paid.'); return; }
  addSalaryPayment(e, f.month, Math.round(+f.amount * 100) / 100, f.date, f.method, (f.notes || '').trim());
  save(); closeModal(); render(); toast('Salary recorded · added to Agency Expenses');
}
const salExpense = p => expenses.find(x => x.id === p.expense_id || x.salary_payment_id === p.id);
const salDesc = (e, month, notes) => 'Salary – ' + (e ? e.name : 'Removed employee') + ' (' + monthName(month) + ')' + (notes ? ' · ' + notes : '');
function editSalary(pid){
  const p = salaryPay.find(x => x.id === pid), e = p && empById(p.employee_id); if (!p) return;
  openModal(`<h2>Edit Salary Payment · ${esc(e ? e.name : 'Removed employee')}</h2><form onsubmit="saveSalaryEdit(event,'${pid}')">
    <div class="hint">${monthName(p.month)}. Changes also update the matching entry in Agency Expenses, so Net Profit, My Share and Allah's Share recalculate straight away.</div>
    <div class="row2"><div class="field"><label>Amount (₨)</label><input name="amount" type="number" min="1" step="any" value="${p.amount}" required></div>
    <div class="field"><label>Date paid</label><input name="date" type="date" value="${p.date}" required></div></div>
    <div class="field"><label>Payment method</label><select name="method">${[...new Set([...PAY_METHODS, p.method].filter(Boolean))].map(x => `<option ${x === p.method ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></div>
    <div class="field"><label>Notes</label><input name="notes" value="${esc(p.notes || '')}"></div>
    <div class="modal-actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn">Save changes</button></div></form>`);
}
function saveSalaryEdit(ev, pid){
  ev.preventDefault(); const p = salaryPay.find(x => x.id === pid), f = Object.fromEntries(new FormData(ev.target)); if (!p) return;
  if (!(+f.amount > 0)) { alert('Enter the amount paid.'); return; }
  p.amount = Math.round(+f.amount * 100) / 100; p.date = f.date; p.method = f.method; p.notes = (f.notes || '').trim();
  const e = empById(p.employee_id); let x = salExpense(p);
  if (x) { x.amount = p.amount; x.date = p.date; x.description = salDesc(e, p.month, p.notes); }
  else { x = {id:uid(), date:p.date, category:'Salaries', description:salDesc(e, p.month, p.notes), amount:p.amount, employee_id:p.employee_id, salary_payment_id:p.id}; expenses.push(x); }   // the linked expense had been removed — restore it
  p.expense_id = x.id; x.salary_payment_id = p.id;
  save(); closeModal(); render(); toast('Salary payment updated · Agency Expenses recalculated');
}
function delSalary(pid){
  if (!confirm('Delete this salary payment? This will also remove it from expenses.')) return;
  const p = salaryPay.find(x => x.id === pid); if (!p) return;
  salaryPay = salaryPay.filter(x => x.id !== pid); expenses = expenses.filter(x => x.id !== p.expense_id && x.salary_payment_id !== pid); save(); render(); toast('Salary payment deleted · removed from expenses');
}
function delAllSalary(empId){
  const e = empById(empId); if (!e) return;
  if (!confirm('This will delete all salary payments for ' + e.name + ' and remove them from expenses. Are you sure?')) return;
  const ids = new Set(empPayments(empId).map(p => p.id)), xs = new Set(empPayments(empId).map(p => p.expense_id));
  salaryPay = salaryPay.filter(p => p.employee_id !== empId);
  expenses = expenses.filter(x => !(xs.has(x.id) || ids.has(x.salary_payment_id) || x.employee_id === empId));   // also sweeps up leftover salary entries whose payment record is gone
  save(); render(); toast('All salary payments for ' + e.name + ' deleted');
}

function empPhotoPick(input){
  const file = input.files && input.files[0]; if (!file) return;
  const img = new Image(), rd = new FileReader();

    const c = document.createElement('canvas'), n = 160, r = Math.min(img.width, img.height); c.width = c.height = n;
    c.getContext('2d').drawImage(img, (img.width - r) / 2, (img.height - r) / 2, r, r, 0, 0, n, n);
    _empPhoto = c.toDataURL('image/jpeg', .8); $('empPhotoPrev').innerHTML = `<img class="av" src="${_empPhoto}" style="width:64px;height:64px">`;
  }; img.src = rd.result; };
  rd.readAsDataURL(file);
}

function saveEmp(ev, id){
  ev.preventDefault(); let newId = null; const f = Object.fromEntries(new FormData(ev.target));

/* ========= Clients ========= */
const CL_STATUS = ['Lead','Onboarding','Active','Paused','Churned'];
const CL_COLORS = {Lead:'#64748b', Onboarding:'#3b82f6', Active:'#16a34a', Paused:'#f59e0b', Churned:'#dc2626'};
let clSel = null, clMode = 'list';
const clf = {q:'', s:''};
const clById = id => clients.find(c => c.id === id);
const clName = id => (clById(id) || {}).company || '—';
const clientInvoices = c => invoices.filter(i => i.clientId === c.id || ckey(i.client) === ckey(c.company));
const clBadge = st => `<span class="badge" style="background:${CL_COLORS[st]}22;color:${CL_COLORS[st]}">${st}</span>`;
/* renewal = the next anniversary of the contract start date (annual contracts) */
function nextRenewal(c){
  if (!c.contractStart || c.status !== 'Active') return null;
  const [sy, m, d] = c.contractStart.split('-').map(Number);
  for (let y = sy + 1; y < sy + 100; y++) { const r = iso(new Date(y, m - 1, d)); if (r >= today()) return r; }
  return null;
}
const renewalSoon = c => { const r = nextRenewal(c); return r && r <= addDays(today(), 30); };
const fmtTs = t => { const d = new Date(t); return d.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}) + ', ' + d.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'}).toLowerCase().replace(' ', ''); };
const initials = n => n.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
const hueOf = n => [...n].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 0);
const miniAv = (n, size = 24) => `<span class="av" title="${esc(n)}" style="width:${size}px;height:${size}px;font-size:${size * .4}px;background:hsl(${hueOf(n)} 45% 42%)">${esc(initials(n))}</span>`;

  ${clMode === 'pipeline' ? clPipeline() : `

const ordinalDay = n => n + (['th', 'st', 'nd', 'rd'][(n % 100 >> 3 ^ 1 && n % 10) || 0] || 'th');

function cleanHtml(html){
  const doc = new DOMParser().parseFromString('<body>' + html + '</body>', 'text/html'), ok = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'UL', 'OL', 'LI', 'BR', 'P', 'DIV', 'H3']);

/* ----- scope, filters, sorting, grouping ----- */
const scopeLists = () => cuScope.type === 'list' ? [listById(cuScope.id)].filter(Boolean) : cuLists;
const scopeTasks = () => cuScope.type === 'list' ? cuTasks.filter(t => t.listId === cuScope.id) : cuScope.type === 'mine' ? cuTasks.filter(t => cuPerson ? asgOf(t).includes(cuPerson) : !asgOf(t).length) : cuTasks;
function cuFiltered(){
  const q = cf.q.toLowerCase(), wk = weekRange();
  return scopeTasks().filter(t => {
    if (!cuShowClosed && !isOpenT(t)) return false;
    if (cf.assignee === '__none' ? asgOf(t).length : (cf.assignee && !asgOf(t).includes(cf.assignee))) return false;
    if (cf.priority && t.priority !== cf.priority) return false;
    if (cf.status === 'open' ? !isOpenT(t) : (cf.status && statusOf(t).name.toLowerCase() !== cf.status.toLowerCase())) return false;
    if (cf.tag && !(t.tags || []).includes(cf.tag)) return false;
    if (cf.due === 'today' && t.due !== today()) return false;
    if (cf.due === 'overdue' && !isOverdueT(t)) return false;
    if (cf.due === 'week' && !(t.due && t.due >= wk.from && t.due <= wk.to)) return false;
    if (cf.due === 'none' && t.due) return false;
    return !q || (t.title + ' ' + (t.description || '').replace(/<[^>]+>/g, ' ') + ' ' + (t.tags || []).join(' ')).toLowerCase().includes(q);
  });
}
function cuSorter(){
  const v = {due:t => t.due || '9999', priority:t => PRI[t.priority].o, created:t => t.created, title:t => t.title.toLowerCase(), status:t => statusOf(t).name.toLowerCase(), assignee:t => asgNames(t)[0] ? asgNames(t)[0].toLowerCase() : '~', est:t => t.estimate || 0, start:t => t.start || '9999'}[cuSortKey];
  return (a, b) => { const x = v(a), y = v(b); return (x < y ? -1 : x > y ? 1 : 0) * cuSortDir; };
}
function statusUnion(){ const seen = new Map(); scopeLists().forEach(l => l.statuses.forEach(s => { if (!seen.has(s.name.toLowerCase())) seen.set(s.name.toLowerCase(), s); })); return [...seen.values()]; }
function setStatusByName(t, name){ const s = listOf(t).statuses.find(x => x.name.toLowerCase() === name.toLowerCase()); if (!s) { toast('“' + name + '” is not a status in ' + listOf(t).name); return false; } cuSetStatus(t, s.id, true); return true; }
function groupDefs(){
  if (cuGroup === 'assignee') return [...employees.filter(e => !e.archived).map(e => ({key:'a' + e.id, label:e.name, color:'hsl(' + hueOf(e.name) + ' 55% 42%)', match:t => asgOf(t).includes(e.id), set:t => { t.assignees = [e.id]; return true; }})), {key:'a', label:'Unassigned', color:'#6b7280', match:t => !asgOf(t).length, set:t => { t.assignees = []; return true; }}];
  if (cuGroup === 'priority') return Object.entries(PRI).map(([k, p]) => ({key:'p' + k, label:p.l, color:p.c, match:t => t.priority === k, set:t => { t.priority = k; return true; }}));
  if (cuGroup === 'due') { const wk = weekRange(), td = today();
    return [['Overdue', '#ef4444', t => isOverdueT(t)], ['Earlier', '#6b7280', t => !!t.due && t.due < td && !isOverdueT(t)], ['Today', '#f59e0b', t => t.due === td], ['This week', '#3b82f6', t => !!t.due && t.due > td && t.due <= wk.to], ['Later', '#7c3aed', t => !!t.due && t.due > wk.to], ['No date', '#6b7280', t => !t.due]]
      .map(([label, color, match]) => ({key:'d' + label, label, color, match, set:null})); }
  return statusUnion().map(s => ({key:'s' + s.name.toLowerCase(), label:s.name, color:s.color, kind:s.kind, match:t => statusOf(t).name.toLowerCase() === s.name.toLowerCase(), set:t => setStatusByName(t, s.name)}));

async function resUpload(list, fid){
  const f = resFolderById(fid); if (!f) return; let ok = 0; const skipped = [];
  for (const file of [...list]) {
    if (file.size > RES_MAX) { skipped.push(file.name + ' (over ' + fmtSize(RES_MAX) + ')'); continue; }
    const id = uid();
    try { await idbPut(id, file); } catch(e) { skipped.push(file.name + ' (storage full or blocked)'); continue; }
    resFiles.push({id, folderId:fid, spaceId:f.spaceId, kind:'file', name:file.name, size:file.size, type:file.type || '', uploadedAt:new Date().toISOString(), by:cuAuthor}); ok++;
  }
  save(); render(); toast((ok ? ok + ' file' + (ok > 1 ? 's' : '') + ' uploaded' : 'Nothing uploaded') + (skipped.length ? ' · skipped: ' + skipped.join(', ') : ''));
}
function resDrop(ev, fid){ ev.preventDefault(); ev.currentTarget.classList.remove('dropping'); if (ev.dataTransfer.files.length) resUpload(ev.dataTransfer.files, fid); }
function resLinkForm(fid){
  openModal(`<h2>Add a link</h2><p class="muted" style="margin-bottom:10px;font-size:13px">For big files — paste a Google Drive, Dropbox or any web link.</p><form onsubmit="resSaveLink(event,'${fid}')">
    <div class="field"><label>Title</label><input name="name" placeholder="e.g. Brand guidelines (Drive)" required></div><div class="field"><label>URL</label><input name="url" type="url" placeholder="https://…" required></div>
    <div class="modal-actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn">Add link</button></div></form>`);
}
function resSaveLink(ev, fid){
  ev.preventDefault(); const f = Object.fromEntries(new FormData(ev.target)), fo = resFolderById(fid); if (!fo || !/^https?:\/\//i.test(f.url)) { alert('Enter a link starting with http:// or https://'); return; }
  resFiles.push({id:uid(), folderId:fid, spaceId:fo.spaceId, kind:'link', name:f.name.trim(), url:f.url.trim(), size:0, type:'link', uploadedAt:new Date().toISOString(), by:cuAuthor}); save(); closeModal(); render(); toast('Link added');
}
function saveBlobAs(blob, name){
  return (async () => {
    try { const dl = window.claude ? await window.claude.use('downloads') : null; if (dl) { await dl.save({filename:name, data:blob}); toast('Saved'); return; } }
    catch(e){ if (e && e.code === 'declined') return; if (e && e.code === 'rejected_extension') { toast('This file type can\'t be saved from the app viewer — open the app as a file to download it'); return; } }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  })();
}
async function resDownload(id){
  const r = resFiles.find(x => x.id === id); if (!r) return; const blob = await idbGet(id); if (!blob) { toast('File data not found on this device'); return; }
  try { const dl = window.claude ? await window.claude.use('downloads') : null; if (dl) { await dl.save({filename:r.name, data:blob}); toast('Saved'); return; } }
  catch(e){ if (e && e.code === 'declined') return; if (e && e.code === 'rejected_extension') { toast('This file type can\'t be saved from the app viewer — open the app as a file to download it'); return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = r.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}
async function resPreview(id){

function cuStatusForm(lid){

  openModal(`<h2>Statuses · ${esc(l.name)}</h2><p class="muted" style="margin-bottom:10px;font-size:13px">Rename, recolour, reorder or remove. “Kind” tells the app whether a status counts as open, done or closed (cancelled) — it drives overdue highlights and repeating tasks.</p>
    <form onsubmit="cuSaveStatuses(event,'${lid}')"><div id="stRows">${l.statuses.map(statusRow).join('')}</div>
    <button type="button" class="btn sm ghost" onclick="cuAddStatusRow()">+ Add status</button>
    <div class="modal-actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn">Save statuses</button></div></form>`, 'xl');
}
const statusRow = s => `<div class="strow" data-id="${s.id}"><input type="color" name="color" value="${s.color}"><input name="name" value="${esc(s.name)}" required><select name="kind">${[['open', 'Open'], ['done', 'Done'], ['closed', 'Closed']].map(([k, n]) => `<option value="${k}" ${s.kind === k ? 'selected' : ''}>${n}</option>`).join('')}</select>
  <button type="button" class="btn sm ghost" onclick="stMove(this,-1)">▲</button><button type="button" class="btn sm ghost" onclick="stMove(this,1)">▼</button><button type="button" class="btn sm danger" onclick="this.parentNode.remove()">✕</button></div>`;
function cuAddStatusRow(){ $('stRows').insertAdjacentHTML('beforeend', statusRow({id:'new' + uid(), name:'', color:CU_COLORS[Math.floor(Math.random() * CU_COLORS.length)], kind:'open'})); }
function stMove(btn, d){ const row = btn.parentNode; if (d < 0 && row.previousElementSibling) row.parentNode.insertBefore(row, row.previousElementSibling); if (d > 0 && row.nextElementSibling) row.parentNode.insertBefore(row.nextElementSibling, row); }
function cuSaveStatuses(ev, lid){
  ev.preventDefault(); const l = listById(lid);
  const next = [...document.querySelectorAll('#stRows .strow')].map(r => ({id:r.dataset.id.startsWith('new') ? uid() : r.dataset.id, name:r.querySelector('[name=name]').value.trim(), color:r.querySelector('[name=color]').value, kind:r.querySelector('[name=kind]').value})).filter(s => s.name);
  if (!next.length) { alert('A list needs at least one status.'); return; }
  const removed = l.statuses.filter(s => !next.some(n => n.id === s.id)), moved = cuTasks.filter(t => t.listId === lid && removed.some(s => s.id === t.status));
  if (moved.length && !confirm(moved.length + ' task(s) use a removed status and will move to “' + next[0].name + '”. Continue?')) return;
  moved.forEach(t => t.status = next[0].id); l.statuses = next; save(); closeModal(); render();
}

  cuTasks.push(t); cuComments.push({id:uid(), taskId:t.id, at:t.created, by:'You', text:o.activityText || 'created this task', kind:'activity'}); delete t.activityText; return t;

function cuQuickAdd(o = {}){

  setTimeout(() => { const i = document.querySelector('#modal input[name=title]'); if (i) i.focus(); }, 30);

function cuSaveQuick(ev){
  ev.preventDefault(); const f = Object.fromEntries(new FormData(ev.target));
  cuNewTask({listId:f.listId, title:f.title.trim(), assignees:f.assignee ? [f.assignee] : [], due:f.due, priority:f.priority}); save(); closeModal(); render(); toast('Task created');
}
function cuAddInline(gi, listId, input){
  const def = groupDefs()[gi], title = input.value.trim(); if (!title) return;
  const lid = listId || (cuScope.type === 'list' ? cuScope.id : ''); if (!lid) { cuQuickAdd({title}); return; }
  const t = cuNewTask({listId:lid, title}); if (def && def.set) def.set(t); cuAddCol = null; save(); render();
}
function nextDue(t){
  const base = t.due || today();
  if (t.repeat === 'daily') return addDays(base, 1);
  if (t.repeat === 'weekly') return addDays(base, 7);
  if (t.repeat === 'custom') return addDays(base, Math.max(1, +t.repeatDays || 1));
  const d = new Date(base + 'T00:00:00'), day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + 1); d.setDate(Math.min(day, monthDays(iso(d).slice(0, 7)))); return iso(d);
}
function cuSpawn(t){
  const l = listOf(t), n = cuNewTask({...t, id:uid(), assignees:[...asgOf(t)], tags:[...(t.tags || [])], status:l.statuses.find(s => s.kind === 'open').id, due:nextDue(t), start:'', spawned:false, created:new Date().toISOString(), activityText:'created this recurring task'});
  cuSubs.filter(s => s.taskId === t.id).forEach(s => cuSubs.push({id:uid(), taskId:n.id, title:s.title, done:false}));
  t.spawned = true; toast('Repeating task — next one created for ' + fdate(n.due));
}
function cuSetStatus(t, sid, noRender){
  const old = statusOf(t), l = listOf(t), s = l.statuses.find(x => x.id === sid); if (!s || s.id === t.status) return;
  t.status = sid; cuComments.push({id:uid(), taskId:t.id, at:new Date().toISOString(), by:'You', text:'changed status from ' + old.name + ' to ' + s.name, kind:'activity'});
  if (s.kind === 'done' && t.repeat && !t.spawned) cuSpawn(t);
  save(); if (!noRender) render();
}
function cuToggleDone(id){ const t = taskById(id), l = listOf(t); if (!t) return; if (statusOf(t).kind === 'done') cuSetStatus(t, l.statuses.find(s => s.kind === 'open').id); else cuSetStatus(t, (l.statuses.find(s => s.kind === 'done') || l.statuses[l.statuses.length - 1]).id); }
function cuSetField(id, field, val){
  const t = taskById(id); if (!t) return;
  if (field === 'status') { cuSetStatus(t, val); return; }
  if (field === 'tags') val = Array.isArray(val) ? val : parseTags(val);
  if (field === 'estimate') val = Math.max(0, +val || 0);
  if (field === 'title') { val = val.trim(); if (!val) return; }
  if (field === 'listId') { const l = listById(val), old = statusOf(t); t.status = (l.statuses.find(s => s.name.toLowerCase() === old.name.toLowerCase()) || l.statuses[0]).id; }
  t[field] = val; save(); render();
}
function cuMove(id, gi){
  const t = taskById(id), g = groupDefs()[gi]; if (!t || !g) return;
  if (!g.set) { toast('Cannot drop into a due-date group — change the date instead'); return; }
  if (g.match(t)) return; if (g.set(t)) { save(); render(); }
}
function cuDelTask(id){ const t = taskById(id); if (t && confirm('Delete "' + t.title + '" with its subtasks, comments and time logs?')) { cuRemoveTaskData(t); save(); render(); } }

function cuSortBy(k){ if (cuSortKey === k) cuSortDir = -cuSortDir; else { cuSortKey = k; cuSortDir = 1; } render(); }
const cuEditStart = (id, f) => { cuEdit = {id, f}; render(); };
const cuEditEnd = () => { if (cuEdit) { cuEdit = null; render(); } };
function cuCell(t, f){
  const ed = cuEdit && cuEdit.id === t.id && cuEdit.f === f, id = t.id, st = statusOf(t);
  const commit = v => `cuEdit=null;cuSetField('${id}','${f}',${v})`, txt = (extra = '') => `data-edit onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape'){cuEdit=null;render()}" ${extra}`;

function cuNav(d){ if (d === 0) cuMonth = today().slice(0, 7); else { const [y, m] = cuMonth.split('-').map(Number); cuMonth = iso(new Date(y, m - 1 + d, 1)).slice(0, 7); } render(); }

  const dn = [[1, 'Mon'], [2, 'Tue'], [3, 'Wed'], [4, 'Thu'], [5, 'Fri'], [6, 'Sat'], [0, 'Sun']];
  return `<div class="card" style="max-width:640px"><h3>Work hours</h3><p class="muted" style="margin-bottom:14px;font-size:13px">These settings decide who is Late, Half Day or Absent, and when dashboard alerts appear.</p>
    <form onsubmit="attSaveSettings(event)"><div class="row2"><div class="field"><label>Official start time</label><input type="time" name="start" value="${s.start_time}" required></div><div class="field"><label>Official end time</label><input type="time" name="end" value="${s.end_time}" required></div></div>
    <div class="field"><label>Working days</label><div style="display:flex;gap:8px;flex-wrap:wrap">${dn.map(([n, l]) => `<label class="chk" style="margin:0"><input type="checkbox" name="d${n}" ${s.working_days.includes(n) ? 'checked' : ''}> ${l}</label>`).join('')}</div></div>
    <div class="row2"><div class="field"><label>Alert if not checked in after (minutes past start)</label><input type="number" name="alert" min="0" max="480" value="${s.alert_minutes}"></div><div class="field"><label>Half day = fewer than (hours)</label><input type="number" name="half" min="0" max="12" step="0.5" value="${s.half_day_hours}"></div></div>
    <div class="field"><label>Start counting attendance from</label><input type="date" name="track" value="${s.tracking_start}" required><div class="muted" style="font-size:12px;margin-top:4px">Days before this date are never marked absent.</div></div>
    <div class="field"><label>Timezone</label><input name="tz" list="tzList" value="${esc(s.timezone)}" required><datalist id="tzList">${['Asia/Karachi', 'Asia/Dubai', 'Asia/Riyadh', 'Asia/Kolkata', 'Asia/Dhaka', 'Europe/London', 'Europe/Berlin', 'America/New_York', 'America/Chicago', 'America/Los_Angeles', 'Australia/Sydney', 'UTC'].map(z => `<option value="${z}">`).join('')}</datalist></div>
    <div class="modal-actions" style="justify-content:flex-start"><button class="btn">Save settings</button></div></form></div>`;
}
async function attSaveSettings(ev){
  ev.preventDefault(); const f = Object.fromEntries(new FormData(ev.target));
  try { await MB.api('/api/admin/work-settings', {method:'PUT', body:{start_time:f.start, end_time:f.end, working_days:[0, 1, 2, 3, 4, 5, 6].filter(n => f['d' + n]), alert_minutes:+f.alert, half_day_hours:+f.half, timezone:f.tz, tracking_start:f.track}}); attView.key = ''; await attLoadOverview(); toast('Work hours saved — statuses recalculated'); render(); }
  catch (e) { toast(e.message); }
}

/* ========= Real-time rooms (Durable Objects) in the admin app ========= */
const rtRooms = {};   // slot id → {key, el, inst}: a room keeps its socket while the DOM around it is repainted
function rtAttach(slotId, spec){
  const slot = $(slotId), cur = rtRooms[slotId];
  if (!slot || !spec) { if (cur) { cur.inst.close(); delete rtRooms[slotId]; } return; }
  if (!cur || cur.key !== spec.key) {
    if (cur) cur.inst.close();
    const el = document.createElement('div'); el.style.cssText = 'height:100%;display:flex;flex-direction:column;min-height:0'; rtRooms[slotId] = {key:spec.key, el, inst:MB.chat.mount(el, spec.opts)};
  }
  if (rtRooms[slotId].el.parentNode !== slot) slot.appendChild(rtRooms[slotId].el);
}
function rtSync(){
  let chat = null, taskRoom = null;
  if (view === 'tasks' && $('rcSlot')) { const c = chatCtx(); if (c && c.kind === 'channel') chat = {key:'channel:' + c.ch.id, opts:{kind:'channel', id:c.ch.id}}; else if (c && c.kind === 'dm') { const id = dmPeer(c.emp); chat = {key:'dm:' + id, opts:{kind:'dm', id, peerId:id}}; } }
  if (view === 'tasks' && cuPanelId && $('cuRoomSlot') && taskById(cuPanelId)) taskRoom = {key:'task:' + cuPanelId, opts:{kind:'task', id:cuPanelId, variant:'task', clientToggle:true}};
  rtAttach('rcSlot', chat); rtAttach('cuRoomSlot', taskRoom);
}
const rtBadge = n => n ? `<i class="rc-badge">${n > 99 ? '99+' : n}</i>` : '';
const rtDot = e => { const u = portalOf('employee', e.id); return u ? `<span class="cdot ${MB.rt.online.has(u.id) ? '' : 'off'}" title="${MB.rt.online.has(u.id) ? 'Online' : 'Offline'}"></span>` : ''; };
let rtSnap = '';
function rtOnTick(what){
  if (what !== 'unread' && what !== 'presence') return;
  const sig = JSON.stringify([MB.rt.unread, [...MB.rt.online]]); if (sig === rtSnap) return; rtSnap = sig;
  const nb = document.querySelector('#nav button[data-view="tasks"]'), n = MB.rt.unread.total || 0; if (nb) nb.innerHTML = '✅ Tasks' + (n ? `<span class="nbadge" title="${n} unread message${n > 1 ? 's' : ''}">${n > 99 ? '99+' : n}</span>` : '');
  const ae = document.activeElement; if (view === 'tasks' && !(ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) && !$('overlay').classList.contains('open')) render();   // refresh sidebar badges / dots
}

/* ========= Boot ========= */
(async function boot(){
  try {
    const me = await MB.guard('admin');
    $('whoAmI').textContent = me.email;
    let state = await MB.api('/api/admin/state');
    store.hydrate(state); portalUsers = state.users || []; chanMembers = state.members || {}; lastChanges = state.now - 3000;
    // safety net: the legacy "first run" path empties every list — never let it fire when the database already holds records
    if (!store.getItem('data_version') && SYNC_KEYS.some(k => { try { return JSON.parse(store.mem[k] || '[]').length; } catch (e) { return false; } })) store.mem.data_version = '4';
    MB.theme.paint(); MB.att.injectCss(); MB.rt.start(); MB.rt.bindStatus($('rtStat')); MB.rt.on(rtOnTick); init(); render(); attLoadOverview(); setInterval(attPoll, 60000);
    $('syncStat').textContent = '✓ All changes saved';
    if (backfillNote) setTimeout(() => toast(backfillNote), 600);
    setInterval(pollChanges, 6000);
    setInterval(async () => { try { portalUsers = (await MB.api('/api/admin/users')).users; } catch (e) {} }, 60000);
  } catch (e) {
    if (e && e.message !== 'Session expired') { $('view').innerHTML = `<div class="card empty">Could not load your data: ${esc(e.message)}<br><br><button class="btn" onclick="location.reload()">Retry</button></div>`; }
  }
})();

</script>
