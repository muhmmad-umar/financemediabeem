<!doctype html>
<html lang="en" data-portal="employee">
<head>
<meta charset="utf-8">
<script>/* apply the saved theme before first paint (no flash) */(function(){var r=document.documentElement,p=r.getAttribute('data-portal'),t=null;try{t=localStorage.getItem('mb_theme_'+p)}catch(e){}r.setAttribute('data-theme',t==='light'||t==='dark'?t:(p==='client'?'light':'dark'));})();</script>
<link rel="stylesheet" href="theme.css?v=20261024a">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Media Beem — Employee</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal.css?v=20261024a">
</head>
<body>
<script src="config.js?v=20261024a"></script>
<script src="portal.js?v=20261024a"></script>
<script src="chat.js?v=20261024a"></script>
<script src="tasks.js?v=20261024a"></script>
<script src="punch.js?v=20261024a"></script>
<script>
(async () => {
  const user = await MB.guard('employee');
  const { esc, fmt, fdate, $ } = MB;
  let pane = null, curKey = '', viewSeq = 0;
  const stopPane = () => { if (pane) { pane.stop(); pane = null; } };
  const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const isDone = t => t.status_kind === 'done' || t.status_kind === 'closed';

  MB.att.injectCss();
  const A = MB.att;
  const shell = MB.shell({
    user, role: 'employee',
    items: [{ key: 'tasks', label: 'Tasks', icon: '✅' }, { key: 'attendance', label: 'Attendance', icon: '🕘' }, { key: 'channels', label: 'Channels', icon: '#' }, { key: 'dms', label: 'Direct Messages', icon: '💬' }, { key: 'profile', label: 'Profile', icon: '👤' }],
    titles: { tasks: ['Tasks', 'Spaces, lists and everything your team is working on'], attendance: ['Attendance', 'Check in, log your day and see your history'], channels: ['Channels', 'Team channels you have been added to'], dms: ['Direct Messages', 'Chat with the admin and your teammates'], profile: ['Profile', 'Your details and salary history'] },
    onView: key => { stopPane(); curKey = key; viewSeq++; ({ tasks: viewTasks, attendance: viewAttendance, channels: viewChannels, dms: viewDms, profile: viewProfile })[key](); },
  });

  MB.punch.mount($('topRight'));
  MB.punch.listeners.push(() => { if (curKey === 'attendance') viewAttendance(); });

  /* ---------------- Tasks (full workspace) ---------------- */
  async function viewTasks() {
    const seq = viewSeq; $('view').innerHTML = '<div class="empty">Loading…</div>';
    const p = await MB.tasks.mount($('view'));
    if (seq !== viewSeq) p.stop(); else { pane = p; MB.punch.openActive = id => { if (curKey === 'tasks' && pane && pane.openTask) pane.openTask(id); else { MB.openTaskId = id; shell.go('tasks'); } }; if (MB.openTaskId && p.openTask) { const id = MB.openTaskId; MB.openTaskId = null; p.openTask(id); } }
  }

  /* ---------------- Attendance ---------------- */
  let attMonth = null;
  async function viewAttendance() {
    const v = $('view'); v.innerHTML = '<div class="empty">Loading…</div>';
    let td, hist;
    try { td = await MB.api('/api/employee/attendance/today'); } catch (e) { v.innerHTML = `<div class="card empty">${esc(e.message)}</div>`; return; }
    attMonth = attMonth || td.now.date.slice(0, 7);
    try { hist = await MB.api('/api/employee/attendance?month=' + attMonth); } catch (e) { hist = null; }
    paintAttendance(td, hist);
  }
  function paintAttendance(td, hist) {
    stopPane();
    const s = td.settings, tz = s.timezone, log = td.log, open = A.isOpen(log), dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const label = !log ? 'Check In' : open ? 'Check Out' : 'Check In again';
    const mine = td.my_tasks.slice().sort((a, b) => (a.due || '9').localeCompare(b.due || '9')), picked = new Set(log ? log.task_ids : []);
    const rec = hist ? (() => { const byDate = {}; hist.logs.forEach(l => { byDate[l.date] = l; }); return { byDate, ctx: { settings: hist.settings, now: hist.now, logsByDate: byDate, leaves: new Set(hist.leaves.map(l => l.date)), join: hist.join_date } }; })() : null;
    $('view').innerHTML = `<div class="card"><div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
        <div style="flex:1;min-width:220px"><div class="muted" style="font-size:12px;text-transform:uppercase;letter-spacing:.07em">Today · ${dayNames[A.dow(td.now.date)]}</div><div style="font-size:22px;font-weight:700;color:var(--strong)">${A.longDate(td.now.date)}</div>
          <div class="muted" style="margin-top:4px">Work hours ${A.t12(s.start_time)} – ${A.t12(s.end_time)}${log ? ' · ' + A.pill(log.status) : ''}</div>
          <div style="margin-top:10px;font-size:26px;font-weight:700;color:var(--strong)" id="liveH">${A.fmtH(A.liveHours(log, td.now.iso))}</div><div class="muted" style="font-size:12px">${open ? 'Checked in — timer running' : log ? 'Checked out' : 'Not checked in yet'}</div></div>
        <button class="btn ac-big ${open ? 'out' : ''}" id="punchBtn">${open ? '⏹ ' : '▶ '}${label}</button></div>
      ${td.stale_open ? `<div class="login-err" style="margin-top:14px">You did not check out on ${A.longDate(td.stale_open.date)}. It will be closed at the official end time when you next check in or out.</div>` : ''}
      ${log && log.sessions.length ? `<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:8px">${log.sessions.map(x => `<div class="row" style="padding:6px 0"><div class="grow">🟢 In <b>${A.fmtTime(x.check_in, tz)}</b></div><div class="grow">${x.check_out ? '🔴 Out <b>' + A.fmtTime(x.check_out, tz) + '</b>' : '<span class="muted">working…</span>'}</div></div>`).join('')}</div>` : ''}</div>
    <div class="card"><h3>📝 Today's report</h3>${log ? '' : '<div class="muted" style="margin-bottom:10px">Check in first, then write what you worked on today.</div>'}
      <textarea id="actNote" rows="4" maxlength="4000" placeholder="What did you work on today?" ${log ? '' : 'disabled'}>${esc(log ? log.activity_note : '')}</textarea>
      <div class="task-sec" style="margin-top:14px"><h4>Tasks I worked on</h4>${mine.map(t => `<label class="sub"><input type="checkbox" data-t="${esc(t.id)}" ${picked.has(t.id) ? 'checked' : ''} ${log ? '' : 'disabled'}><span>${esc(t.title)}</span></label>`).join('') || '<div class="muted">No tasks are assigned to you.</div>'}</div>
      <button class="btn" id="saveRep" ${log ? '' : 'disabled'}>Save report</button></div>
    <div class="card"><h3>History</h3>${rec ? `<div class="ac-nav"><button class="btn ghost sm" id="mPrev">‹</button><b>${A.monthLabel(attMonth)}</b><button class="btn ghost sm" id="mNext">›</button></div>${A.summaryHtml(A.summary(attMonth, rec.ctx))}${A.calendar(attMonth, rec.ctx)}` : '<div class="muted">Could not load history.</div>'}</div>`;
    const reload = () => viewAttendance();
    $('punchBtn').onclick = () => MB.punch.toggle();   // same flow as the top-bar button (asks for a note when checking out)
    $('saveRep').onclick = async () => {
      try { await MB.api('/api/employee/attendance/report', { method: 'PUT', body: { activity_note: $('actNote').value, task_ids: [...document.querySelectorAll('[data-t]:checked')].map(c => c.dataset.t) } }); MB.toast('Report saved'); MB.punch.refresh().catch(() => {}); } catch (e) { MB.toast(e.message); }
    };
    if (open) { const base = Date.now(); pane = { timer: setInterval(() => { const el = $('liveH'); if (el) el.textContent = A.fmtH(A.liveHours(log, new Date(Date.parse(td.now.iso) + Date.now() - base).toISOString())); }, 15000), stop() { clearInterval(this.timer); } }; }
    if (rec) {
      $('mPrev').onclick = () => { attMonth = A.shiftMonth(attMonth, -1); reload(); }; $('mNext').onclick = () => { attMonth = A.shiftMonth(attMonth, 1); reload(); };
      $('view').querySelectorAll('.ac-click').forEach(c => c.onclick = () => { const d = c.dataset.date; MB.openModal(`<h2>${A.longDate(d)}</h2>${A.dayDetail(rec.byDate[d], tz, hist.task_titles, hist.now.iso)}<div class="modal-actions"><button class="btn ghost" id="cx">Close</button></div>`); $('cx').onclick = MB.closeModal; });
    }
  }

  /* ---------------- Channels / DMs ---------------- */
  /* unread badges (sidebar + conversation lists) and green online dots, refreshed whenever the unread / presence poll lands */
  function paintBadges() {
    const u = MB.rt.unread, sum = o => Object.values(o || {}).reduce((a, b) => a + b, 0), set = (el, n) => { if (!el) return; el.hidden = !n; el.textContent = n > 99 ? '99+' : n; };
    const nbC = $('nb-channels'), nbD = $('nb-dms'); [[nbC, sum(u.channels)], [nbD, sum(u.dms)]].forEach(([el, n]) => { if (el) { el.style.display = n ? '' : 'none'; el.textContent = n; } });
    document.querySelectorAll('[data-bch]').forEach(el => set(el, u.channels[el.dataset.bch]));
    document.querySelectorAll('[data-bdm]').forEach(el => set(el, u.dms[el.dataset.bdm]));
    document.querySelectorAll('[data-dot]').forEach(el => el.classList.toggle('off', !MB.rt.online.has(el.dataset.dot)));
  }
  MB.rt.on(w => { if (w === 'unread' || w === 'presence') paintBadges(); });

  function chatLayout(listHtml, wireList) {
    $('view').innerHTML = `<div class="chat"><div class="chat-list" id="clist">${listHtml}</div><div class="chat-pane" id="cpane"><div class="chat-none" style="margin:auto">Select a conversation</div></div></div>`;
    wireList(); paintBadges();
  }
  async function viewChannels() {
    $('view').innerHTML = '<div class="empty">Loading…</div>';
    let chans; try { chans = (await MB.api('/api/employee/channels')).channels; } catch (e) { $('view').innerHTML = `<div class="card empty">${esc(e.message)}</div>`; return; }
    if (!chans.length) { $('view').innerHTML = '<div class="card empty">You have not been added to any channels yet. The admin can add you to a team channel.</div>'; return; }
    const spaces = [...new Set(chans.map(c => c.space_name || 'General'))];
    chatLayout(spaces.map(s => `<h5>${esc(s)}</h5>${chans.filter(c => (c.space_name || 'General') === s).map(c => `<button data-id="${esc(c.id)}"><span class="muted">#</span> ${esc(c.name)}<i class="rc-badge" data-bch="${esc(c.id)}" hidden></i></button>`).join('')}`).join(''), () => {
      document.querySelectorAll('#clist button').forEach(b => b.onclick = () => {
        stopPane(); document.querySelectorAll('#clist button').forEach(x => x.classList.toggle('on', x === b));
        const c = chans.find(x => x.id === b.dataset.id);
        const inst = MB.chat.mount($('cpane'), { kind: 'channel', id: c.id, title: '# ' + c.name }); pane = { stop: () => inst.close() };
      });
      document.querySelector('#clist button').click();
    });
  }
  async function viewDms() {
    $('view').innerHTML = '<div class="empty">Loading…</div>';
    let cs; try { cs = (await MB.api('/api/employee/contacts')).contacts; } catch (e) { $('view').innerHTML = `<div class="card empty">${esc(e.message)}</div>`; return; }
    if (!cs.length) { $('view').innerHTML = '<div class="card empty">No one to message yet.</div>'; return; }
    const admins = cs.filter(c => c.role === 'admin'), team = cs.filter(c => c.role !== 'admin');
    const btn = c => `<button data-id="${esc(c.id)}">${MB.avatar(c.name)} ${esc(c.name)}${c.role === 'admin' ? ' <span class="muted">· Admin</span>' : ''}<span class="cdot off" data-dot="${esc(c.id)}"></span><i class="rc-badge" data-bdm="${esc(c.id)}" hidden></i></button>`;
    chatLayout((admins.length ? '<h5>Admin</h5>' + admins.map(btn).join('') : '') + (team.length ? '<h5>Teammates</h5>' + team.map(btn).join('') : ''), () => {
      document.querySelectorAll('#clist button').forEach(b => b.onclick = () => {
        stopPane(); document.querySelectorAll('#clist button').forEach(x => x.classList.toggle('on', x === b));
        const c = cs.find(x => x.id === b.dataset.id);
        const inst = MB.chat.mount($('cpane'), { kind: 'dm', id: c.id, peerId: c.id, title: c.name }); pane = { stop: () => inst.close() };
      });
      document.querySelector('#clist button').click();
    });
  }

  /* ---------------- Profile + own salary ---------------- */
  async function viewProfile() {
    const v = $('view'); v.innerHTML = '<div class="empty">Loading…</div>';
    let r; try { r = await MB.api('/api/employee/me'); } catch (e) { v.innerHTML = `<div class="card empty">${esc(e.message)}</div>`; return; }
    const e = r.employee || {}, pays = r.salary_payments || [], kv = (l, val) => `<div class="row"><div class="grow muted">${l}</div><div>${val ? esc(val) : '—'}</div></div>`;
    const ytd = pays.filter(p => String(p.month).slice(0, 4) === String(new Date().getFullYear())).reduce((t, p) => t + (+p.amount || 0), 0);
    v.innerHTML = `<div class="grid" style="margin-bottom:16px"><div class="stat"><div class="l">Monthly salary</div><div class="v">${e.salary ? fmt(e.salary) : '—'}</div></div><div class="stat"><div class="l">Paid this year</div><div class="v">${fmt(ytd)}</div></div><div class="stat"><div class="l">Payments received</div><div class="v">${pays.length}</div></div></div>
      <div class="card"><h3>Your details</h3>${kv('Name', e.name || r.user.name)}${kv('Role', e.designation)}${kv('Employment type', e.type)}${kv('Joined', e.joinDate ? fdate(e.joinDate) : '')}${kv('Email', e.email || r.user.email)}${kv('Phone', e.phone)}${kv('Pay method', e.payMethod)}</div>
      <div class="card"><h3>Salary history</h3><div class="tablewrap"><table><thead><tr><th>Month</th><th>Paid on</th><th>Method</th><th>Note</th><th class="num">Amount</th></tr></thead><tbody>
        ${pays.map(p => `<tr><td>${esc(p.month)}${p.is_prorata ? ' <span class="badge b-partial">Pro-rata</span>' : ''}</td><td>${fdate(p.date)}</td><td>${esc(p.method || '—')}</td><td class="muted">${esc(p.notes || '')}</td><td class="num"><b>${fmt(p.amount)}</b></td></tr>`).join('') || '<tr><td colspan="5" class="empty">No salary payments recorded yet</td></tr>'}</tbody></table></div></div>
      <div class="card"><h3>Change password</h3><form id="pwForm" style="max-width:340px"><div style="margin-bottom:10px"><input type="password" id="pwCur" placeholder="Current password" autocomplete="current-password" required></div><div style="margin-bottom:10px"><input type="password" id="pwNew" placeholder="New password (min 8 characters)" minlength="8" autocomplete="new-password" required></div><button class="btn sm">Update password</button></form></div>`;
    $('pwForm').onsubmit = async ev => { ev.preventDefault(); try { await MB.api('/api/auth/change-password', { method: 'POST', body: { current_password: $('pwCur').value, new_password: $('pwNew').value } }); $('pwCur').value = $('pwNew').value = ''; MB.toast('Password updated'); } catch (er) { MB.toast(er.message); } };
  }
})();
</script>
</body>
</html>
