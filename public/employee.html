<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Media Beem — Employee</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal.css">
</head>
<body>
<script src="config.js"></script>
<script src="portal.js"></script>
<script>
(async () => {
  const user = await MB.guard('employee');
  const { esc, fmt, fdate, $ } = MB;
  let tasks = [], lists = {}, filter = 'open', pane = null, me = null;
  const stopPane = () => { if (pane) { pane.stop(); pane = null; } };
  const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const isDone = t => t.status_kind === 'done' || t.status_kind === 'closed';

  const shell = MB.shell({
    user, role: 'employee',
    items: [{ key: 'tasks', label: 'My Tasks', icon: '✅' }, { key: 'channels', label: 'Channels', icon: '#' }, { key: 'dms', label: 'Direct Messages', icon: '💬' }, { key: 'profile', label: 'Profile', icon: '👤' }],
    titles: { tasks: ['My Tasks', 'Everything assigned to you'], channels: ['Channels', 'Team channels you have been added to'], dms: ['Direct Messages', 'Chat with the admin and your teammates'], profile: ['Profile', 'Your details and salary history'] },
    onView: key => { stopPane(); ({ tasks: viewTasks, channels: viewChannels, dms: viewDms, profile: viewProfile })[key](); },
  });

  /* ---------------- My Tasks ---------------- */
  async function viewTasks() {
    const v = $('view'); v.innerHTML = '<div class="empty">Loading…</div>';
    try { const r = await MB.api('/api/employee/tasks'); tasks = r.tasks; lists = r.lists; } catch (e) { v.innerHTML = `<div class="card empty">${esc(e.message)}</div>`; return; }
    paintTasks();
  }
  function paintTasks() {
    const t0 = today(), open = tasks.filter(t => !isDone(t));
    const shown = tasks.filter(t => filter === 'all' || (filter === 'open' ? !isDone(t) : isDone(t)));
    const groups = filter === 'done' ? [['Completed', shown]] : [
      ['Overdue', shown.filter(t => !isDone(t) && t.due && t.due < t0)], ['Due today', shown.filter(t => !isDone(t) && t.due === t0)],
      ['Upcoming', shown.filter(t => !isDone(t) && t.due && t.due > t0)], ['No due date', shown.filter(t => !isDone(t) && !t.due)],
      ['Completed', filter === 'all' ? shown.filter(isDone) : []]];
    const row = t => { const sd = t.subtasks.filter(s => s.done).length;
      return `<div class="row click" data-id="${esc(t.id)}">${MB.statusPill(t.status_name, t.status_color)}<div class="grow"><div class="t1">${esc(t.title)}</div><div class="t2">${esc(t.space.name || '')}${t.list.name ? ' › ' + esc(t.list.name) : ''}${t.subtasks.length ? ' · ' + sd + '/' + t.subtasks.length + ' subtasks' : ''}</div></div>
        <div class="t2 ${!isDone(t) && t.due && t.due < t0 ? 'due-late' : ''}">${t.due ? fdate(t.due) : ''}</div></div>`; };
    $('view').innerHTML = `<div class="grid" style="margin-bottom:16px"><div class="stat"><div class="l">Open tasks</div><div class="v">${open.length}</div></div>
      <div class="stat"><div class="l">Overdue</div><div class="v" style="color:${open.some(t => t.due && t.due < t0) ? 'var(--red)' : '#fff'}">${open.filter(t => t.due && t.due < t0).length}</div></div>
      <div class="stat"><div class="l">Completed</div><div class="v">${tasks.length - open.length}</div></div></div>
      <div class="tabs">${[['open', 'Open'], ['done', 'Completed'], ['all', 'All']].map(([k, l]) => `<button class="${filter === k ? 'on' : ''}" data-f="${k}">${l}</button>`).join('')}</div>
      ${groups.filter(g => g[1].length).map(([n, a]) => `<div class="card task-sec"><h4>${n} · ${a.length}</h4>${a.map(row).join('')}</div>`).join('') || '<div class="card empty">Nothing here — you are all caught up. 🎉</div>'}`;
    $('view').querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filter = b.dataset.f; paintTasks(); });
    $('view').querySelectorAll('.row.click').forEach(r => r.onclick = () => openTask(r.dataset.id));
  }
  function openTask(id) {
    const t = tasks.find(x => x.id === id); if (!t) return;
    const sts = (lists[t.list.id] || {}).statuses || [];
    MB.openModal(`<h2>${esc(t.title)}</h2>
      <div class="t2" style="margin-bottom:12px">${esc(t.space.name || '')}${t.list.name ? ' › ' + esc(t.list.name) : ''}${t.due ? ' · Due ' + fdate(t.due) : ''}${t.priority && t.priority !== 'normal' ? ' · ' + esc(t.priority) + ' priority' : ''}</div>
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:14px"><label class="muted" for="stSel">Status</label><select id="stSel" style="width:auto">${sts.map(s => `<option value="${esc(s.id)}" ${s.id === t.status ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select>
        ${isDone(t) ? '' : `<button class="btn sm" id="doneBtn">Mark complete</button>`}</div>
      ${t.description ? `<div class="task-sec"><h4>Description</h4><div class="desc">${MB.sanitize(t.description)}</div></div>` : ''}
      ${t.subtasks.length ? `<div class="task-sec"><h4>Subtasks</h4>${t.subtasks.map(s => `<label class="sub"><input type="checkbox" data-sub="${esc(s.id)}" ${s.done ? 'checked' : ''}><span style="${s.done ? 'text-decoration:line-through;color:var(--muted)' : ''}">${esc(s.title)}</span></label>`).join('')}</div>` : ''}
      <div class="task-sec"><h4>Activity &amp; comments</h4><div id="cms">${t.comments.map(c => c.kind === 'activity' ? `<div class="cm act">${esc(c.by)} ${esc(c.text)} <span class="at">${MB.fmtTs(c.at)}</span></div>` : `<div class="cm"><span class="by">${esc(c.by)}</span><span class="at">${MB.fmtTs(c.at)}</span><div style="white-space:pre-wrap">${esc(c.text)}</div></div>`).join('') || '<div class="muted">No comments yet.</div>'}</div></div>
      <form id="cmForm" style="display:flex;gap:8px"><textarea id="cmIn" rows="2" placeholder="Write a comment…" maxlength="4000" required></textarea><button class="btn">Post</button></form>
      <div class="modal-actions"><button class="btn ghost" id="closeBtn">Close</button></div>`);
    const upd = r => { const nt = r.tasks[0]; tasks = tasks.map(x => x.id === id ? nt : x); paintTasks(); openTask(id); };
    $('closeBtn').onclick = MB.closeModal;
    $('stSel').onchange = async e => { try { upd(await MB.api('/api/employee/tasks/' + id, { method: 'PATCH', body: { status: e.target.value } })); } catch (er) { MB.toast(er.message); } };
    const db = $('doneBtn'); if (db) db.onclick = async () => { const d = sts.find(s => s.kind === 'done'); if (!d) return MB.toast('This list has no “done” status'); try { upd(await MB.api('/api/employee/tasks/' + id, { method: 'PATCH', body: { status: d.id } })); } catch (er) { MB.toast(er.message); } };
    $('modal').querySelectorAll('[data-sub]').forEach(cb => cb.onchange = async () => { try { await MB.api('/api/employee/subtasks/' + cb.dataset.sub, { method: 'PATCH', body: { done: cb.checked } }); t.subtasks.find(s => s.id === cb.dataset.sub).done = cb.checked; paintTasks(); openTask(id); } catch (er) { MB.toast(er.message); cb.checked = !cb.checked; } });
    $('cmForm').onsubmit = async e => { e.preventDefault(); const text = $('cmIn').value.trim(); if (!text) return; try { const c = await MB.api('/api/employee/tasks/' + id + '/comments', { method: 'POST', body: { text } }); t.comments.push({ id: c.id, by: c.by, text: c.text, at: c.at, kind: 'comment' }); openTask(id); } catch (er) { MB.toast(er.message); } };
  }

  /* ---------------- Channels / DMs ---------------- */
  function chatLayout(listHtml, wireList) {
    $('view').innerHTML = `<div class="chat"><div class="chat-list" id="clist">${listHtml}</div><div class="chat-pane" id="cpane"><div class="chat-none" style="margin:auto">Select a conversation</div></div></div>`;
    wireList();
  }
  async function viewChannels() {
    $('view').innerHTML = '<div class="empty">Loading…</div>';
    let chans; try { chans = (await MB.api('/api/employee/channels')).channels; } catch (e) { $('view').innerHTML = `<div class="card empty">${esc(e.message)}</div>`; return; }
    if (!chans.length) { $('view').innerHTML = '<div class="card empty">You have not been added to any channels yet. The admin can add you to a team channel.</div>'; return; }
    const spaces = [...new Set(chans.map(c => c.space_name || 'General'))];
    chatLayout(spaces.map(s => `<h5>${esc(s)}</h5>${chans.filter(c => (c.space_name || 'General') === s).map(c => `<button data-id="${esc(c.id)}"><span class="muted">#</span> ${esc(c.name)}</button>`).join('')}`).join(''), () => {
      document.querySelectorAll('#clist button').forEach(b => b.onclick = () => {
        stopPane(); document.querySelectorAll('#clist button').forEach(x => x.classList.toggle('on', x === b));
        const c = chans.find(x => x.id === b.dataset.id);
        pane = MB.chatPane($('cpane'), { title: '# ' + c.name, load: () => MB.api('/api/messages/channel/' + encodeURIComponent(c.id)),
          send: text => MB.api('/api/messages/channel', { method: 'POST', body: { channel_id: c.id, text } }), norm: m => ({ id: m.id, uid: m.author_id, name: m.author_name, text: m.text, ts: m.timestamp }) });
      });
      document.querySelector('#clist button').click();
    });
  }
  async function viewDms() {
    $('view').innerHTML = '<div class="empty">Loading…</div>';
    let cs; try { cs = (await MB.api('/api/employee/contacts')).contacts; } catch (e) { $('view').innerHTML = `<div class="card empty">${esc(e.message)}</div>`; return; }
    if (!cs.length) { $('view').innerHTML = '<div class="card empty">No one to message yet.</div>'; return; }
    const admins = cs.filter(c => c.role === 'admin'), team = cs.filter(c => c.role !== 'admin');
    const btn = c => `<button data-id="${esc(c.id)}">${MB.avatar(c.name)} ${esc(c.name)}${c.role === 'admin' ? ' <span class="muted">· Admin</span>' : ''}</button>`;
    chatLayout((admins.length ? '<h5>Admin</h5>' + admins.map(btn).join('') : '') + (team.length ? '<h5>Teammates</h5>' + team.map(btn).join('') : ''), () => {
      document.querySelectorAll('#clist button').forEach(b => b.onclick = () => {
        stopPane(); document.querySelectorAll('#clist button').forEach(x => x.classList.toggle('on', x === b));
        const c = cs.find(x => x.id === b.dataset.id);
        pane = MB.chatPane($('cpane'), { title: c.name, load: () => MB.api('/api/messages/dm/' + encodeURIComponent(c.id)),
          send: text => MB.api('/api/messages/dm', { method: 'POST', body: { to_id: c.id, text } }), norm: m => ({ id: m.id, uid: m.from_id, name: m.from_name, text: m.text, ts: m.timestamp }) });
      });
      document.querySelector('#clist button').click();
    });
  }

  /* ---------------- Profile + own salary ---------------- */
  async function viewProfile() {
    const v = $('view'); v.innerHTML = '<div class="empty">Loading…</div>';
    let r; try { r = await MB.api('/api/employee/me'); } catch (e) { v.innerHTML = `<div class="card empty">${esc(e.message)}</div>`; return; }
    const e = r.employee || {}, pays = r.salary_payments || [], kv = (l, val) => `<div class="row"><div class="grow muted">${l}</div><div>${val ? esc(val) : '—'}</div></div>`;
    const ytd = pays.filter(p => String(p.month).slice(0, 4) === String(new Date().getFullYear())).reduce((t, p) => t + (+p.amount || 0), 0);
    v.innerHTML = `<div class="grid" style="margin-bottom:16px"><div class="stat"><div class="l">Monthly salary</div><div class="v">${e.salary ? fmt(e.salary) : '—'}</div></div><div class="stat"><div class="l">Paid this year</div><div class="v">${fmt(ytd)}</div></div><div class="stat"><div class="l">Payments received</div><div class="v">${pays.length}</div></div></div>
      <div class="card"><h3>Your details</h3>${kv('Name', e.name || r.user.name)}${kv('Role', e.designation)}${kv('Employment type', e.type)}${kv('Joined', e.joinDate ? fdate(e.joinDate) : '')}${kv('Email', e.email || r.user.email)}${kv('Phone', e.phone)}${kv('Pay method', e.payMethod)}</div>
      <div class="card"><h3>Salary history</h3><div class="tablewrap"><table><thead><tr><th>Month</th><th>Paid on</th><th>Method</th><th>Note</th><th class="num">Amount</th></tr></thead><tbody>
        ${pays.map(p => `<tr><td>${esc(p.month)}${p.is_prorata ? ' <span class="badge b-partial">Pro-rata</span>' : ''}</td><td>${fdate(p.date)}</td><td>${esc(p.method || '—')}</td><td class="muted">${esc(p.notes || '')}</td><td class="num"><b>${fmt(p.amount)}</b></td></tr>`).join('') || '<tr><td colspan="5" class="empty">No salary payments recorded yet</td></tr>'}</tbody></table></div></div>
      <div class="card"><h3>Change password</h3><form id="pwForm" style="max-width:340px"><div style="margin-bottom:10px"><input type="password" id="pwCur" placeholder="Current password" autocomplete="current-password" required></div><div style="margin-bottom:10px"><input type="password" id="pwNew" placeholder="New password (min 8 characters)" minlength="8" autocomplete="new-password" required></div><button class="btn sm">Update password</button></form></div>`;
    $('pwForm').onsubmit = async ev => { ev.preventDefault(); try { await MB.api('/api/auth/change-password', { method: 'POST', body: { current_password: $('pwCur').value, new_password: $('pwNew').value } }); $('pwCur').value = $('pwNew').value = ''; MB.toast('Password updated'); } catch (er) { MB.toast(er.message); } };
  }
})();
</script>
</body>
</html>
