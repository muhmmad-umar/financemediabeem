name: Deploy Media Beem

# Runs on every push to main (or manually). Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN  — token with Workers, D1 and Pages edit permissions
#   CLOUDFLARE_ACCOUNT_ID — your Cloudflare account id
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply mediabeem-db --remote -c worker/wrangler.toml
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }
      - name: Deploy API (Worker)
        run: npx wrangler deploy -c worker/wrangler.toml
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }
      - name: Deploy frontend (Pages)
        run: npx wrangler pages deploy public --project-name mediabeem-pages --branch main
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }
