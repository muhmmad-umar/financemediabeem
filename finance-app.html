<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agency Finance Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --teal:#0f766e; --teal-d:#0b5a54; --navy:#0f2a3d; --side:#0d1f2d;
  --gold:#b8860b; --gold-l:#f6e7b4; --green:#15803d; --green-l:#dcfce7;
  --bg:#f1f5f9; --card:#fff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --red:#dc2626; --amber:#d97706; --blue:#2563eb;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;display:flex;min-height:100vh}
button{font-family:inherit;cursor:pointer}
/* sidebar */
.sidebar{width:240px;background:var(--side);color:#cbd5e1;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;padding:20px 14px;z-index:30;transition:transform .25s}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:17px;padding:4px 8px 22px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--teal),#14b8a6);display:grid;place-items:center;font-size:18px}
.nav button{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;color:#94a3b8;padding:11px 12px;border-radius:9px;font-size:14px;font-weight:500;margin-bottom:3px;text-align:left;transition:.15s}
.nav button:hover{background:#16324a;color:#fff}
.nav button.active{background:var(--teal);color:#fff}
.nav button.allah.active{background:linear-gradient(135deg,#a37507,#d4a017);color:#fff}
.nav button.allah{color:#e6c35c}
.side-foot{margin-top:auto;font-size:12px;padding:12px;background:#10293b;border-radius:10px;color:#e6c35c;line-height:1.5}
.side-foot button{margin-top:8px;background:none;border:1px solid #2b4760;color:#94a3b8;border-radius:6px;padding:4px 8px;font-size:11px}
/* main */
main{margin-left:240px;flex:1;padding:26px 30px 50px;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:24px;font-weight:700}
.topbar p{color:var(--muted);font-size:13px;margin-top:2px}
.menu-btn{display:none;background:var(--navy);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:18px}
.btn{background:var(--teal);color:#fff;border:0;border-radius:9px;padding:9px 16px;font-weight:600;font-size:13px;transition:.15s}
.btn:hover{background:var(--teal-d);transform:translateY(-1px)}
.btn.gold{background:var(--gold)}.btn.gold:hover{background:#8f6808}
.btn.ghost{background:#fff;color:var(--text);border:1px solid var(--line)}.btn.ghost:hover{background:#f8fafc}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn.danger{background:#fff;color:var(--red);border:1px solid #fecaca}.btn.danger:hover{background:#fef2f2}
/* cards */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.g-main{grid-template-columns:2fr 1fr}
.card{background:var(--card);border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(15,23,42,.06);border:1px solid var(--line);transition:.2s}
.card:hover{box-shadow:0 6px 18px rgba(15,23,42,.08)}
.card h3{font-size:15px;font-weight:600;margin-bottom:14px}
.stat .label{color:var(--muted);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.stat .value{font-size:24px;font-weight:700;margin-top:6px}
.stat .sub{color:var(--muted);font-size:12px;margin-top:4px}
.stat.teal{border-top:4px solid var(--teal)}.stat.navy{border-top:4px solid var(--navy)}.stat.amber{border-top:4px solid var(--amber)}
.allah-card{background:linear-gradient(135deg,#14532d,#166534 55%,#a37507);color:#fff;border:0;position:relative;overflow:hidden}
.allah-card::after{content:"☪";position:absolute;right:-8px;top:-24px;font-size:110px;opacity:.1}
.allah-card .label,.allah-card .sub{color:#e6e9c0}
.allah-card .value{color:#ffe58a}
.bar{height:12px;background:rgba(0,0,0,.18);border-radius:99px;overflow:hidden;margin-top:12px}
.bar>div{height:100%;background:linear-gradient(90deg,#fde68a,#f59e0b);border-radius:99px;transition:width .6s}
.bar.light{background:#e8e4cc}
.bar.light>div{background:linear-gradient(90deg,#16a34a,#b8860b)}
/* formula */
.flow{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap}
.fbox{flex:1;min-width:130px;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fbox span{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.fbox b{font-size:19px;display:block;margin-top:4px}
.fbox.net{background:#ecfeff;border-color:#99f6e4}.fbox.mine{background:#f0fdfa}
.fbox.allah{background:linear-gradient(135deg,#fefce8,#dcfce7);border-color:#d4a017}.fbox.allah b{color:#8f6808}
.fop{align-self:center;font-size:22px;font-weight:700;color:var(--muted)}
/* table */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr:hover td{background:#f8fafc}
td.num,th.num{text-align:right;white-space:nowrap}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600}
.b-received,.b-paid{background:#dcfce7;color:#166534}
.b-partial,.b-pending{background:#fef3c7;color:#92400e}
.b-incPartial{background:#fef3c7;color:#92400e}.b-incFull{background:#dcfce7;color:#166534}
.b-unpaid{background:#e2e8f0;color:#475569}
.b-draft{background:#e2e8f0;color:#475569}
.b-overdue{background:#fee2e2;color:#991b1b}
.gold-txt{color:var(--gold);font-weight:600}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:28px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
input,select,textarea{font-family:inherit;font-size:13px;padding:9px 11px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:var(--text);width:100%}
.filters input,.filters select{width:auto;min-width:140px;flex:1}
input:focus,select:focus,textarea:focus{outline:2px solid #5eead4;border-color:var(--teal)}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:480px;max-height:92vh;overflow:auto;animation:pop .2s}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:none;opacity:1}}
.modal h2{font-size:18px;margin-bottom:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{background:#fefce8;border:1px solid var(--gold-l);color:#854d0e;border-radius:8px;padding:8px 10px;font-size:12px;margin-bottom:12px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.chart-box{position:relative;height:280px}
.tx{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f1f5f9;gap:10px}
.tx:last-child{border:0}
.tx .t1{font-weight:600}.tx .t2{font-size:12px;color:var(--muted)}
.tx .amt{font-weight:700;text-align:right;white-space:nowrap}
.tx .amt small{display:block;font-weight:500;color:var(--gold);font-size:11px}
.toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;z-index:99;opacity:0;transform:translateY(10px);transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.scrim{display:none}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g-main{grid-template-columns:1fr}}
@media(max-width:820px){
  .sidebar{transform:translateX(-100%)}.sidebar.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}
  main{margin-left:0;padding:16px 14px 40px}.menu-btn{display:block}
  .g3,.g2{grid-template-columns:1fr}.stat .value{font-size:21px}.topbar h1{font-size:20px}
}
@media(max-width:520px){.g4{grid-template-columns:1fr}.row2{grid-template-columns:1fr}}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="logo">₨</div>Agency Finance</div>
  <nav class="nav" id="nav">
    <button data-view="dashboard">📊 Dashboard</button>
    <button data-view="income">💰 Income / Cash Flow</button>
    <button data-view="expenses">💸 Expenses</button>
    <button data-view="invoices">🧾 Invoices</button>
    <button data-view="allah" class="allah">🤲 Allah's Share</button>
    <button data-view="reports">📈 Reports</button>
  </nav>
  <div class="side-foot">
    <div id="sideAllah"></div>
    <button onclick="resetData()">Clear all data</button>
  </div>
</aside>
<div class="scrim" id="scrim"></div>

<main>
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div><h1 id="title"></h1><p id="subtitle"></p></div>
    </div>
    <div id="topActions"></div>
  </div>
  <div id="view"></div>
</main>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ========= Config & storage ========= */
const ALLAH_RATE = 0.10;
const K = {inc:'income_entries', inv:'invoices', ch:'charity_expenses', exp:'expenses'};
const load = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } };
const save = () => {
  try {
    localStorage.setItem(K.inc, JSON.stringify(income));
    localStorage.setItem(K.inv, JSON.stringify(invoices));
    localStorage.setItem(K.ch, JSON.stringify(charity));
    localStorage.setItem(K.exp, JSON.stringify(expenses));
  } catch(e){ toast('Could not save to localStorage'); }
};
let income, invoices, charity, expenses;

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const today = () => new Date().toISOString().slice(0,10);
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return d.toISOString().slice(0,10); };
const daysAhead = n => daysAgo(-n);
const fmt = n => '₨ ' + Math.round(n || 0).toLocaleString('en-US');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const monthKey = d => d.slice(0,7);
const monthLabel = k => new Date(k + '-01T00:00:00').toLocaleDateString('en-US',{month:'short',year:'numeric'});
const fdate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : '—';
/* Shares are based on NET PROFIT (received income − expenses); never negative for charity */
const allahOf = net => Math.max(0, net) * ALLAH_RATE;
const mineOf = net => net > 0 ? net * (1 - ALLAH_RATE) : net;

/* Income entry: `received_amount` = money actually in hand (ALL calculations use it);
   `total_amount` = full amount invoiced/expected (display and remaining only) */
function mkIncome(o){ const e = {id:uid(), description:'', category:'Services', ...o}; if (!(e.total_amount >= e.received_amount)) e.total_amount = e.received_amount; return e; }
const incTotal = e => e.total_amount;
const incRemaining = e => e.total_amount - e.received_amount;
const incLabel = e => `${fmt(e.total_amount)} total / <b style="color:var(--green)">${fmt(e.received_amount)} received</b>`;
const incStatus = e => incRemaining(e) > 0 ? 'incPartial' : 'incFull';
function resetData(){
  if (!confirm('Delete ALL data (income, expenses, invoices, charity)? This cannot be undone.')) return;
  income = []; invoices = []; charity = []; expenses = []; save(); render(); toast('All data cleared');
}
const DATA_VERSION = '3';
function init(){
  // First run of this version: wipe any pre-loaded/sample data so the app starts empty
  let ver = null; try { ver = localStorage.getItem('data_version'); } catch(e){}
  if (ver !== DATA_VERSION) {
    income = []; invoices = []; charity = []; expenses = [];
    save(); try { localStorage.setItem('data_version', DATA_VERSION); } catch(e){}
    return;
  }
  income = load(K.inc); invoices = load(K.inv); charity = load(K.ch); expenses = load(K.exp);
  [income, invoices, charity, expenses] = [income, invoices, charity, expenses].map(a => Array.isArray(a) ? a : []);
  // migrate older entries ({amount, total}) to {received_amount, total_amount}
  let migrated = false;
  income.forEach(e => { if (e.received_amount === undefined) { e.received_amount = e.amount; e.total_amount = Math.max(e.total || 0, e.amount); delete e.amount; delete e.total; migrated = true; } });
  if (migrated) save();
}

/* ========= Derived values ========= */
/* Only money actually received counts. Every income entry is cash in hand
   (manual entries, or an installment paid against an invoice). */
const received = () => income;
const sum = (arr, f) => arr.reduce((t, x) => t + f(x), 0);
const invReceived = i => sum(i.payments || [], p => p.amount);
const invRemaining = i => Math.max(0, i.amount - invReceived(i));
function invStatus(i){
  const rec = invReceived(i), rem = i.amount - rec;
  if (rem <= 0) return 'paid';
  if (i.expectedBy && today() > i.expectedBy) return 'overdue';
  return rec > 0 ? 'partial' : 'unpaid';
}
const STATUS_LABEL = {incPartial:'Partially Received', incFull:'Fully Received', unpaid:'Unpaid', partial:'Partially Paid', paid:'Paid in Full', overdue:'Overdue'};
function totals(){
  const rec = received(), cm = monthKey(today());
  const totalIn = sum(rec, e => e.received_amount), totalExp = sum(expenses, e => e.amount);
  const monthIn = sum(rec.filter(e => monthKey(e.date) === cm), e => e.received_amount);
  const monthExp = sum(expenses.filter(e => monthKey(e.date) === cm), e => e.amount);
  const net = totalIn - totalExp;
  const allahTotal = allahOf(net), given = sum(charity, c => c.amount);
  return {
    invoiced: sum(invoices, i => i.amount),
    outstanding: sum(invoices, invRemaining),
    overdueAmt: sum(invoices.filter(i => invStatus(i) === 'overdue'), invRemaining),
    totalIn, totalExp, net, monthIn, monthExp, monthNet: monthIn - monthExp,
    mine: mineOf(net), allahTotal, given, remaining: allahTotal - given,
    pct: allahTotal > 0 ? Math.min(100, given / allahTotal * 100) : 0
  };
}

/* ========= UI helpers ========= */
const $ = id => document.getElementById(id);
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2400); }
function openModal(html){ $('modal').innerHTML = html; $('overlay').classList.add('open'); }
function closeModal(){ $('overlay').classList.remove('open'); }
$('overlay').addEventListener('mousedown', e => { if (e.target.id === 'overlay') closeModal(); });
const badge = s => `<span class="badge b-${s}">${STATUS_LABEL[s] || (s[0].toUpperCase() + s.slice(1))}</span>`;
const charts = [];
function chart(id, cfg){ const el = $(id); if (!el || typeof Chart === 'undefined') return; charts.push(new Chart(el, cfg)); }
function destroyCharts(){ while (charts.length) charts.pop().destroy(); }
const chartOpts = {responsive:true, maintainAspectRatio:false, plugins:{legend:{labels:{font:{family:'Inter'}}}}};
const axisFmt = v => v >= 1e6 ? (v/1e6) + 'M' : v >= 1e3 ? (v/1e3) + 'k' : v;

/* ========= Views ========= */
let view = 'dashboard';
const meta = {
  dashboard:['Dashboard','Overview of your agency finances'],
  income:['Income Received','Ledger of money actually in hand'],
  expenses:['Expenses','Business costs — deducted before the 90% / 10% split'],
  invoices:['Invoices','Billed amounts are tracked here — only payments received count as income'],
  allah:["Allah's Share Tracker",'10% of net profit (income − expenses) — set aside for charity (sadaqah)'],
  reports:['Reports','Monthly breakdown, cumulative charity and top clients'],
};

function render(){
  destroyCharts();
  const t = totals();
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  $('title').textContent = meta[view][0]; $('subtitle').textContent = meta[view][1];
  $('topActions').innerHTML = {
    dashboard:'<button class="btn" onclick="incomeForm()">+ Add Income</button>',
    income:'<button class="btn" onclick="incomeForm()">+ Add Income</button>',
    expenses:'<button class="btn" onclick="expenseForm()">+ Add Expense</button>',
    invoices:'<button class="btn" onclick="invoiceForm()">+ New Invoice</button>',
    allah:'<button class="btn gold" onclick="charityForm()">+ Record Giving</button>',
    reports:''
  }[view];
  $('sideAllah').innerHTML = `🤲 <b>Allah's share</b><br>Set aside (10% of net): ${fmt(t.allahTotal)}<br>Remaining: ${fmt(t.remaining)}`;
  $('view').innerHTML = {dashboard:vDashboard, income:vIncome, expenses:vExpenses, invoices:vInvoices, allah:vAllah, reports:vReports}[view](t);
  ({dashboard:afterDashboard, reports:afterReports, allah:afterAllah}[view] || (()=>{}))(t);
}

function formulaCard(t){
  const neg = t.net <= 0;
  return `<div class="card formula" style="margin-bottom:16px">
    <h3>Live formula — based only on money actually received</h3>
    <div class="flow">
      <div class="fbox"><span>Received Income</span><b>${fmt(t.totalIn)}</b></div><div class="fop">−</div>
      <div class="fbox"><span>Expenses</span><b>${fmt(t.totalExp)}</b></div><div class="fop">=</div>
      <div class="fbox net"><span>Net Profit</span><b>${fmt(t.net)}</b></div><div class="fop">→</div>
      <div class="fbox mine"><span>× 90% = My Share</span><b>${fmt(t.mine)}</b></div><div class="fop">/</div>
      <div class="fbox allah"><span>🤲 × 10% = Allah's Share</span><b>${fmt(t.allahTotal)}</b></div>
    </div>
    ${neg ? '<div class="hint" style="margin:12px 0 0">Net profit is zero or negative, so Allah\'s share is ₨ 0.</div>' : ''}
  </div>`;
}
function vDashboard(t){
  const recent = [...income].sort((a,b) => b.date.localeCompare(a.date)).slice(0,6);
  return `
  ${formulaCard(t)}
  <div class="grid g3" style="margin-bottom:16px">
    <div class="card stat navy"><div class="label">Total Invoiced (billed)</div><div class="value">${fmt(t.invoiced)}</div><div class="sub">${invoices.length} invoices</div></div>
    <div class="card stat teal"><div class="label">Total Received (in hand)</div><div class="value">${fmt(t.totalIn)}</div><div class="sub">This month: ${fmt(t.monthIn)}</div></div>
    <div class="card stat amber"><div class="label">Total Outstanding (clients owe)</div><div class="value">${fmt(t.outstanding)}</div><div class="sub">Overdue: ${fmt(t.overdueAmt)} · not counted as income</div></div>
  </div>
  <div class="grid g3" style="margin-bottom:16px">
    <div class="card stat navy"><div class="label">Expenses</div><div class="value">${fmt(t.totalExp)}</div><div class="sub">This month: ${fmt(t.monthExp)}</div></div>
    <div class="card stat teal"><div class="label">Net Profit</div><div class="value">${fmt(t.net)}</div><div class="sub">Received − Expenses</div></div>
    <div class="card stat teal"><div class="label">My Share (90%)</div><div class="value">${fmt(t.mine)}</div><div class="sub">From received money only</div></div>
  </div>
  <div class="card allah-card" style="margin-bottom:16px">
    <div class="grid g3" style="gap:20px">
      <div><div class="label">🤲 Allah's Share (10% of net) — Set Aside</div><div class="value" style="font-size:30px">${fmt(t.allahTotal)}</div></div>
      <div><div class="label">Given So Far</div><div class="value" style="font-size:30px">${fmt(t.given)}</div></div>
      <div><div class="label">Still To Give</div><div class="value" style="font-size:30px">${fmt(t.remaining)}</div></div>
    </div>
    <div class="bar"><div style="width:${t.pct}%"></div></div>
    <div class="sub" style="margin-top:8px">Based on ${fmt(t.totalIn)} received so far · ${t.pct.toFixed(1)}% given in Allah's way</div>
  </div>
  <div class="grid g-main">
    <div class="card"><h3>Received vs Expenses – Last 6 Months</h3><div class="chart-box"><canvas id="cDash"></canvas></div></div>
    <div class="card"><h3>Recent Money Received</h3>${recent.map(e => `
      <div class="tx"><div><div class="t1">${esc(e.client)}</div><div class="t2">${fdate(e.date)} · ${esc(e.description || e.category)}</div></div>
      <div class="amt" style="font-weight:500;font-size:12px">${incLabel(e)}</div></div>`).join('') || '<div class="empty">No money received yet</div>'}
    </div>
  </div>`;
}
function lastMonths(n){
  const out = [], d = new Date(); d.setDate(1);
  for (let i = n - 1; i >= 0; i--) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); out.push(x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0')); }
  return out;
}
function afterDashboard(){
  const ms = lastMonths(6), rec = received();
  chart('cDash', {type:'bar', data:{labels:ms.map(monthLabel), datasets:[

function addPayment(inv, amount, date, note){

  income.push(mkIncome({total_amount:amount, received_amount:amount, client:inv.client, date, description:'Invoice ' + inv.number + ' – ' + inv.service + (note ? ' (' + note + ')' : ''), category:'Services', invoiceId:inv.id, invoiceNo:inv.number, paymentId:pid}));

      <div class="row2"><div class="field"><label>Amount received (max ${fmt(rem)})</label><input name="amount" type="number" min="1" max="${rem}" step="any" required></div>

      <div class="modal-actions"><button type="button" class="btn ghost" onclick="closeModal()">Close</button><button class="btn">Add payment</button></div></form>`
      : '<div class="modal-actions"><button type="button" class="btn ghost" onclick="closeModal()">Close</button></div>'}`);

function savePayment(e, id){
  e.preventDefault(); const i = invoices.find(x => x.id === id); const f = Object.fromEntries(new FormData(e.target));
  const amt = +f.amount;
  if (!i || !(amt > 0) || amt > invRemaining(i)) { alert('Payment cannot exceed the remaining balance.'); return; }
  if (f.expectedBy) i.expectedBy = f.expectedBy;
  addPayment(i, amt, f.date, f.note.trim());
  save(); render(); paymentModal(id); toast(fmt(amt) + ' received · income updated');
}
function delPayment(id, pid){
  const i = invoices.find(x => x.id === id); if (!i || !confirm('Remove this payment and its income entry?')) return;

  save(); render(); paymentModal(id);
}
function delInv(id){

  if (!i || !confirm('Delete invoice ' + i.number + (i.payments.length ? ' and its ' + i.payments.length + ' payment(s) from the income ledger' : '') + '?')) return;

}

function monthRows(){
  const rec = received();
  const keys = [...new Set([...rec.map(e => monthKey(e.date)), ...expenses.map(e => monthKey(e.date))])].sort();

    const inc = sum(rec.filter(e => monthKey(e.date) === m), e => e.received_amount), exp = sum(expenses.filter(e => monthKey(e.date) === m), e => e.amount);
    return {m, inc, exp, net:inc - exp, mine:mineOf(inc - exp), allah:allahOf(inc - exp)};
  });
}

    <div class="card"><h3>Monthly Breakdown</h3><div class="tablewrap"><table>
      <thead><tr><th>Month</th><th class="num">Income</th><th class="num">Expenses</th><th class="num">Net</th><th class="num">Me 90%</th><th class="num">Allah 10%</th></tr></thead>
      <tbody>${[...rows].reverse().map(r => `<tr><td>${monthLabel(r.m)}</td><td class="num">${fmt(r.inc)}</td><td class="num">${fmt(r.exp)}</td><td class="num"><b>${fmt(r.net)}</b></td><td class="num">${fmt(r.mine)}</td><td class="num gold-txt">${fmt(r.allah)}</td></tr>`).join('')}</tbody>
    </table></div></div>
  </div>`;
}
function afterReports(){
  const rows = monthRows(), ms = [...new Set([...rows.map(r => r.m), ...charity.map(c => monthKey(c.date))])].sort();
  const get = m => rows.find(r => r.m === m) || {inc:0, exp:0, net:0};
  chart('cMonthly', {type:'bar', data:{labels:ms.map(monthLabel), datasets:[
    {label:'Received', data:ms.map(m => get(m).inc), backgroundColor:'#0f766e', borderRadius:4},
    {label:'Expenses', data:ms.map(m => get(m).exp), backgroundColor:'#94a3b8', borderRadius:4}]}, options:{...chartOpts, scales:{y:{ticks:{callback:axisFmt}}}}});
  let net = 0, g = 0; const cumA = [], cumG = [];
  ms.forEach(m => { net += get(m).net; g += sum(charity.filter(c => monthKey(c.date) === m), c => c.amount); cumA.push(allahOf(net)); cumG.push(g); });
  chart('cCum', {type:'line', data:{labels:ms.map(monthLabel), datasets:[
    {label:"Allah's share (10% of cumulative net)", data:cumA, borderColor:'#d4a017', backgroundColor:'rgba(212,160,23,.15)', fill:true, tension:.3},
    {label:'Given', data:cumG, borderColor:'#15803d', tension:.3}]}, options:{...chartOpts, scales:{y:{ticks:{callback:axisFmt}}}}});
}

/* ========= Wiring ========= */
$('nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { view = b.dataset.view; $('sidebar').classList.remove('open'); $('scrim').classList.remove('open'); render(); window.scrollTo(0,0); } });
$('menuBtn').onclick = () => { $('sidebar').classList.add('open'); $('scrim').classList.add('open'); };
$('scrim').onclick = () => { $('sidebar').classList.remove('open'); $('scrim').classList.remove('open'); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
init(); render();
</script>
