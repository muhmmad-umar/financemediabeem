  ${p ? `<div class="card" style="margin-bottom:14px"><div class="profile-head"><div class="grow"><h2 style="font-size:20px">${esc(p.name)}</h2><div class="muted">${esc(clName(p.clientId))} · ${fdate(p.start)} → ${fdate(p.deadline)}</div>${p.description ? `<div style="margin-top:6px;white-space:pre-wrap">${esc(p.description)}</div>` : ''}</div>
      <div style="display:flex;gap:4px">${(p.team || []).map(id => miniAv(empName(id) || '?', 30)).join('')}</div>
      <select style="width:auto" onchange="setProjStatus('${p.id}',this.value)">${PJ_STATUS.map(s => `<option ${s === p.status ? 'selected' : ''}>${s}</option>`).join('')}</select>
      <div class="inv-actions"><button class="btn sm" onclick="taskForm({project:'${p.id}'})">+ Task</button><button class="btn sm ghost" onclick="projectForm('${p.id}')">Edit</button><button class="btn sm danger" onclick="delProject('${p.id}')">Delete</button></div></div></div>`
    : '<div class="card" style="margin-bottom:14px"><h2 style="font-size:20px">All tasks</h2><div class="muted">Across every project</div></div>'}
  <div class="psub">${tabs.map(([k, l]) => `<button class="${pjTab === k ? 'on' : ''}" onclick="pjTab='${k}';render()">${l}</button>`).join('')}</div>
  ${taskFilterBar()}
  <div class="muted" style="margin:0 0 10px;font-size:12px">${list.length} task${list.length === 1 ? '' : 's'}${pjTab === 'calendar' ? ' · calendar ignores the date filter' : ' · due ' + periodLabel() + ', plus overdue and undated tasks'}</div>
  ${pjTab === 'board' ? taskBoard(list) : pjTab === 'list' ? taskTable(list) : taskCalendar(list)}`;
}
function taskFilterBar(){
  const sel = (k, label, opts) => `<select onchange="tf.${k}=this.value;render()"><option value="">${label}</option>${opts.map(([v, l]) => `<option value="${v}" ${tf[k] === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  const active = Object.values(tf).some(Boolean);
  return `<div class="card" style="margin-bottom:12px;padding:12px"><div class="filters" style="margin:0">
    <input placeholder="Search tasks…" value="${esc(tf.q)}" oninput="tf.q=this.value;renderKeep(this)">
    ${sel('assignee', '👤 My Tasks / Assignee', employees.map(e => [e.id, e.name]))}
    ${sel('priority', 'Priority', Object.entries(PRI).map(([k, v]) => [k, v.i + ' ' + v.l]))}
    ${sel('status', 'Status', [['open', 'Open (not done)'], ...Object.entries(TS)])}
    ${pjSel === 'all' ? sel('client', 'Client', clients.map(c => [c.id, c.company])) : ''}
    ${sel('tag', 'Tag', allTags().map(t => [t, t]))}
    ${sel('due', 'Due date', [['today', 'Due today'], ['overdue', 'Overdue'], ['week', 'This week'], ['none', 'No due date']])}
    ${active ? '<button class="btn sm ghost" onclick="Object.keys(tf).forEach(k=>tf[k]=\'\');render()">Clear filters</button>' : ''}</div></div>`;
}

function setProjStatus(id, st){ const p = projById(id); if (p) { p.status = st; save(); render(); } }

  tasks.filter(t => t.projectId === id).forEach(removeTaskData); projects = projects.filter(x => x.id !== id); pjSel = null; save(); render();

function removeTaskData(t){ subtasks = subtasks.filter(s => s.taskId !== t.id); taskComments = taskComments.filter(c => c.taskId !== t.id); tasks = tasks.filter(x => x.id !== t.id); tasks.forEach(x => { if (x.blockedBy === t.id) x.blockedBy = ''; }); selT.delete(t.id); }

/* ----- tasks: create / status / recurring ----- */
function taskForm(o = {}){
  if (!projects.length) { openModal('<h2>New Task</h2><p style="margin-bottom:14px">Every task lives inside a project. Create a project first.</p><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="projectForm()">New project</button></div>'); return; }
  const pid = o.project || (pjSel && pjSel !== 'all' ? pjSel : '');

    <div class="field"><label>Title</label><input name="title" value="${esc(o.title || '')}" required></div>
    <div class="row2"><div class="field"><label>Project</label><select name="projectId" required><option value="">Select project…</option>${projects.map(p => `<option value="${p.id}" ${p.id === pid ? 'selected' : ''}>${esc(p.name)} · ${esc(clName(p.clientId))}</option>`).join('')}</select></div>
    <div class="field"><label>Assigned to</label><select name="assignee">${empOpts('')}</select></div></div>
    <div class="row2"><div class="field"><label>Due date</label><input name="due" type="date" value="${o.due || ''}"></div>
    <div class="field"><label>Time estimate (hours)</label><input name="estimate" type="number" min="0" step="any"></div></div>
    <div class="row2"><div class="field"><label>Priority</label><select name="priority">${Object.entries(PRI).map(([k, v]) => `<option value="${k}" ${k === 'normal' ? 'selected' : ''}>${v.i} ${v.l}</option>`).join('')}</select></div>
    <div class="field"><label>Status</label><select name="status">${Object.entries(TS).map(([k, v]) => `<option value="${k}" ${k === (o.status || 'todo') ? 'selected' : ''}>${v}</option>`).join('')}</select></div></div>
    <div class="field"><label>Tags (comma separated)</label><input name="tags" placeholder="Design, Content…"></div>
    <div class="field"><label>Description</label><textarea name="description" rows="3"></textarea></div>
    <div class="modal-actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn">Create task</button></div></form>`, 'xl');
}
const parseTags = s => [...new Set(String(s || '').split(',').map(x => x.trim()).filter(Boolean))];
function newTask(o){ const t = {id:uid(), title:'', description:'', assignee:'', due:'', priority:'normal', status:'todo', tags:[], estimate:0, attachments:'', blockedBy:'', recurring:'', created:new Date().toISOString(), ...o}; tasks.push(t); return t; }
function saveNewTask(ev){
  ev.preventDefault(); const f = Object.fromEntries(new FormData(ev.target));
  newTask({title:f.title.trim(), projectId:f.projectId, assignee:f.assignee, due:f.due, priority:f.priority, status:f.status, tags:parseTags(f.tags), estimate:+f.estimate || 0, description:f.description.trim()});
  save(); closeModal(); render(); toast('Task created');
}
function quickAdd(status, input){
  const title = input.value.trim(); if (!title) return;
  if (!pjSel || pjSel === 'all') { taskForm({status, title}); return; }
  newTask({title, projectId:pjSel, status}); save(); render(); toast('Task added');
}
function nextDue(t){
  const base = t.due || today();
  if (t.recurring === 'daily') return addDays(base, 1);
  if (t.recurring === 'weekly') return addDays(base, 7);
  const d = new Date(base + 'T00:00:00'), day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + 1); d.setDate(Math.min(day, monthDays(iso(d).slice(0, 7)))); return iso(d);
}
function spawnRecurring(t){
  const n = newTask({...t, id:uid(), status:'todo', due:nextDue(t), blockedBy:'', recurSpawned:false, created:new Date().toISOString()});
  subtasks.filter(s => s.taskId === t.id).forEach(s => subtasks.push({id:uid(), taskId:n.id, title:s.title, done:false}));
  t.recurSpawned = true; toast('Recurring task — next one created for ' + fdate(n.due));
}
function setTaskStatus(t, st){
  if (st === 'done' && isBlockedT(t) && !confirm('This task is blocked by "' + taskById(t.blockedBy).title + '", which is not done yet. Mark it Done anyway?')) return false;
  t.status = st;
  if (st === 'done' && t.recurring && !t.recurSpawned) spawnRecurring(t);
  return true;
}
function changeStatus(id, st){ const t = taskById(id); if (t && setTaskStatus(t, st)) { save(); render(); if (openTaskId === id) refreshTask(id); } else render(); }
function dropTask(ev, st){ ev.preventDefault(); const id = dragTaskId || ev.dataTransfer.getData('text/plain'); dragTaskId = null; if (id) changeStatus(id, st); }

/* ----- board ----- */
function taskCard(t){
  const p = PRI[t.priority], od = isOverdueT(t), subs = subtasks.filter(s => s.taskId === t.id), done = subs.filter(s => s.done).length, name = empName(t.assignee);
  return `<div class="kcard ${od ? 'overdue' : ''}" draggable="true" ondragstart="dragTaskId='${t.id}';event.dataTransfer.setData('text/plain','${t.id}')" onclick="openTask('${t.id}')" style="border-left-color:${p.c}">
    <div style="display:flex;justify-content:space-between;gap:6px"><b>${esc(t.title)}</b>${isBlockedT(t) ? '<span title="Blocked by another task">🔒</span>' : ''}</div>
    ${(t.tags || []).length ? `<div style="margin:5px 0">${t.tags.map(x => `<span class="tagchip">${esc(x)}</span>`).join('')}</div>` : ''}
    <div class="kfoot"><span style="color:${od ? 'var(--red)' : 'var(--muted)'};font-weight:${od ? 700 : 400}">${t.due ? '📅 ' + fdate(t.due) : ''}${t.recurring ? ' 🔁' : ''}</span><span class="muted">${subs.length ? '☑ ' + done + '/' + subs.length : ''}</span>${name ? miniAv(name) : '<span class="av" style="width:24px;height:24px;background:#e2e8f0"></span>'}</div></div>`;
}
function taskBoard(list){
  return `<div class="kanban">${BOARD_COLS.map(st => { const col = list.filter(t => t.status === st).sort((a, b) => PRI[a.priority].o - PRI[b.priority].o || (a.due || '9').localeCompare(b.due || '9'));
    return `<div class="kcol" ondragover="event.preventDefault()" ondrop="dropTask(event,'${st}')"><div class="khead"><b>${TS[st]}</b><span class="badge b-draft">${col.length}</span></div>
      ${col.map(taskCard).join('')}<input class="qadd" placeholder="+ Quick add task" onkeydown="if(event.key==='Enter')quickAdd('${st}',this)"></div>`; }).join('')}</div>
    ${list.filter(t => t.status === 'cancelled').length ? `<div class="muted" style="margin-top:8px;font-size:12px">${list.filter(t => t.status === 'cancelled').length} cancelled task(s) hidden — see List view.</div>` : ''}`;
}

/* ----- list ----- */
function setSort(k){ tsort = {key:k, dir:tsort.key === k ? -tsort.dir : 1}; render(); }
function taskTable(list){
  const val = {title:t => t.title.toLowerCase(), assignee:t => empName(t.assignee).toLowerCase() || '~', priority:t => PRI[t.priority].o, due:t => t.due || '9999', status:t => Object.keys(TS).indexOf(t.status)};
  const rows = [...list].sort((a, b) => { const x = val[tsort.key](a), y = val[tsort.key](b); return (x < y ? -1 : x > y ? 1 : 0) * tsort.dir; });
  const th = (k, l) => `<th style="cursor:pointer" onclick="setSort('${k}')">${l}${tsort.key === k ? (tsort.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`;
  const n = [...selT].filter(id => taskById(id)).length;
  return `${n ? `<div class="card" style="margin-bottom:10px;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#f0fdfa"><b>${n} selected</b>
      <select style="width:auto" onchange="bulkSet('status',this.value)"><option value="">Set status…</option>${Object.entries(TS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
      <select style="width:auto" onchange="bulkSet('priority',this.value)"><option value="">Set priority…</option>${Object.entries(PRI).map(([k, v]) => `<option value="${k}">${v.i} ${v.l}</option>`).join('')}</select>
      <select style="width:auto" onchange="bulkSet('assignee',this.value)"><option value="">Assign to…</option>${employees.map(e => `<option value="${e.id}">${esc(e.name)}</option>`).join('')}<option value="__none">Unassigned</option></select>
      <button class="btn sm danger" onclick="bulkDelete()">Delete</button><button class="btn sm ghost" onclick="selT.clear();render()">Clear</button></div>` : ''}
  <div class="card"><div class="tablewrap"><table><thead><tr><th style="width:30px"><input type="checkbox" style="width:auto" onchange="toggleAllT(this.checked)" ${rows.length && rows.every(t => selT.has(t.id)) ? 'checked' : ''}></th>${th('title', 'Task')}${pjSel === 'all' ? '<th>Project</th>' : ''}${th('assignee', 'Assignee')}${th('priority', 'Priority')}${th('due', 'Due date')}${th('status', 'Status')}<th>Tags</th></tr></thead>
    <tbody>${rows.map(t => `<tr style="${isOverdueT(t) ? 'background:#fef2f2' : ''}"><td><input type="checkbox" style="width:auto" ${selT.has(t.id) ? 'checked' : ''} onchange="toggleT('${t.id}',this.checked)"></td>
      <td style="cursor:pointer;white-space:normal;min-width:180px" onclick="openTask('${t.id}')"><b>${esc(t.title)}</b>${isBlockedT(t) ? ' 🔒' : ''}${t.recurring ? ' 🔁' : ''}</td>${pjSel === 'all' ? `<td>${esc((projById(t.projectId) || {}).name || '—')}</td>` : ''}
      <td>${empName(t.assignee) ? `<span style="display:flex;gap:6px;align-items:center">${miniAv(empName(t.assignee))}${esc(empName(t.assignee))}</span>` : '<span class="muted">—</span>'}</td><td>${priBadge(t.priority)}</td>
      <td style="color:${isOverdueT(t) ? 'var(--red)' : 'inherit'};font-weight:${isOverdueT(t) ? 700 : 400}">${fdate(t.due)}</td>
      <td><select style="width:auto;padding:5px 8px" onchange="changeStatus('${t.id}',this.value)">${Object.entries(TS).map(([k, v]) => `<option value="${k}" ${k === t.status ? 'selected' : ''}>${v}</option>`).join('')}</select></td>
      <td>${(t.tags || []).map(x => `<span class="tagchip">${esc(x)}</span>`).join('')}</td></tr>`).join('') || `<tr><td colspan="8" class="empty">No tasks match</td></tr>`}</tbody></table></div></div>`;
}
const toggleT = (id, on) => { on ? selT.add(id) : selT.delete(id); render(); };
function toggleAllT(on){ filteredTasks().forEach(t => on ? selT.add(t.id) : selT.delete(t.id)); render(); }
function bulkSet(field, v){
  if (!v) return;
  [...selT].map(taskById).filter(Boolean).forEach(t => { if (field === 'status') setTaskStatus(t, v); else t[field] = v === '__none' ? '' : v; });
  save(); render(); toast('Updated ' + selT.size + ' tasks');
}
function bulkDelete(){ if (!confirm('Delete ' + selT.size + ' selected tasks with their subtasks and comments?')) return; [...selT].map(taskById).filter(Boolean).forEach(removeTaskData); selT.clear(); save(); render(); }

/* ----- calendar ----- */
function calNav(d){ if (d === 0) calMonth = today().slice(0, 7); else { const [y, m] = calMonth.split('-').map(Number), x = new Date(y, m - 1 + d, 1); calMonth = iso(x).slice(0, 7); } calDay = ''; render(); }
function taskCalendar(list){
  const [y, mo] = calMonth.split('-').map(Number), lead = (new Date(y, mo - 1, 1).getDay() + 6) % 7, days = monthDays(calMonth);
  const by = {}; list.filter(t => t.due && t.due.startsWith(calMonth)).forEach(t => (by[t.due] = by[t.due] || []).push(t));
  const cells = [...Array(lead).fill(null), ...Array.from({length:days}, (_, i) => calMonth + '-' + String(i + 1).padStart(2, '0'))];
  const dayList = calDay ? list.filter(t => t.due === calDay) : [];
  return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px"><button class="btn sm ghost" onclick="calNav(-1)">‹</button><b style="font-size:16px">${monthName(calMonth)}</b><div><button class="btn sm ghost" onclick="calNav(0)">Today</button> <button class="btn sm ghost" onclick="calNav(1)">›</button></div></div>
    <div class="cal">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => `<div class="calh">${d}</div>`).join('')}
    ${cells.map(d => !d ? '<div class="cald empty-cell"></div>' : `<div class="cald ${d === today() ? 'today' : ''} ${d === calDay ? 'sel' : ''}" onclick="calDay='${d}';render()"><span class="dn">${+d.slice(8)}</span>
      ${(by[d] || []).slice(0, 3).map(t => `<div class="cchip" style="background:${PRI[t.priority].c}${isOpenT(t) ? '' : ';opacity:.45;text-decoration:line-through'}" onclick="event.stopPropagation();openTask('${t.id}')" title="${esc(t.title)}">${esc(t.title)}</div>`).join('')}${(by[d] || []).length > 3 ? `<div class="muted" style="font-size:11px">+${by[d].length - 3} more</div>` : ''}</div>`).join('')}</div>
    <div class="muted" style="margin-top:8px;font-size:12px">${Object.values(PRI).map(p => `<span style="margin-right:10px"><span style="display:inline-block;width:9px;height:9px;border-radius:3px;background:${p.c}"></span> ${p.l}</span>`).join('')}</div></div>
  ${calDay ? `<div class="card" style="margin-top:14px"><h3>Tasks due ${fdate(calDay)}</h3>${dayList.map(t => `<div class="tx" style="cursor:pointer" onclick="openTask('${t.id}')"><div><div class="t1">${esc(t.title)}</div><div class="t2">${TS[t.status]} · ${esc(empName(t.assignee) || 'Unassigned')}</div></div>${priBadge(t.priority)}</div>`).join('') || '<div class="muted">Nothing due on this day.</div>'}
    <div class="modal-actions"><button class="btn sm" onclick="taskForm({due:'${calDay}'})">+ Task on this day</button></div></div>` : ''}`;
}

/* ----- task detail ----- */
function refreshTask(id){ const sc = $('modal').scrollTop; openTask(id); $('modal').scrollTop = sc; }
function openTask(id){
  const t = taskById(id); if (!t) return; openTaskId = id;
  const p = projById(t.projectId), subs = subtasks.filter(s => s.taskId === id), cms = taskComments.filter(c => c.taskId === id).sort((a, b) => a.at.localeCompare(b.at));
  const done = subs.filter(s => s.done).length, others = tasks.filter(x => x.projectId === t.projectId && x.id !== id), blocker = t.blockedBy && taskById(t.blockedBy);
  const row = (l, inner) => `<div class="field"><label>${l}</label>${inner}</div>`;
  openModal(`<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div class="muted" style="font-size:12px">${esc(clName(p && p.clientId))} › ${esc(p ? p.name : '—')}</div><button class="btn sm ghost" onclick="closeModal()">✕ Close</button></div>
    <input value="${esc(t.title)}" style="font-size:19px;font-weight:700;margin:8px 0 6px;border-color:transparent" onchange="setTF('${id}','title',this.value)">
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">${priBadge(t.priority)} ${isOverdueT(t) ? '<span class="badge b-overdue">Overdue</span>' : ''} ${blocker && isOpenT(blocker) ? `<span class="badge b-leave">🔒 Blocked by “${esc(blocker.title)}”</span>` : ''} ${t.recurring ? `<span class="badge b-upcoming">🔁 ${t.recurring}</span>` : ''}</div>
    <div class="row2">${row('Status', `<select onchange="changeStatus('${id}',this.value)">${Object.entries(TS).map(([k, v]) => `<option value="${k}" ${k === t.status ? 'selected' : ''}>${v}</option>`).join('')}</select>`)}
      ${row('Priority', `<select onchange="setTF('${id}','priority',this.value,true)">${Object.entries(PRI).map(([k, v]) => `<option value="${k}" ${k === t.priority ? 'selected' : ''}>${v.i} ${v.l}</option>`).join('')}</select>`)}</div>
    <div class="row2">${row('Assigned to', `<select onchange="setTF('${id}','assignee',this.value)">${empOpts(t.assignee)}</select>`)}${row('Due date', `<input type="date" value="${t.due || ''}" onchange="setTF('${id}','due',this.value,true)">`)}</div>
    <div class="row2">${row('Time estimate (hours)', `<input type="number" min="0" step="any" value="${t.estimate || ''}" onchange="setTF('${id}','estimate',+this.value||0)">`)}${row('Tags (comma separated)', `<input value="${esc((t.tags || []).join(', '))}" onchange="setTF('${id}','tags',parseTags(this.value))">`)}</div>
    <div class="row2">${row('Blocked by', `<select onchange="setTF('${id}','blockedBy',this.value,true)"><option value="">— none —</option>${others.map(o => `<option value="${o.id}" ${o.id === t.blockedBy ? 'selected' : ''}>${esc(o.title)}${isOpenT(o) ? '' : ' (done)'}</option>`).join('')}</select>`)}
      ${row('Recurring', `<select onchange="setTF('${id}','recurring',this.value,true)">${[['', 'Not recurring'], ['daily', 'Daily'], ['weekly', 'Weekly'], ['monthly', 'Monthly']].map(([v, l]) => `<option value="${v}" ${v === (t.recurring || '') ? 'selected' : ''}>${l}</option>`).join('')}</select>`)}</div>
    ${row('Description', `<textarea rows="4" onchange="setTF('${id}','description',this.value)">${esc(t.description || '')}</textarea>`)}
    ${row('Attachment notes (describe what is attached)', `<input value="${esc(t.attachments || '')}" placeholder="e.g. Logo files shared on Drive, brief PDF" onchange="setTF('${id}','attachments',this.value)">`)}
    <h3 style="margin:14px 0 8px">Subtasks <span class="muted" style="font-weight:400">${subs.length ? done + '/' + subs.length : ''}</span></h3>
    ${subs.map(s => `<div class="tx" style="padding:6px 0"><label style="display:flex;gap:8px;align-items:center;color:var(--text);font-weight:500;margin:0"><input type="checkbox" style="width:auto" ${s.done ? 'checked' : ''} onchange="toggleSub('${s.id}')"><span style="${s.done ? 'text-decoration:line-through;color:var(--muted)' : ''}">${esc(s.title)}</span></label><button class="btn sm danger" onclick="delSub('${s.id}')">✕</button></div>`).join('')}
    <input placeholder="+ Add subtask (press Enter)" style="margin-top:6px" onkeydown="if(event.key==='Enter'){event.preventDefault();addSub('${id}',this)}">
    <h3 style="margin:18px 0 8px">Comments &amp; updates <span class="muted" style="font-weight:400">· log is append-only</span></h3>
    ${cms.map(c => `<div class="tx" style="align-items:flex-start;justify-content:flex-start;gap:10px">${miniAv(c.by, 30)}<div><div class="t2"><b style="color:var(--text)">${esc(c.by)}</b> · ${fmtTs(c.at)}</div><div style="white-space:pre-wrap;margin-top:2px">${esc(c.text)}</div></div></div>`).join('') || '<div class="muted">No updates yet.</div>'}
    <form onsubmit="addComment(event,'${id}')" style="margin-top:12px"><div class="row2" style="grid-template-columns:180px 1fr;gap:8px"><select name="by">${commentAuthors().map(a => `<option value="${esc(a)}" ${a === commentAuthor ? 'selected' : ''}>${esc(a)}</option>`).join('')}</select><textarea name="text" rows="2" placeholder="Add an update — e.g. Sent draft to client for review" required></textarea></div>
    <div class="modal-actions" style="margin-top:8px"><button type="button" class="btn sm danger" onclick="delTask('${id}')" style="margin-right:auto">Delete task</button><button class="btn sm">Post update</button></div></form>`, 'xl');
}
const commentAuthors = () => ['Owner', ...employees.filter(e => !e.archived).map(e => e.name)];
function setTF(id, field, val, refresh){ const t = taskById(id); if (!t) return; t[field] = val; save(); render(); if (refresh) refreshTask(id); }
function addSub(id, input){ const v = input.value.trim(); if (!v) return; subtasks.push({id:uid(), taskId:id, title:v, done:false}); save(); render(); refreshTask(id); }
function toggleSub(sid){ const s = subtasks.find(x => x.id === sid); if (s) { s.done = !s.done; save(); render(); refreshTask(s.taskId); } }
function delSub(sid){ const s = subtasks.find(x => x.id === sid); if (s) { subtasks = subtasks.filter(x => x.id !== sid); save(); render(); refreshTask(s.taskId); } }
function addComment(ev, id){
  ev.preventDefault(); const f = Object.fromEntries(new FormData(ev.target)); if (!f.text.trim()) return;
  commentAuthor = f.by; taskComments.push({id:uid(), taskId:id, at:new Date().toISOString(), by:f.by, text:f.text.trim()}); save(); refreshTask(id);
}
function delTask(id){ const t = taskById(id); if (t && confirm('Delete "' + t.title + '" with its subtasks and comments?')) { removeTaskData(t); save(); closeModal(); render(); } }

/* ========= Wiring ========= */
/* keep the app name out of the printed page header */
let _title = document.title;
window.addEventListener('beforeprint', () => { _title = document.title; document.title = ' '; });
window.addEventListener('afterprint', () => { document.title = _title; });
$('nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { view = b.dataset.view; if (view === 'employees') { empSel = null; bankShown = false; } if (view === 'clients') clSel = null; if (view === 'projects') { pjSel = null; selT.clear(); } $('sidebar').classList.remove('open'); $('scrim').classList.remove('open'); render(); window.scrollTo(0,0); } });
$('menuBtn').onclick = () => { $('sidebar').classList.add('open'); $('scrim').classList.add('open'); };
$('scrim').onclick = () => { $('sidebar').classList.remove('open'); $('scrim').classList.remove('open'); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
init(); render();
</script>
</body>
</html>
