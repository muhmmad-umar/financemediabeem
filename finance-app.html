<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agency Finance Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --teal:#0f766e; --teal-d:#0b5a54; --navy:#0f2a3d; --side:#0d1f2d;
  --gold:#b8860b; --gold-l:#f6e7b4; --green:#15803d; --green-l:#dcfce7;
  --bg:#f1f5f9; --card:#fff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --red:#dc2626; --amber:#d97706; --blue:#2563eb;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;display:flex;min-height:100vh}
button{font-family:inherit;cursor:pointer}
/* sidebar */
.sidebar{width:240px;background:var(--side);color:#cbd5e1;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;padding:20px 14px;z-index:30;transition:transform .25s}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:17px;padding:4px 8px 22px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--teal),#14b8a6);display:grid;place-items:center;font-size:18px}
.nav button{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;color:#94a3b8;padding:11px 12px;border-radius:9px;font-size:14px;font-weight:500;margin-bottom:3px;text-align:left;transition:.15s}
.nav button:hover{background:#16324a;color:#fff}
.nav button.active{background:var(--teal);color:#fff}
.nav button.allah.active{background:linear-gradient(135deg,#a37507,#d4a017);color:#fff}
.nav button.allah{color:#e6c35c}
/* main */
main{margin-left:240px;flex:1;padding:26px 30px 50px;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:24px;font-weight:700}
.topbar p{color:var(--muted);font-size:13px;margin-top:2px}
.menu-btn{display:none;background:var(--navy);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:18px}
.btn{background:var(--teal);color:#fff;border:0;border-radius:9px;padding:9px 16px;font-weight:600;font-size:13px;transition:.15s}
.btn:hover{background:var(--teal-d);transform:translateY(-1px)}
.btn.gold{background:var(--gold)}.btn.gold:hover{background:#8f6808}
.btn.ghost{background:#fff;color:var(--text);border:1px solid var(--line)}.btn.ghost:hover{background:#f8fafc}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn.danger{background:#fff;color:var(--red);border:1px solid #fecaca}.btn.danger:hover{background:#fef2f2}
/* cards */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.g-main{grid-template-columns:2fr 1fr}
.card{background:var(--card);border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(15,23,42,.06);border:1px solid var(--line);transition:.2s}
.card:hover{box-shadow:0 6px 18px rgba(15,23,42,.08)}
.card h3{font-size:15px;font-weight:600;margin-bottom:14px}
.stat .label{color:var(--muted);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.stat .value{font-size:24px;font-weight:700;margin-top:6px}
.stat .sub{color:var(--muted);font-size:12px;margin-top:4px}
.stat.teal{border-top:4px solid var(--teal)}.stat.navy{border-top:4px solid var(--navy)}.stat.amber{border-top:4px solid var(--amber)}
.allah-card{background:linear-gradient(135deg,#14532d,#166534 55%,#a37507);color:#fff;border:0;position:relative;overflow:hidden}
.allah-card::after{content:"☪";position:absolute;right:-8px;top:-24px;font-size:110px;opacity:.1}
.allah-card .label,.allah-card .sub{color:#e6e9c0}
.allah-card .value{color:#ffe58a}
.bar{height:12px;background:rgba(0,0,0,.18);border-radius:99px;overflow:hidden;margin-top:12px}
.bar>div{height:100%;background:linear-gradient(90deg,#fde68a,#f59e0b);border-radius:99px;transition:width .6s}
.bar.light{background:#e8e4cc}
.bar.light>div{background:linear-gradient(90deg,#16a34a,#b8860b)}
/* invoice cards */
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.inv-card{cursor:pointer}.inv-card:hover{transform:translateY(-2px)}
.inv-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.inv-nums span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.inv-nums b{font-size:14px}
.inv-actions{display:flex;gap:6px;flex-wrap:wrap}
.modal.wide{max-width:860px;padding:14px;background:#e9eef3}
.nav-sep{margin:14px 12px 6px;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#475569}
.nav button.personal{color:#c4b5fd}.nav button.personal:hover{background:#2a2250;color:#fff}
.nav button.personal.active{background:linear-gradient(135deg,#6d28d9,#8b5cf6);color:#fff}
.btn.pv{background:#7c3aed}.btn.pv:hover{background:#6d28d9}
.pbanner{background:linear-gradient(135deg,#ede9fe,#f5f3ff);border:1px solid #c4b5fd;color:#5b21b6;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600;margin-bottom:14px}
.psub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.psub button{border:1px solid #ddd6fe;background:#fff;color:#6d28d9;padding:8px 16px;border-radius:10px;font-size:13px;font-weight:600}
.psub button.on{background:#7c3aed;color:#fff;border-color:#7c3aed}
.ppanel{border-top:5px solid #7c3aed}
.ppanel .trk-row b{font-size:19px}
.catbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px}
.catbar .nm{width:120px;flex:none;font-weight:600}.catbar .tr{flex:1;height:10px;background:#f1f5f9;border-radius:99px;overflow:hidden}
.catbar .tr>div{height:100%;border-radius:99px}.catbar .vl{width:150px;text-align:right;flex:none;white-space:nowrap}
@media(max-width:520px){.catbar{flex-wrap:wrap}.catbar .vl{width:auto;margin-left:auto}}
.nbadge{margin-left:auto;background:#ef4444;color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:1px 8px;box-shadow:0 0 0 3px rgba(239,68,68,.25)}
.rem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.rem-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.rem-card.due{background:#fffbeb;border-color:#f4c542}.rem-card.overdue{background:#fef2f2;border-color:#fca5a5}
.rem-title{font-size:14px;line-height:1.35}
.rem-rows{margin:12px 0}.rem-rows>div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.rem-rows span{color:var(--muted)}
.b-due{background:#fde68a;color:#92400e}.b-upcoming{background:#e0f2fe;color:#075985}
.modal.xl{max-width:760px}
.av{border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;overflow:hidden;flex:none;object-fit:cover}
.emp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.emp-card{cursor:pointer}.emp-card:hover{transform:translateY(-2px)}
.emp-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.emp-meta{display:flex;justify-content:space-between;font-size:13px;margin:6px 0}
.emp-meta span{color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px 20px}
.kv div span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:3px}
.kv div b{font-weight:600;word-break:break-word}
.sec-t{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin:16px 0 10px;grid-column:1/-1}
.b-active{background:#dcfce7;color:#166534}.b-leave{background:#fef3c7;color:#92400e}.b-resigned{background:#e2e8f0;color:#475569}.b-terminated{background:#fee2e2;color:#991b1b}
.profile-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.profile-head .grow{flex:1;min-width:200px}
/* date filter bar */
.fbar{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;margin-bottom:18px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:12px}
.fpills{display:flex;gap:6px;flex-wrap:wrap}
.fpills button{border:1px solid var(--line);background:#f8fafc;color:var(--muted);padding:7px 13px;border-radius:99px;font-size:13px;font-weight:500;transition:.15s}
.fpills button:hover{background:#eef2f7;color:var(--text)}
.fpills button.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600;box-shadow:0 2px 6px rgba(15,118,110,.3)}
.fcur{font-size:14px;color:var(--text);margin-left:auto}
.fcustom{display:flex;gap:12px;flex-wrap:wrap;width:100%}
.fcustom label{font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.fcustom input{width:auto}
.badge{white-space:nowrap}
.b-obl{background:#ccfbf1;color:#0f766e}.b-vol{background:#fef3c7;color:#92400e;border:1px solid #f4d36b}
.vol-txt{color:#b7791f;font-weight:600}
.trk-hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.trk-row.vol{background:linear-gradient(90deg,#fffbeb,#fef3c7);border-radius:10px;padding:12px 14px;border:1px solid #f4d36b;color:#92400e}
.trk-row.vol small{display:block;font-size:11px;font-weight:500;color:#a16207;margin-top:2px}
.trk-row.vol b{color:#b45309}
.trk-row.total b{font-size:22px;color:#14532d}.trk-row.total span{font-weight:700}
.ptype{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.ptype label{position:relative;display:block;border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;transition:.15s}
.ptype label input{position:absolute;opacity:0;pointer-events:none}
.ptype label span{font-weight:600;display:block}.ptype label small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:2px}
.ptype label.on{border-color:#0f766e;background:#f0fdfa}
.ptype label:nth-child(2).on{border-color:#d4a017;background:#fffbeb}
.dash-vol{background:rgba(255,255,255,.12);border:1px solid rgba(255,229,138,.45);border-radius:12px;padding:12px 14px}
.dash-vol .value{color:#ffe58a}.dash-vol.total{background:rgba(255,255,255,.2)}
/* allah's share tracker */
.tracker{--c:var(--red)}.tracker.amber{--c:var(--amber)}.tracker.green{--c:var(--green)}
.tracker{border-top:5px solid var(--c)}
.trk-row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.trk-row b{font-size:18px;white-space:nowrap}.trk-row.last{border:0}.trk-rem{color:var(--c)}
.trk-bar{height:16px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-top:8px}
.trk-bar>div{height:100%;background:var(--c);border-radius:99px;transition:width .6s,background .3s}
.quote{margin-top:16px;padding:12px 16px;background:#fefce8;border-left:4px solid var(--gold);border-radius:8px;color:#713f12;font-style:italic;font-size:13px}
.quote span{font-style:normal;color:#a16207;white-space:nowrap}
tfoot td{border-top:2px solid var(--line);padding:12px}
/* formula */
.flow{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap}
.fbox{flex:1;min-width:130px;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fbox span{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.fbox b{font-size:19px;display:block;margin-top:4px}
.fbox.net{background:#ecfeff;border-color:#99f6e4}.fbox.mine{background:#f0fdfa}
.fbox.allah{background:linear-gradient(135deg,#fefce8,#dcfce7);border-color:#d4a017}.fbox.allah b{color:#8f6808}
.fop{align-self:center;font-size:22px;font-weight:700;color:var(--muted)}
/* table */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr:hover td{background:#f8fafc}
td.num,th.num{text-align:right;white-space:nowrap}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600}
.b-received,.b-paid{background:#dcfce7;color:#166534}
.b-partial,.b-pending{background:#fef3c7;color:#92400e}
.b-incPartial{background:#fef3c7;color:#92400e}.b-incFull{background:#dcfce7;color:#166534}
.b-unpaid{background:#e2e8f0;color:#475569}
.b-draft{background:#e2e8f0;color:#475569}
.b-overdue{background:#fee2e2;color:#991b1b}
.gold-txt{color:var(--gold);font-weight:600}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:28px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
input,select,textarea{font-family:inherit;font-size:13px;padding:9px 11px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:var(--text);width:100%}
.filters input,.filters select{width:auto;min-width:140px;flex:1}
input:focus,select:focus,textarea:focus{outline:2px solid #5eead4;border-color:var(--teal)}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:480px;max-height:92vh;overflow:auto;animation:pop .2s}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:none;opacity:1}}
.modal h2{font-size:18px;margin-bottom:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{background:#fefce8;border:1px solid var(--gold-l);color:#854d0e;border-radius:8px;padding:8px 10px;font-size:12px;margin-bottom:12px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.chart-box{position:relative;height:280px}
.tx{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f1f5f9;gap:10px}
.tx:last-child{border:0}
.tx .t1{font-weight:600}.tx .t2{font-size:12px;color:var(--muted)}
.tx .amt{font-weight:700;text-align:right;white-space:nowrap}
.tx .amt small{display:block;font-weight:500;color:var(--gold);font-size:11px}
.toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;z-index:99;opacity:0;transform:translateY(10px);transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.scrim{display:none}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g-main{grid-template-columns:1fr}}
@media(max-width:820px){
  .sidebar{transform:translateX(-100%)}.sidebar.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}
  main{margin-left:0;padding:16px 14px 40px}.menu-btn{display:block}
  .g3,.g2{grid-template-columns:1fr}.stat .value{font-size:21px}.topbar h1{font-size:20px}
}
@media(max-width:520px){.g4{grid-template-columns:1fr}.row2{grid-template-columns:1fr}}
@media print{
  @page{margin:0;size:A4}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  body{display:block;background:#fff}
  .sidebar,main,.toast,.scrim,.no-print,.fbar{display:none!important}
  .overlay{position:static!important;display:block!important;background:none!important;padding:0!important}
  .modal,.modal.wide{box-shadow:none;max-width:none;padding:0.5in;background:#fff;max-height:none;overflow:visible;animation:none}
  .inv-sheet{border:0;border-radius:0;padding:0}
}
</style>
<style id="invCss">
@page{margin:0;size:A4}
@media print{*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}}
.inv-sheet{background:#fff;color:#0f172a;border-radius:14px;font-family:Inter,system-ui,sans-serif;border:1px solid #e2e8f0;font-size:14px;padding:36px 40px}
.inv-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.inv-brand{font-size:36px;font-weight:800;letter-spacing:.06em;line-height:1.05;color:#0f2a3d}
.inv-doc{text-align:right}
.inv-doc b{display:block;font-size:34px;font-weight:800;letter-spacing:.08em;line-height:1.05;color:#0f2a3d}
.inv-doc span{display:block;margin-top:6px;color:#64748b;font-size:13px}
.inv-bill{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin:30px 0 22px;flex-wrap:wrap}
.inv-lbl{font-size:12px;font-weight:800;letter-spacing:.1em;color:#0f172a;margin-bottom:6px}
.inv-client{font-size:18px;font-weight:600}
.inv-dates{text-align:right;line-height:1.9;color:#475569}.inv-dates b{color:#0f172a}
.inv-bar{display:grid;grid-template-columns:repeat(4,1fr);border-radius:12px;overflow:hidden;margin-bottom:28px}
.inv-bar>div{padding:16px 18px;background:#f2b21a;color:#2b1d00}
.inv-bar>div.dark{background:#0f2a3d;color:#fff}
.inv-bar span{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8;margin-bottom:6px}
.inv-bar b{font-size:17px;font-weight:800}
.inv-table{width:100%;border-collapse:collapse}
.inv-table th{text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#64748b;padding:10px 4px;border-bottom:2px solid #0f2a3d}
.inv-table td{padding:14px 4px;border-bottom:1px solid #e2e8f0}
.inv-table .num{text-align:right;white-space:nowrap}
.inv-note{color:#64748b;font-size:12px;margin-top:4px}
.inv-table tfoot td{border-bottom:1px solid #e2e8f0;font-weight:600}
.inv-table tfoot tr.got td{color:#15803d}
.inv-table tfoot tr.rem td{font-size:18px;font-weight:800;border-bottom:0;padding-top:16px}
.inv-pay{margin-top:26px}
.inv-pay .row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #e2e8f0;color:#334155}
.inv-foot{margin-top:34px;padding-top:20px;border-top:1px solid #cbd5e1;text-align:center;color:#475569;line-height:1.8}
.inv-foot b{color:#0f2a3d;letter-spacing:.14em;font-size:15px}
@media print{.inv-sheet{border:0!important;border-radius:0!important;padding:0!important}}
@media(max-width:600px){.inv-bar{grid-template-columns:1fr 1fr}.inv-sheet{padding:22px}.inv-brand{font-size:28px}.inv-doc b{font-size:26px}}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="logo">₨</div>Agency Finance</div>
  <nav class="nav" id="nav">
    <button data-view="dashboard">📊 Dashboard</button>
    <button data-view="income">💰 Income / Cash Flow</button>
    <button data-view="expenses">💸 Expenses</button>
    <button data-view="invoices">🧾 Invoices</button>
    <button data-view="allah" class="allah">🤲 Allah's Share</button>
    <button data-view="reports">📈 Reports</button>
    <button data-view="employees">🧑‍💼 Employees</button>
    <div class="nav-sep">Personal</div>
    <button data-view="personal" class="personal">👤 Personal Finance</button>
  </nav>
</aside>
<div class="scrim" id="scrim"></div>

<main>
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div><h1 id="title"></h1><p id="subtitle"></p></div>
    </div>
    <div id="topActions"></div>
  </div>
  <div id="filterBar"></div>
  <div id="view"></div>
</main>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ========= Config & storage ========= */
const ALLAH_RATE = 0.10;
const K = {inc:'income_entries', inv:'invoices', ch:'charity_expenses', exp:'expenses',
  pe:'personal_expenses', pi:'personal_income', pw:'personal_withdrawals', ra:'recurring_alerts', emp:'employees', sp:'salary_payments', el:'employee_leaves'};
const load = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } };
const save = () => {
  syncIncome();
  try {
    localStorage.setItem(K.inc, JSON.stringify(income));
    localStorage.setItem(K.inv, JSON.stringify(invoices));
    localStorage.setItem(K.ch, JSON.stringify(charity));
    localStorage.setItem(K.exp, JSON.stringify(expenses));
    localStorage.setItem(K.pe, JSON.stringify(personalExp));
    localStorage.setItem(K.pi, JSON.stringify(personalInc));
    localStorage.setItem(K.pw, JSON.stringify(personalWd));
    localStorage.setItem(K.ra, JSON.stringify(recurring));
    localStorage.setItem(K.emp, JSON.stringify(employees));
    localStorage.setItem(K.sp, JSON.stringify(salaryPay));
    localStorage.setItem(K.el, JSON.stringify(empLeaves));
  } catch(e){ toast('Could not save to localStorage'); }
};
let income, invoices, charity, expenses;
let personalExp = [], personalInc = [], personalWd = [];
let employees = [], salaryPay = [], empLeaves = [];   // Employees section: profiles, salary payments, leave log
let recurring = [];   // recurring invoice reminders: {client_name, frequency_days, last_invoice_date, next_alert_date, active, last_amount}   // Personal Finance: separate world, never used by agency maths

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const today = () => iso(new Date());
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return iso(d); };
const daysAhead = n => daysAgo(-n);
const fmt = n => '₨ ' + Math.round(n || 0).toLocaleString('en-US');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const monthKey = d => d.slice(0,7);
const monthLabel = k => new Date(k + '-01T00:00:00').toLocaleDateString('en-US',{month:'short',year:'numeric'});
const fdate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : '—';
/* Shares are based on NET PROFIT (received income − expenses); never negative for Allah's Share */
const allahOf = net => Math.max(0, net) * ALLAH_RATE;
const mineOf = net => net > 0 ? net * (1 - ALLAH_RATE) : net;

/* ONE source of truth: the invoice.
   invoice = {id, client, service, category, date, expectedBy, notes, total_amount, payments:[{id, amount, date, note}]}
   received_amount = sum of payments (money actually in hand) — ALL calculations use it.
   `income` (localStorage key income_entries) is the ledger view of the invoices, rebuilt on every save. */
const sum = (arr, f) => arr.reduce((t, x) => t + f(x), 0);
const invReceived = i => sum(i.payments || [], p => p.amount);
const invRemaining = i => Math.max(0, i.total_amount - invReceived(i));
const invById = id => invoices.find(x => x.id === id);
function invStatus(i){
  const rec = invReceived(i);
  if (i.total_amount - rec <= 0) return 'paid';
  if (i.expectedBy && today() > i.expectedBy) return 'overdue';
  return rec > 0 ? 'partial' : 'unpaid';
}
const STATUS_LABEL = {unpaid:'Unpaid', partial:'Partially Paid', paid:'Paid in Full', overdue:'Overdue'};
function syncIncome(){
  income = invoices.map(i => {
    const last = (i.payments || []).reduce((m, p) => p.date > m ? p.date : m, '');
    return {id:i.id, invoiceId:i.id, client:i.client, description:i.service, category:i.category || 'Services', date:last || i.date,
            total_amount:i.total_amount, received_amount:invReceived(i)};
  });
}
const incRemaining = e => e.total_amount - e.received_amount;
const incLabel = e => `${fmt(e.total_amount)} total / <b style="color:var(--green)">${fmt(e.received_amount)} received</b>`;
/* every payment actually received, dated when it came in */
const rcv = () => received().filter(e => inRange(e.date));
const expensesIn = () => expenses.filter(e => inRange(e.date));
const cType = c => c.type === 'voluntary' ? 'voluntary' : 'obligated';   // payments without a type are obligated
const charityIn = () => charity.filter(c => inRange(c.date));
const invoicesIn = () => invoices.filter(i => inRange(i.date));
/* ledger rows for the period: invoices that received a payment in range, or were created in range with no payment yet */
const incomeRows = () => income.filter(e => { const i = invById(e.invoiceId); return (i.payments || []).some(p => inRange(p.date)) || (!(i.payments || []).length && inRange(i.date)); });
const received = () => invoices.flatMap(i => (i.payments || []).map(p => ({date:p.date, client:i.client, category:i.category || 'Services', received_amount:p.amount})));

function resetData(){
  if (!confirm('Delete ALL data (income, expenses, invoices, Allah\'s Share payments)? This cannot be undone.')) return;
  invoices = []; charity = []; expenses = []; save(); render(); toast('All data cleared');
}
const DATA_VERSION = '4';
function init(){
  let ver = null; try { ver = localStorage.getItem('data_version'); } catch(e){}
  if (!ver) {   // first run: start completely empty, clearing any pre-loaded data
    income = []; invoices = []; charity = []; expenses = []; personalExp = []; personalInc = []; personalWd = []; recurring = []; employees = []; salaryPay = []; empLeaves = [];
    save(); try { localStorage.setItem('data_version', DATA_VERSION); } catch(e){}
    return;
  }
  income = load(K.inc); invoices = load(K.inv); charity = load(K.ch); expenses = load(K.exp);
  [income, invoices, charity, expenses] = [income, invoices, charity, expenses].map(a => Array.isArray(a) ? a : []);
  charity.forEach(c => { if (c.type !== 'voluntary') c.type = 'obligated'; });
  [personalExp, personalInc, personalWd] = [load(K.pe), load(K.pi), load(K.pw)].map(a => Array.isArray(a) ? a : []);
  if (ver !== DATA_VERSION) {   // merge the old separate income entries + invoices into single invoice records
    const direct = income.filter(e => !e.invoiceId);
    invoices.forEach(i => {
      if (i.total_amount === undefined) { i.total_amount = i.amount; delete i.amount; }
      if (!i.date) { i.date = i.issued || today(); delete i.issued; }
      delete i.number; delete i.status; delete i.due; delete i.paidDate;
      i.payments = i.payments || []; i.notes = i.notes || ''; i.category = i.category || 'Services';
    });
    direct.forEach(e => {
      const rec = e.received_amount ?? e.amount ?? 0, total = e.total_amount ?? Math.max(e.total || 0, rec);
      invoices.push({id:e.id, client:e.client, service:e.description || e.category || 'Income', category:e.category || 'Services', date:e.date, expectedBy:'', notes:'',
        total_amount:total, payments: rec > 0 ? [{id:uid(), amount:rec, date:e.date, note:''}] : []});
    });
    save(); try { localStorage.setItem('data_version', DATA_VERSION); } catch(e){}
  }
  [employees, salaryPay, empLeaves] = [load(K.emp), load(K.sp), load(K.el)].map(a => Array.isArray(a) ? a : []);
  const ra = load(K.ra);
  if (Array.isArray(ra)) recurring = ra;
  else { recurring = []; [...invoices].sort((a, b) => a.date.localeCompare(b.date)).forEach(recOnInvoice); save(); }   // first time: build reminders from existing invoices
  syncIncome();
}

/* ========= Date filter (shared by every tab, defaults to This Month) ========= */
let period = {mode:'month', from:'', to:''};
function rangeOf(){
  const n = new Date(), y = n.getFullYear(), m = n.getMonth();
  switch (period.mode) {
    case 'today': return {from:today(), to:today()};
    case 'week': { const dow = (n.getDay() + 6) % 7, a = new Date(y, m, n.getDate() - dow), b = new Date(y, m, n.getDate() - dow + 6); return {from:iso(a), to:iso(b)}; }
    case 'month': return {from:iso(new Date(y, m, 1)), to:iso(new Date(y, m + 1, 0))};
    case 'last': return {from:iso(new Date(y, m - 1, 1)), to:iso(new Date(y, m, 0))};
    case 'custom': return {from:period.from, to:period.to};
    default: return null;   // all time
  }
}
const inRange = d => { const r = rangeOf(); return !r || (d >= r.from && d <= r.to); };
const PERIODS = [['today','Today'],['week','This Week'],['month','This Month'],['last','Last Month'],['custom','Custom Range'],['all','All Time']];
function periodLabel(){
  const r = rangeOf(); if (!r) return 'All time';
  if (period.mode === 'month' || period.mode === 'last') return new Date(r.from + 'T00:00:00').toLocaleDateString('en-US', {month:'long', year:'numeric'});
  return r.from === r.to ? fdate(r.from) : fdate(r.from) + ' – ' + fdate(r.to);
}
function setPeriod(mode){
  period.mode = mode;
  if (mode === 'custom' && !period.from) { period.from = iso(new Date(new Date().getFullYear(), new Date().getMonth(), 1)); period.to = today(); }
  render();
}
function setCustom(which, v){
  if (!v) return;
  period[which] = v;
  if (period.from > period.to) { if (which === 'from') period.to = v; else period.from = v; }   // keep From ≤ To
  render();
}
function filterBar(){
  return `<div class="fbar"><div class="fpills">${PERIODS.map(([k,l]) => `<button class="${period.mode === k ? 'on' : ''}" onclick="setPeriod('${k}')">${l}</button>`).join('')}</div>
    <div class="fcur">📅 <b>${periodLabel()}</b></div>
    ${period.mode === 'custom' ? `<div class="fcustom"><label>From <input type="date" value="${period.from}" max="${period.to}" onchange="setCustom('from',this.value)"></label><label>To <input type="date" value="${period.to}" min="${period.from}" onchange="setCustom('to',this.value)"></label></div>` : ''}</div>`;
}

/* ========= Recurring invoice reminders ========= */
const REC_DAYS = [15, 30, 45, 60, 90];
const ckey = n => String(n).trim().toLowerCase();
const encAttr = n => encodeURIComponent(n).replace(/'/g, '%27');
const recFind = name => recurring.find(r => ckey(r.client_name) === ckey(name));
const recStatus = r => r.next_alert_date < today() ? 'overdue' : r.next_alert_date === today() ? 'due' : 'upcoming';
const recDue = () => recurring.filter(r => r.active && r.next_alert_date <= today());
/* every new invoice (re)schedules that client's next reminder: issue date + frequency, so an existing alert clears automatically */
function recOnInvoice(inv){
  let r = recFind(inv.client);
  if (!r) { r = {client_name:inv.client.trim(), frequency_days:30, last_invoice_date:'', next_alert_date:'', active:true, last_amount:0}; recurring.push(r); }
  if (!r.last_invoice_date || inv.date >= r.last_invoice_date) {
    r.client_name = inv.client.trim(); r.last_invoice_date = inv.date; r.last_amount = inv.total_amount;
    r.next_alert_date = addDays(inv.date, r.frequency_days);
  }
}
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5);
function recBadge(r){
  const st = recStatus(r);
  return st === 'overdue' ? `<span class="badge b-overdue">Overdue · ${daysBetween(r.next_alert_date, today())}d</span>` : st === 'due' ? '<span class="badge b-due">Due Today</span>' : '<span class="badge b-upcoming">Upcoming</span>';
}
function createFromAlert(enc){
  const r = recFind(decodeURIComponent(enc)); if (!r) return;
  incomeForm({client:r.client_name, total:r.last_amount, received:0, fromAlert:true});
}
function dismissAlert(enc){
  const name = decodeURIComponent(enc);
  openModal(`<h2>Dismiss reminder</h2><p style="margin-bottom:16px">Remove the reminder for <b>${esc(name)}</b> permanently, or snooze it for 7 days?</p>
    <div class="modal-actions" style="flex-wrap:wrap"><button class="btn ghost" onclick="closeModal()">Cancel</button>
    <button class="btn" onclick="snoozeAlert('${enc}')">Snooze 7 days</button>
    <button class="btn danger" onclick="removeAlert('${enc}', true)">Remove permanently</button></div>`);
}
function snoozeAlert(enc){ const r = recFind(decodeURIComponent(enc)); if (r) { r.next_alert_date = addDays(today(), 7); save(); closeModal(); render(); toast('Snoozed for 7 days'); } }
function removeAlert(enc, skipConfirm){
  const name = decodeURIComponent(enc);
  if (!skipConfirm && !confirm('Remove the recurring reminder for ' + name + '? (e.g. the client has left)')) return;
  recurring = recurring.filter(r => ckey(r.client_name) !== ckey(name)); save(); closeModal(); render(); toast('Reminder removed');
}
function toggleAlert(enc){ const r = recFind(decodeURIComponent(enc)); if (r) { r.active = !r.active; save(); render(); } }
function editAlert(enc){
  const r = recFind(decodeURIComponent(enc)); if (!r) return;
  openModal(`<h2>Edit reminder · ${esc(r.client_name)}</h2><form onsubmit="saveAlert(event,'${enc}')">
    <div class="field"><label>Frequency</label><select name="frequency_days">${REC_DAYS.map(d => `<option value="${d}" ${d === r.frequency_days ? 'selected' : ''}>Every ${d} days</option>`).join('')}</select></div>
    <div class="field"><label>Next alert date</label><input name="next_alert_date" type="date" value="${r.next_alert_date}" required></div>
    <div class="hint">Last invoice: ${fdate(r.last_invoice_date)}. If you only change the frequency, the next alert date is recalculated from the last invoice date.</div>
    <div class="modal-actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn">Save</button></div></form>`);
}
function saveAlert(e, enc){
  e.preventDefault(); const r = recFind(decodeURIComponent(enc)); if (!r) return; const f = Object.fromEntries(new FormData(e.target));
  const freq = +f.frequency_days, dateChanged = f.next_alert_date !== r.next_alert_date;
  r.next_alert_date = (!dateChanged && freq !== r.frequency_days && r.last_invoice_date) ? addDays(r.last_invoice_date, freq) : f.next_alert_date;
  r.frequency_days = freq; save(); closeModal(); render(); toast('Reminder updated');
}

        <td class="num"><button class="btn sm ghost" onclick="editAlert('${e}')">Edit</button> <button class="btn sm danger" onclick="removeAlert('${e}')">Remove</button></td></tr>`; }).join('') || '<tr><td colspan="5" class="empty">No recurring reminders yet</td></tr>'}</tbody>

/* ========= Derived values ========= */
function totals(){
  const rec = rcv(), invs = invoicesIn();
  const totalIn = sum(rec, e => e.received_amount), totalExp = sum(expensesIn(), e => e.amount);
  const net = totalIn - totalExp;
  const allahTotal = allahOf(net), chIn = charityIn();
  const given = sum(chIn.filter(c => cType(c) === 'obligated'), c => c.amount);   // only obligated payments reduce what is owed
  const voluntary = sum(chIn.filter(c => cType(c) === 'voluntary'), c => c.amount);
  const netAll = sum(received(), e => e.received_amount) - sum(expenses, e => e.amount);
  return {
    invoiced: sum(invs, i => i.total_amount),
    outstanding: sum(invs, invRemaining),
    overdueAmt: sum(invs.filter(i => invStatus(i) === 'overdue'), invRemaining),
    totalIn, totalExp, net,
    mine: mineOf(net), allahTotal, given, voluntary, totalGiven: given + voluntary, remaining: allahTotal - given,
    allRemaining: allahOf(netAll) - sum(charity.filter(c => cType(c) === 'obligated'), c => c.amount),
    pct: allahTotal > 0 ? Math.min(100, given / allahTotal * 100) : 0
  };
}

/* chart buckets: by day for ranges up to ~2 months, otherwise by month */
function addDays(d, n){ const x = new Date(d + 'T00:00:00'); x.setDate(x.getDate() + n); return iso(x); }
function chartBuckets(){
  const rec = rcv(), ex = expensesIn();
  const dates = [...rec.map(e => e.date), ...ex.map(e => e.date)].sort();
  if (!dates.length) return {labels:[], inc:[], exp:[]};
  const r = rangeOf(), lo = r ? r.from : dates[0];
  const hi = r ? (r.to > today() ? (dates[dates.length-1] > today() ? dates[dates.length-1] : today()) : r.to) : dates[dates.length-1];
  const daily = (new Date(hi) - new Date(lo)) / 864e5 <= 62;
  const keys = [];
  if (daily) for (let d = lo; d <= hi; d = addDays(d, 1)) keys.push(d);
  else { let [y, m] = [+lo.slice(0,4), +lo.slice(5,7)]; while (y + '-' + String(m).padStart(2,'0') <= monthKey(hi)) { keys.push(y + '-' + String(m).padStart(2,'0')); if (++m > 12) { m = 1; y++; } } }
  const k = d => daily ? d : monthKey(d);
  return {labels:keys.map(x => daily ? new Date(x + 'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}) : monthLabel(x)),
    inc:keys.map(x => sum(rec.filter(e => k(e.date) === x), e => e.received_amount)),
    exp:keys.map(x => sum(ex.filter(e => k(e.date) === x), e => e.amount))};
}
function afterDashboard(){
  const b = chartBuckets();
  chart('cDash', {type:'bar', data:{labels:b.labels, datasets:[

    {label:'Expenses', data:b.exp, backgroundColor:'#94a3b8', borderRadius:5}

}

function saveEdit(e, id){
  e.preventDefault(); const i = invById(id); if (!i) return; const f = Object.fromEntries(new FormData(e.target));
  const total = +f.total_amount, rec = +f.received_amount;
  if (!(total > 0) || !(rec >= 0)) { alert('Enter a valid Total Amount and Amount Received.'); return; }
  if (rec > total) { alert('Amount Received cannot be more than Total Amount.'); return; }
  Object.assign(i, {client:f.client.trim(), service:f.service.trim(), date:f.date, category:f.category, expectedBy:f.expectedBy || '', notes:f.notes.trim(), total_amount:total});
  const diff = rec - invReceived(i);
  if (diff > 0) addPayment(i, diff, today(), 'Added via edit');
  else if (diff < 0) {   // remove the difference from the most recent payments
    let cutBy = -diff;
    for (let k = i.payments.length - 1; k >= 0 && cutBy > 0; k--) {
      const p = i.payments[k];
      if (p.amount <= cutBy) { cutBy -= p.amount; i.payments.splice(k, 1); } else { p.amount -= cutBy; cutBy = 0; }
    }
  }
  save(); closeModal(); render(); toast('Invoice updated · totals recalculated');
}

  save(); closeModal(); render(); toast('Personal expense saved');
}

function pDel(kind, id){
  if (!confirm('Delete this personal entry?')) return;
  if (kind === 'pe') personalExp = personalExp.filter(x => x.id !== id);
  if (kind === 'pi') personalInc = personalInc.filter(x => x.id !== id);
  if (kind === 'pw') personalWd = personalWd.filter(x => x.id !== id);
  save(); render();
}

/* ========= Employees ========= */
const EMP_TYPES = ['Full Time','Part Time','Freelancer','Intern'];
const EMP_STATUS = ['Active','On Leave','Resigned','Terminated'];
const PAY_METHODS = ['Bank Transfer','Cash','EasyPaisa','JazzCash'];
const SAL_TYPES = ['Fixed','Hourly','Per Project'];
const LEAVE_TYPES = ['Sick','Annual','Unpaid','WFH'];
let empSel = null, empTab = 'overview', bankShown = false, _empPhoto;
const ef = {q:'', f:'all'};
const empById = id => employees.find(e => e.id === id);
const curMonth = () => today().slice(0, 7);
const monthName = m => new Date(m + '-01T00:00:00').toLocaleDateString('en-US', {month:'long', year:'numeric'});
const onPayroll = e => !e.archived && (e.status === 'Active' || e.status === 'On Leave');
const empPayments = (id, m) => salaryPay.filter(p => p.employee_id === id && (!m || p.month === m));
/* Pro-rata for the joining month: (salary ÷ days in month) × days worked, rounded to the nearest rupee. Joining on the 1st = full salary. */
const monthDays = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo, 0).getDate(); };
function proInfo(e){
  if (!e.joinDate) return null;
  const m = e.joinDate.slice(0, 7), day = +e.joinDate.slice(8, 10);
  if (day <= 1) return null;
  const total = monthDays(m), days = total - day + 1;
  return {month:m, days, total, amount:Math.round((+e.salary || 0) / total * days), lastDay: day === total};
}
const dueAmount = (e, m) => { const p = proInfo(e); return p && p.month === m ? p.amount : (+e.salary || 0); };
const proText = p => `${p.days} day${p.days > 1 ? 's' : ''} of ${p.total} — ${fmt(p.amount)}`;
function payDueDate(e, m){ const [y, mo] = m.split('-').map(Number), last = new Date(y, mo, 0).getDate(); return m + '-' + String(Math.min(+e.payDay || 1, last)).padStart(2, '0'); }
/* paid = a salary payment has been recorded for this month; overdue = past this month's pay date and still unpaid */
function empMonthStatus(e){
  const m = curMonth();
  if (empPayments(e.id, m).length) return 'paid';
  if (!onPayroll(e) || (e.joinDate && e.joinDate.slice(0, 7) > m)) return 'na';
  return today() > payDueDate(e, m) ? 'overdue' : 'unpaid';
}
const payBadge = st => ({paid:'<span class="badge b-paid">Paid</span>', overdue:'<span class="badge b-overdue">Overdue</span>', unpaid:'<span class="badge b-unpaid">Unpaid</span>', na:'<span class="muted">—</span>'}[st]);
const stBadge = st => `<span class="badge b-${({'Active':'active','On Leave':'leave','Resigned':'resigned','Terminated':'terminated'})[st] || 'resigned'}">${esc(st)}</span>`;
function avatar(e, size = 44){
  if (e.photo) return `<img class="av" src="${e.photo}" alt="" style="width:${size}px;height:${size}px">`;
  const ini = e.name.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase(), hue = [...e.name].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 0);
  return `<span class="av" style="width:${size}px;height:${size}px;font-size:${size * .38}px;background:hsl(${hue} 45% 42%)">${esc(ini)}</span>`;
}
function empStats(){
  const pay = employees.filter(onPayroll), m = curMonth();
  return {active: employees.filter(e => !e.archived && e.status === 'Active').length, bill: sum(pay, e => +e.salary || 0),
    paid: sum(salaryPay.filter(p => p.month === m), p => p.amount),
    pending: sum(pay.filter(e => ['unpaid', 'overdue'].includes(empMonthStatus(e))), e => dueAmount(e, m))};
}
const maskNum = v => !v ? '—' : v.length <= 4 ? '••••' : '•'.repeat(Math.min(12, v.length - 4)) + v.slice(-4);

function vEmployees(){ return empSel && empById(empSel) ? vEmpProfile(empById(empSel)) : vEmpList(); }

function vEmpList(){
  const st = empStats(), q = ef.q.toLowerCase();
  const list = employees.filter(e => {
    if (ef.f === 'archived') return e.archived;
    if (e.archived) return false;
    return (ef.f === 'all' || (ef.f === 'active' && e.status === 'Active') || (ef.f === 'leave' && e.status === 'On Leave') || (ef.f === 'freelancer' && e.type === 'Freelancer') || (ef.f === 'unpaid' && ['unpaid', 'overdue'].includes(empMonthStatus(e))))
      && (!q || (e.name + ' ' + e.designation).toLowerCase().includes(q));
  }).sort((a, b) => a.name.localeCompare(b.name));
  const exps = expensesIn().filter(x => x.employee_id).sort((a, b) => b.date.localeCompare(a.date));
  return `
  <div class="card ppanel" style="margin-bottom:16px;border-top-color:var(--teal)">
    <h3>🧑‍💼 Employee Overview · ${monthName(curMonth())}</h3>
    <div class="trk-row"><span>Total Employees (Active):</span><b>${st.active}</b></div>
    <div class="trk-row"><span>Total Monthly Salary Bill:</span><b>${fmt(st.bill)}</b></div>
    <div class="trk-row"><span>Salaries Paid This Month:</span><b style="color:var(--green)">${fmt(st.paid)}</b></div>
    <div class="trk-row last"><span>Salaries Pending This Month:</span><b style="color:${st.pending ? 'var(--red)' : 'var(--muted)'}">${fmt(st.pending)}</b></div>
  </div>
  <div class="card" style="margin-bottom:16px">
    <div class="filters" style="margin-bottom:10px"><input placeholder="Search by name or role…" value="${esc(ef.q)}" oninput="ef.q=this.value;renderKeep(this)"></div>
    <div class="fpills">${[['all','All'],['active','Active'],['leave','On Leave'],['freelancer','Freelancer'],['unpaid','Unpaid This Month'],['archived','Archived']].map(([k, l]) => `<button class="${ef.f === k ? 'on' : ''}" onclick="ef.f='${k}';render()">${l}</button>`).join('')}</div>
  </div>
  <div class="emp-grid">${list.map(e => { const ms = empMonthStatus(e); return `
    <div class="card emp-card" onclick="openEmp('${e.id}')">
      <div class="emp-head">${avatar(e)}<div style="flex:1;min-width:0"><b style="font-size:15px">${esc(e.name)}</b><div class="muted">${esc(e.designation || '—')} · ${esc(e.type)}</div></div>${stBadge(e.status)}</div>
      <div class="emp-meta"><span>Salary</span><b>${fmt(e.salary)} <span class="muted" style="font-weight:400">/ ${esc(e.salaryType === 'Fixed' ? 'month' : e.salaryType.toLowerCase())}</span></b></div>
      <div class="emp-meta"><span>${monthName(curMonth())}${proInfo(e) && proInfo(e).month === curMonth() ? ' · <b style="color:#b45309">Pro-Rata ' + fmt(proInfo(e).amount) + '</b>' : ''}</span>${payBadge(ms)}</div>
      ${['unpaid', 'overdue'].includes(ms) ? `<div class="inv-actions" style="margin-top:10px"><button class="btn sm" onclick="event.stopPropagation();salaryForm('${e.id}')">Mark Paid</button></div>` : ''}
    </div>`; }).join('') || '<div class="card empty" style="grid-column:1/-1">No employees found — click “+ Add Employee”.</div>'}</div>
  <div class="card" style="margin-top:16px"><h3>Salary expense entries · ${periodLabel()}</h3>
    <div class="muted" style="margin-bottom:10px">Each paid salary is added to Agency Expenses (category “Salaries”), so it reduces Net Profit and Allah's Share. Total <b>${fmt(sum(exps, x => x.amount))}</b></div>
    <div class="tablewrap"><table><thead><tr><th>Date</th><th>Employee</th><th>Description</th><th class="num">Amount</th></tr></thead>
      <tbody>${exps.map(x => `<tr><td>${fdate(x.date)}</td><td><b>${esc((empById(x.employee_id) || {}).name || 'Removed employee')}</b></td><td>${esc(x.description)}</td><td class="num"><b>${fmt(x.amount)}</b></td></tr>`).join('') || '<tr><td colspan="4" class="empty">No salary expenses in this period</td></tr>'}</tbody></table></div></div>`;
}
function openEmp(id){ empSel = id; empTab = 'overview'; bankShown = false; render(); window.scrollTo(0, 0); }
function backEmp(){ empSel = null; bankShown = false; render(); }
const setEmpTab = t => { empTab = t; if (t !== 'bank') bankShown = false; render(); };

function vEmpProfile(e){
  const tabs = [['overview', 'Overview'], ['bank', 'Bank Details'], ['salary', 'Salary History'], ['leave', 'Leave & Absence'], ['notes', 'Notes']];
  const body = {overview:empOverview, bank:empBank, salary:empSalary, leave:empLeave, notes:empNotes}[empTab](e);
  return `<button class="btn ghost sm" onclick="backEmp()" style="margin-bottom:12px">← All employees</button>
  <div class="card" style="margin-bottom:16px"><div class="profile-head">${avatar(e, 72)}
    <div class="grow"><h2 style="font-size:22px">${esc(e.name)}</h2><div class="muted">${esc(e.designation || '—')} · ${esc(e.type)}</div><div style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">${stBadge(e.status)} ${e.archived ? '<span class="badge b-draft">Archived</span>' : ''} ${payBadge(empMonthStatus(e))} <span class="muted" style="font-size:12px">${monthName(curMonth())}</span></div></div>
    <div class="inv-actions"><button class="btn sm" onclick="salaryForm('${e.id}')">Record Salary</button><button class="btn sm ghost" onclick="empForm('${e.id}')">Edit</button>
      <button class="btn sm ghost" onclick="archiveEmp('${e.id}')">${e.archived ? 'Unarchive' : 'Archive'}</button><button class="btn sm danger" onclick="delEmp('${e.id}')">Delete</button></div></div></div>
  <div class="psub">${tabs.map(([k, l]) => `<button class="${empTab === k ? 'on' : ''}" style="color:${empTab === k ? '#fff' : 'var(--teal)'};border-color:#99d5cf;${empTab === k ? 'background:var(--teal)' : ''}" onclick="setEmpTab('${k}')">${l}</button>`).join('')}</div>${body}`;
}
const kv = (l, v) => `<div><span>${l}</span><b>${v ? esc(v) : '<span class="muted" style="display:inline;font-weight:400">—</span>'}</b></div>`;
function empOverview(e){
  return `<div class="card"><div class="kv">
    <div class="sec-t">Employment</div>${kv('Designation', e.designation)}${kv('Employment type', e.type)}${kv('Join date', e.joinDate && fdate(e.joinDate))}${kv('Status', e.status)}
    <div class="sec-t">Contact & personal</div>${kv('Phone', e.phone)}${kv('Personal email', e.email)}${kv('Address', e.address)}${kv('Emergency contact', e.emergencyName)}${kv('Emergency number', e.emergencyPhone)}${kv('CNIC', e.cnic)}${kv('Date of birth', e.dob && fdate(e.dob))}
    <div class="sec-t">Salary</div>${kv('Monthly salary', fmt(e.salary))}${kv('Salary type', e.salaryType)}${kv('Payment date', 'Every ' + ordinal(e.payDay || 1) + ' of the month')}${kv('Payment method', e.payMethod)}
  </div></div>`;
}
const ordinal = n => n + (['th', 'st', 'nd', 'rd'][(n % 100 >> 3 ^ 1 && n % 10) || 0] || 'th');
function empBank(e){
  const sh = bankShown;
  return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px"><h3 style="margin:0">🔒 Bank / Payment Details</h3>
      <button class="btn sm ${sh ? 'ghost' : ''}" onclick="bankShown=!bankShown;render()">${sh ? 'Hide details' : 'Click to reveal'}</button></div>
    <div class="kv">${kv('Bank name', e.bankName)}${kv('Account title', e.accountTitle)}${kv('Account number', sh ? e.accountNumber : maskNum(e.accountNumber))}${kv('IBAN', sh ? e.iban : maskNum(e.iban))}${kv('Payment method', e.payMethod)}</div>
    <div class="muted" style="margin-top:14px;font-size:12px">Account numbers stay hidden until you reveal them, and are hidden again when you leave this tab.</div></div>`;
}
function empSalary(e){
  const pro = proInfo(e);
  const rows = empPayments(e.id).filter(p => inRange(p.date)).map(p => ({kind:'paid', month:p.month, p}));
  if (pro && !empPayments(e.id, pro.month).length && (inRange(payDueDate(e, pro.month)) || inRange(e.joinDate)))
    rows.push({kind:'due', month:pro.month});   // joining month not recorded yet: never let it get missed
  rows.sort((a, b) => a.month.localeCompare(b.month) || (a.p ? a.p.date : '').localeCompare(b.p ? b.p.date : ''));
  const paid = rows.filter(r => r.p);
  const proCell = m => pro && pro.month === m ? ` <span class="badge b-due">Pro-Rata</span><div class="muted" style="font-size:12px;margin-top:2px">${proText(pro)}${pro.lastDay ? ' · ⚠ joined on the last day of the month' : ''}</div>` : '';
  return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px"><h3 style="margin:0">Salary History · ${periodLabel()}</h3><button class="btn sm" onclick="salaryForm('${e.id}')">+ Record Salary Payment</button></div>
    <div class="muted" style="margin-bottom:10px">${paid.length} payments · total paid <b>${fmt(sum(paid, r => r.p.amount))}</b> · full monthly salary ${fmt(e.salary)}${pro ? ' · joining month is pro-rata' : ''}</div>
    <div class="tablewrap"><table><thead><tr><th>Month</th><th>Date paid</th><th>Method</th><th>Notes</th><th class="num">Amount</th><th></th></tr></thead>
      <tbody>${rows.map(r => r.p ? `<tr><td><b>${monthName(r.month)}</b>${proCell(r.month)}</td><td>${fdate(r.p.date)}</td><td>${esc(r.p.method)}</td><td style="white-space:normal">${esc(r.p.notes)}</td><td class="num"><b>${fmt(r.p.amount)}</b></td><td class="num"><button class="btn sm danger" onclick="delSalary('${r.p.id}')">✕</button></td></tr>`
        : `<tr style="background:#fffbeb"><td><b>${monthName(r.month)}</b>${proCell(r.month)}</td><td colspan="3">${empMonthStatus(e) === 'overdue' && r.month === curMonth() ? '<span class="badge b-overdue">Overdue</span>' : '<span class="badge b-unpaid">Not recorded yet</span>'} · due ${fdate(payDueDate(e, r.month))}</td><td class="num"><b>${fmt(pro.amount)}</b></td><td class="num"><button class="btn sm" onclick="salaryForm('${e.id}','${r.month}')">Record</button></td></tr>`).join('') || '<tr><td colspan="6" class="empty">No salary payments in this period</td></tr>'}</tbody></table></div></div>`;
}
function empLeave(e){
  const list = empLeaves.filter(l => l.employee_id === e.id).sort((a, b) => b.date.localeCompare(a.date));
  return `<div class="card"><h3>Leave & Absence Log</h3>
    <form onsubmit="saveLeave(event,'${e.id}')" class="row2" style="grid-template-columns:150px 140px 1fr auto;align-items:end;margin-bottom:14px;gap:10px">
      <div class="field" style="margin:0"><label>Date</label><input name="date" type="date" value="${today()}" required></div>
      <div class="field" style="margin:0"><label>Type</label><select name="type">${LEAVE_TYPES.map(t => `<option>${t}</option>`).join('')}</select></div>
      <div class="field" style="margin:0"><label>Notes</label><input name="notes"></div><button class="btn">Add</button></form>
    <div class="tablewrap"><table><thead><tr><th>Date</th><th>Type</th><th>Notes</th><th></th></tr></thead>
      <tbody>${list.map(l => `<tr><td>${fdate(l.date)}</td><td><b>${esc(l.type)}</b></td><td style="white-space:normal">${esc(l.notes)}</td><td class="num"><button class="btn sm danger" onclick="delLeave('${l.id}')">✕</button></td></tr>`).join('') || '<tr><td colspan="4" class="empty">No leave recorded</td></tr>'}</tbody></table></div></div>`;
}
function empNotes(e){
  return `<div class="card"><h3>Notes</h3><textarea id="empNotes" rows="9" placeholder="Free-text notes about ${esc(e.name)}…">${esc(e.notes || '')}</textarea>
    <div class="modal-actions"><button class="btn" onclick="saveEmpNotes('${e.id}')">Save notes</button></div></div>`;
}
function saveEmpNotes(id){ const e = empById(id); if (e) { e.notes = $('empNotes').value; save(); toast('Notes saved'); } }
function saveLeave(ev, id){
  ev.preventDefault(); const f = Object.fromEntries(new FormData(ev.target));
  empLeaves.push({id:uid(), employee_id:id, date:f.date, type:f.type, notes:(f.notes || '').trim()}); save(); render(); toast('Leave recorded');
}
function delLeave(id){ if (confirm('Delete this leave entry?')) { empLeaves = empLeaves.filter(l => l.id !== id); save(); render(); } }

/* ----- salary payments → agency expense (category Salaries) ----- */
function salaryForm(id, month){
  const e = empById(id); if (!e) return;
  const m = month || curMonth(), already = empPayments(id, m).length, pro = proInfo(e), isPro = pro && pro.month === m;
  openModal(`<h2>Record Salary · ${esc(e.name)}</h2><form onsubmit="saveSalary(event,'${id}')">
    <div class="hint">Saving marks the month as Paid and adds the amount to Agency Expenses under “Salaries”, reducing Net Profit and Allah's Share.</div>
    <div id="salProHint">${isPro ? proHint(pro) : ''}</div>
    ${already ? `<div class="hint" style="background:#eff6ff;border-color:#bfdbfe;color:#1e40af">A payment is already recorded for ${monthName(m)}. This will be an additional payment.</div>` : ''}
    <div class="row2"><div class="field"><label>Salary month</label><input name="month" type="month" value="${m}" required onchange="salMonthChanged(this,'${id}')"></div>
    <div class="field"><label>Amount Paid (₨)</label><input name="amount" type="number" min="1" step="any" value="${dueAmount(e, m) || ''}" required></div></div>
    <div class="row2"><div class="field"><label>Date Paid</label><input name="date" type="date" value="${today()}" required></div>
    <div class="field"><label>Payment method</label><select name="method">${PAY_METHODS.map(x => `<option ${x === e.payMethod ? 'selected' : ''}>${x}</option>`).join('')}</select></div></div>
    <div class="field"><label>Notes</label><input name="notes" value="${isPro ? 'Pro-rata: ' + pro.days + ' of ' + pro.total + ' days' : ''}" placeholder="e.g. included bonus, deducted 2 days leave"></div>
    <div class="modal-actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn">Save payment</button></div></form>`);
}
const proHint = pro => `<div class="hint" style="background:#fef3c7;border-color:#f4c542;color:#92400e"><span class="badge b-due">Pro-Rata</span> Joining month — ${proText(pro)}${pro.lastDay ? ' · ⚠ joined on the last day of the month (1 day)' : ''}</div>`;
function salMonthChanged(input, id){
  const e = empById(id), form = input.form, pro = proInfo(e), isPro = pro && pro.month === input.value;
  form.amount.value = dueAmount(e, input.value) || '';
  form.notes.value = isPro ? 'Pro-rata: ' + pro.days + ' of ' + pro.total + ' days' : '';
  $('salProHint').innerHTML = isPro ? proHint(pro) : '';
}
/* a salary payment and its Agency Expense (category Salaries) are always created together */
function addSalaryPayment(e, month, amount, date, method, notes){
  const pid = uid(), xid = uid();
  salaryPay.push({id:pid, employee_id:e.id, month, amount, date, method, notes, expense_id:xid});
  expenses.push({id:xid, date, category:'Salaries', description:'Salary – ' + e.name + ' (' + monthName(month) + ')' + (notes ? ' · ' + notes : ''), amount, employee_id:e.id, salary_payment_id:pid});
}
function saveSalary(ev, id){
  ev.preventDefault(); const e = empById(id); const f = Object.fromEntries(new FormData(ev.target));
  if (!e || !(+f.amount > 0)) { alert('Enter the amount paid.'); return; }
  addSalaryPayment(e, f.month, Math.round(+f.amount * 100) / 100, f.date, f.method, (f.notes || '').trim());
  save(); closeModal(); render(); toast('Salary recorded · added to Agency Expenses');
}
function delSalary(pid){
  if (!confirm('Delete this salary payment? Its Agency Expense entry is removed too, and the month becomes Unpaid.')) return;
  const p = salaryPay.find(x => x.id === pid); if (!p) return;
  salaryPay = salaryPay.filter(x => x.id !== pid); expenses = expenses.filter(x => x.id !== p.expense_id && x.salary_payment_id !== pid); save(); render();
}

/* ----- add / edit / archive / delete ----- */
function empPhotoPick(input){
  const file = input.files && input.files[0]; if (!file) return;
  const img = new Image(), rd = new FileReader();
  rd.onload = () => { img.onload = () => {
    const c = document.createElement('canvas'), n = 160, r = Math.min(img.width, img.height); c.width = c.height = n;
    c.getContext('2d').drawImage(img, (img.width - r) / 2, (img.height - r) / 2, r, r, 0, 0, n, n);
    _empPhoto = c.toDataURL('image/jpeg', .8); $('empPhotoPrev').innerHTML = `<img class="av" src="${_empPhoto}" style="width:64px;height:64px">`;
  }; img.src = rd.result; };
  rd.readAsDataURL(file);
}
function empPhotoClear(){ _empPhoto = ''; $('empPhotoPrev').innerHTML = '<span class="av" style="width:64px;height:64px;background:#cbd5e1;font-size:24px">👤</span>'; }
function empForm(id){
  const e = id ? empById(id) : {status:'Active', type:'Full Time', payMethod:'Bank Transfer', salaryType:'Fixed', payDay:1, joinDate:today()};
  _empPhoto = undefined;
  const sel = (name, arr, cur) => `<select name="${name}">${arr.map(x => `<option ${x === cur ? 'selected' : ''}>${x}</option>`).join('')}</select>`;
  const inp = (l, name, type = 'text', extra = '') => `<div class="field"><label>${l}</label><input name="${name}" type="${type}" value="${esc(e[name] ?? '')}" ${extra}></div>`;
  openModal(`<h2>${id ? 'Edit Employee' : 'Add Employee'}</h2><form onsubmit="saveEmp(event,'${id || ''}')">
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px"><span id="empPhotoPrev">${e.name ? avatar(e, 64) : '<span class="av" style="width:64px;height:64px;background:#cbd5e1;font-size:24px">👤</span>'}</span>
      <div><label class="btn sm ghost" style="display:inline-block">Upload photo (optional)<input type="file" accept="image/*" onchange="empPhotoPick(this)" style="display:none"></label>${e.photo ? ' <button type="button" class="btn sm danger" onclick="empPhotoClear()">Remove</button>' : ''}<div class="muted" style="font-size:11px;margin-top:4px">Initials avatar is used when there is no photo.</div></div></div>
    <div class="row2">${inp('Full Name', 'name', 'text', 'required')}${inp('Designation / Role', 'designation', 'text', 'placeholder="e.g. Video Editor"')}</div>
    <div class="row2"><div class="field"><label>Employment Type</label>${sel('type', EMP_TYPES, e.type)}</div><div class="field"><label>Status</label>${sel('status', EMP_STATUS, e.status)}</div></div>
    <div class="row2">${inp('Join Date', 'joinDate', 'date')}${inp('Date of Birth', 'dob', 'date')}</div>
    <h3 style="margin:10px 0">Contact & personal</h3>
    <div class="row2">${inp('Phone Number', 'phone', 'tel')}${inp('Personal Email', 'email', 'email')}</div>
    ${inp('Address', 'address')}
    <div class="row2">${inp('Emergency Contact Name', 'emergencyName')}${inp('Emergency Contact Number', 'emergencyPhone', 'tel')}</div>
    ${inp('CNIC Number (optional)', 'cnic')}
    <h3 style="margin:10px 0">Bank / payment details</h3>
    <div class="row2">${inp('Bank Name', 'bankName')}${inp('Account Title', 'accountTitle')}</div>
    <div class="row2">${inp('Account Number', 'accountNumber')}${inp('IBAN (optional)', 'iban')}</div>
    <div class="field"><label>Payment Method</label>${sel('payMethod', PAY_METHODS, e.payMethod)}</div>
    <h3 style="margin:10px 0">Salary</h3>
    <div class="row2">${inp('Monthly Salary (PKR)', 'salary', 'number', 'min="0" step="any" required')}<div class="field"><label>Salary Type</label>${sel('salaryType', SAL_TYPES, e.salaryType)}</div></div>
    <div class="field"><label>Payment date (day of month)</label><select name="payDay">${Array.from({length:31}, (_, i) => i + 1).map(d => `<option value="${d}" ${d === +e.payDay ? 'selected' : ''}>Every ${ordinal(d)}</option>`).join('')}</select></div>
    <div class="modal-actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn">${id ? 'Save changes' : 'Add employee'}</button></div></form>`, 'xl');
}
function saveEmp(ev, id){
  ev.preventDefault(); let newId = null; const f = Object.fromEntries(new FormData(ev.target));
  const data = {...f, name:f.name.trim(), salary:+f.salary || 0, payDay:+f.payDay || 1};
  if (id) {
    const e = empById(id); if (!e) return; Object.assign(e, data); if (_empPhoto !== undefined) e.photo = _empPhoto;
  } else { const ne = {id:uid(), notes:'', archived:false, photo:_empPhoto || '', ...data}; employees.push(ne); newId = ne.id; }
  save(); closeModal(); render(); toast(id ? 'Employee updated' : 'Employee added');
  if (newId && proInfo(empById(newId))) proRataPrompt(newId);
}
function proRataPrompt(id){
  const e = empById(id), p = e && proInfo(e); if (!p) return;
  const mon = new Date(p.month + '-01T00:00:00').toLocaleDateString('en-US', {month:'long'});
  openModal(`<h2>Pro-rata salary</h2>
    <p style="line-height:1.6;margin-bottom:12px"><b>${esc(e.name)}</b> joined on ${fdate(e.joinDate)}. Their pro-rata salary for ${mon} is <b>${fmt(p.amount)}</b> (${p.days} day${p.days > 1 ? 's' : ''} out of ${p.total}). Would you like to record this now?</p>
    <div class="hint" style="background:#fef3c7;border-color:#f4c542;color:#92400e">(${fmt(e.salary)} ÷ ${p.total}) × ${p.days} = ${fmt(p.amount)}${p.lastDay ? '<br>⚠ Joined on the last day of the month — only 1 day is counted.' : ''}${today() > payDueDate(e, p.month) ? '<br>Their pay date (' + ordinal(e.payDay || 1) + ') has already passed, so this shows as overdue until recorded.' : ''}</div>
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Skip for Now</button><button class="btn" onclick="recordProRata('${id}')">Record This Salary</button></div>`);
}
function recordProRata(id){
  const e = empById(id), p = e && proInfo(e); if (!p) return;
  addSalaryPayment(e, p.month, p.amount, today(), e.payMethod, 'Pro-rata: ' + p.days + ' of ' + p.total + ' days');
  save(); closeModal(); render(); toast('Pro-rata salary recorded · added to Agency Expenses');
}
function archiveEmp(id){ const e = empById(id); if (e) { e.archived = !e.archived; save(); render(); toast(e.archived ? 'Employee archived' : 'Employee restored'); } }
function delEmp(id){
  const e = empById(id); if (!e) return;
  if (!confirm('Permanently delete ' + e.name + ' with their salary history and leave log?\n\nTheir past salary entries stay in Agency Expenses so your profit figures do not change. (Archive instead to keep the profile.)')) return;
  employees = employees.filter(x => x.id !== id); salaryPay = salaryPay.filter(p => p.employee_id !== id); empLeaves = empLeaves.filter(l => l.employee_id !== id);
  save(); empSel = null; render(); toast('Employee deleted');
}

/* ========= Wiring ========= */
/* keep the app name out of the printed page header */
let _title = document.title;
window.addEventListener('beforeprint', () => { _title = document.title; document.title = ' '; });
window.addEventListener('afterprint', () => { document.title = _title; });
$('nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { view = b.dataset.view; if (view === 'employees') { empSel = null; bankShown = false; } $('sidebar').classList.remove('open'); $('scrim').classList.remove('open'); render(); window.scrollTo(0,0); } });
$('menuBtn').onclick = () => { $('sidebar').classList.add('open'); $('scrim').classList.add('open'); };
$('scrim').onclick = () => { $('sidebar').classList.remove('open'); $('scrim').classList.remove('open'); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
init(); render();
</script>
</body>
