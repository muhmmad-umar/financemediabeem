<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Beem — Agency Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --teal:#0f766e; --teal-d:#0b5a54; --navy:#0f2a3d; --side:#0d1f2d;
  --gold:#b8860b; --gold-l:#f6e7b4; --green:#15803d; --green-l:#dcfce7;
  --bg:#f1f5f9; --card:#fff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --red:#dc2626; --amber:#d97706; --blue:#2563eb;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;display:flex;min-height:100vh}
button{font-family:inherit;cursor:pointer}
/* sidebar */
.sidebar{width:240px;background:var(--side);color:#cbd5e1;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;padding:20px 14px;z-index:30;transition:transform .25s}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:17px;padding:4px 8px 22px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--teal),#14b8a6);display:grid;place-items:center;font-size:18px}
.nav button{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;color:#94a3b8;padding:11px 12px;border-radius:9px;font-size:14px;font-weight:500;margin-bottom:3px;text-align:left;transition:.15s}
.nav button:hover{background:#16324a;color:#fff}
.nav button.active{background:var(--teal);color:#fff}
.nav button.allah.active{background:linear-gradient(135deg,#a37507,#d4a017);color:#fff}
.nav button.allah{color:#e6c35c}
/* main */
main{margin-left:240px;flex:1;padding:26px 30px 50px;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:24px;font-weight:700}
.topbar p{color:var(--muted);font-size:13px;margin-top:2px}
.menu-btn{display:none;background:var(--navy);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:18px}
.btn{background:var(--teal);color:#fff;border:0;border-radius:9px;padding:9px 16px;font-weight:600;font-size:13px;transition:.15s}
.btn:hover{background:var(--teal-d);transform:translateY(-1px)}
.btn.gold{background:var(--gold)}.btn.gold:hover{background:#8f6808}
.btn.ghost{background:#fff;color:var(--text);border:1px solid var(--line)}.btn.ghost:hover{background:#f8fafc}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn.danger{background:#fff;color:var(--red);border:1px solid #fecaca}.btn.danger:hover{background:#fef2f2}
/* cards */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.g-main{grid-template-columns:2fr 1fr}
.card{background:var(--card);border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(15,23,42,.06);border:1px solid var(--line);transition:.2s}
.card:hover{box-shadow:0 6px 18px rgba(15,23,42,.08)}
.card h3{font-size:15px;font-weight:600;margin-bottom:14px}
.stat .label{color:var(--muted);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.stat .value{font-size:24px;font-weight:700;margin-top:6px}
.stat .sub{color:var(--muted);font-size:12px;margin-top:4px}
.stat.teal{border-top:4px solid var(--teal)}.stat.navy{border-top:4px solid var(--navy)}.stat.amber{border-top:4px solid var(--amber)}
.allah-card{background:linear-gradient(135deg,#14532d,#166534 55%,#a37507);color:#fff;border:0;position:relative;overflow:hidden}
.allah-card::after{content:"☪";position:absolute;right:-8px;top:-24px;font-size:110px;opacity:.1}
.allah-card .label,.allah-card .sub{color:#e6e9c0}
.allah-card .value{color:#ffe58a}
.bar{height:12px;background:rgba(0,0,0,.18);border-radius:99px;overflow:hidden;margin-top:12px}
.bar>div{height:100%;background:linear-gradient(90deg,#fde68a,#f59e0b);border-radius:99px;transition:width .6s}
.bar.light{background:#e8e4cc}
.bar.light>div{background:linear-gradient(90deg,#16a34a,#b8860b)}
/* invoice cards */
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.inv-card{cursor:pointer}.inv-card:hover{transform:translateY(-2px)}
.inv-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.inv-nums span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.inv-nums b{font-size:14px}
.inv-actions{display:flex;gap:6px;flex-wrap:wrap}
.modal.wide{max-width:860px;padding:14px;background:#e9eef3}
.nav-sep{margin:14px 12px 6px;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#475569}
.nav button.personal{color:#c4b5fd}.nav button.personal:hover{background:#2a2250;color:#fff}
.nav button.personal.active{background:linear-gradient(135deg,#6d28d9,#8b5cf6);color:#fff}
.btn.pv{background:#7c3aed}.btn.pv:hover{background:#6d28d9}
.pbanner{background:linear-gradient(135deg,#ede9fe,#f5f3ff);border:1px solid #c4b5fd;color:#5b21b6;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600;margin-bottom:14px}
.psub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.psub button{border:1px solid #ddd6fe;background:#fff;color:#6d28d9;padding:8px 16px;border-radius:10px;font-size:13px;font-weight:600}
.psub button.on{background:#7c3aed;color:#fff;border-color:#7c3aed}
.ppanel{border-top:5px solid #7c3aed}
.ppanel .trk-row b{font-size:19px}
.catbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px}
.catbar .nm{width:120px;flex:none;font-weight:600}.catbar .tr{flex:1;height:10px;background:#f1f5f9;border-radius:99px;overflow:hidden}
.catbar .tr>div{height:100%;border-radius:99px}.catbar .vl{width:150px;text-align:right;flex:none;white-space:nowrap}
@media(max-width:520px){.catbar{flex-wrap:wrap}.catbar .vl{width:auto;margin-left:auto}}
.nbadge{margin-left:auto;background:#ef4444;color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:1px 8px;box-shadow:0 0 0 3px rgba(239,68,68,.25)}
.rem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.rem-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.rem-card.due{background:#fffbeb;border-color:#f4c542}.rem-card.overdue{background:#fef2f2;border-color:#fca5a5}
.rem-title{font-size:14px;line-height:1.35}
.rem-rows{margin:12px 0}.rem-rows>div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.rem-rows span{color:var(--muted)}
.b-due{background:#fde68a;color:#92400e}.b-upcoming{background:#e0f2fe;color:#075985}
.modal.xl{max-width:760px}
.av{border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;overflow:hidden;flex:none;object-fit:cover}
.emp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.emp-card{cursor:pointer}.emp-card:hover{transform:translateY(-2px)}
.emp-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.emp-meta{display:flex;justify-content:space-between;font-size:13px;margin:6px 0}
.emp-meta span{color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px 20px}
.kv div span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:3px}
.kv div b{font-weight:600;word-break:break-word}
.sec-t{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin:16px 0 10px;grid-column:1/-1}
.b-active{background:#dcfce7;color:#166534}.b-leave{background:#fef3c7;color:#92400e}.b-resigned{background:#e2e8f0;color:#475569}.b-terminated{background:#fee2e2;color:#991b1b}
.profile-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.profile-head .grow{flex:1;min-width:200px}
.brand small{display:block}
.dsec{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:6px 2px 10px}
.qa{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.card.stat[onclick]:hover{transform:translateY(-2px)}
.kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;align-items:start}
.kcol{background:#e9eef4;border-radius:12px;padding:10px;min-height:120px}
.khead{display:flex;justify-content:space-between;align-items:center;margin:2px 4px 10px}
.kcard{background:#fff;border:1px solid var(--line);border-left:4px solid #94a3b8;border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:grab;box-shadow:0 1px 2px rgba(15,23,42,.06);font-size:13px}
.kcard:hover{box-shadow:0 4px 12px rgba(15,23,42,.12)}
.kcard.overdue{background:#fef2f2;border-color:#fca5a5}
.kfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:12px}
.tagchip{display:inline-block;background:#eef2ff;color:#4338ca;font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;margin:0 4px 2px 0}
.qadd{border-style:dashed;background:transparent;font-size:12px;padding:7px 9px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calh{text-align:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;padding:4px}
.cald{min-height:92px;border:1px solid var(--line);border-radius:8px;padding:4px 5px;cursor:pointer;background:#fff;overflow:hidden}
.cald:hover{border-color:var(--teal)}.cald.today{background:#f0fdfa;border-color:var(--teal)}.cald.sel{box-shadow:0 0 0 2px var(--teal)}
.cald.empty-cell{background:transparent;border:0;cursor:default}
.dn{font-size:12px;font-weight:700;color:var(--muted)}.cald.today .dn{color:var(--teal)}
.cchip{color:#fff;font-size:11px;border-radius:5px;padding:1px 6px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
@media(max-width:640px){.cald{min-height:60px}.cchip{font-size:9px;padding:0 3px}}
/* ---- Tasks workspace (ClickUp style) ---- */
main.cu{padding:0}
main.cu .topbar{display:none}
@media(max-width:820px){main.cu .topbar{display:flex;padding:8px 12px;margin:0}}
.cu-wrap{display:flex;min-height:100vh;background:#f7f8fa}
.cu-tree{width:264px;flex:none;background:#1a2332;color:#cbd5e1;height:100vh;position:sticky;top:0;overflow:auto;padding:10px 8px;font-size:13px}
.tr-row{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:7px;cursor:pointer;min-height:30px}
.tr-row:hover{background:#243247}.tr-row.sel{background:#33405a;color:#fff}
.tr-row.top{font-weight:600;color:#e2e8f0}.tr-row.fo{padding-left:20px}.tr-row.li{padding-left:40px}
.tr-row .arr{width:10px;font-size:10px;color:#64748b}.tr-row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr-row .cnt{font-size:11px;color:#64748b}
.tr-row .acts{display:none;gap:2px}.tr-row:hover .acts{display:flex}
.tr-row .acts button,.tr-sec button{background:none;border:0;color:#94a3b8;font-size:14px;padding:0 5px;border-radius:4px;line-height:1.4}
.tr-row .acts button:hover,.tr-sec button:hover{background:#33405a;color:#fff}
.tr-sec{display:flex;justify-content:space-between;align-items:center;margin:16px 8px 4px;font-size:10px;font-weight:700;letter-spacing:.14em;color:#64748b}
.dot{width:10px;height:10px;border-radius:50%;flex:none;cursor:pointer;display:inline-block}
.cu-main{flex:1;min-width:0;padding:16px 22px 90px;transition:margin .25s}
.cu-treebtn{display:none;margin-bottom:10px}
.crumb{font-size:12px;color:var(--muted);margin-bottom:2px}
.cu-title{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}.cu-title h1{font-size:22px}
.cu-bar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px}
.cu-tabs{display:flex;gap:2px}
.cu-tabs button{background:none;border:0;padding:8px 14px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.cu-tabs button.on{color:#7b68ee;border-color:#7b68ee}
.cu-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cu-sel{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}.cu-sel select{width:auto;padding:5px 8px;font-size:12px}
.cu-search{width:170px;padding:6px 10px;font-size:12px}
.cu-fpanel{display:flex;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:12px}
.cu-fpanel select{width:auto;font-size:12px;padding:6px 8px}
.spill{display:inline-block;color:#fff;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 9px;border-radius:5px;white-space:nowrap}
.cu-board{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:12px}
.cu-col{flex:0 0 268px;background:#eceef3;border-radius:10px;padding:8px;min-height:90px;transition:background .15s,box-shadow .15s}
.cu-col.over{background:#dfe3f3;box-shadow:inset 0 0 0 2px #7b68ee}
.chead{display:flex;align-items:center;gap:8px;margin:2px 4px 8px}
.cu-card{background:#fff;border:1px solid #e4e7ee;border-radius:8px;padding:9px 10px;margin-bottom:7px;cursor:grab;font-size:13px;transition:box-shadow .15s,transform .15s}
.cu-card:hover{box-shadow:0 3px 10px rgba(15,23,42,.12)}.cu-card.dragging{opacity:.4;transform:rotate(2deg)}
.cu-card.overdue{background:#fef2f2;border-color:#fca5a5}.cu-card.today{background:#fffbeb;border-color:#f4c542}
.ct{font-weight:600;line-height:1.3}.ctags{margin-top:5px}
.cm{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;flex-wrap:wrap}
.clist{font-size:11px;margin-left:auto}
.cdue{color:var(--muted);font-size:12px}.cdue.od{color:#dc2626;font-weight:700}.cdue.td{color:#b45309;font-weight:700}
.cadd{width:100%;text-align:left;background:none;border:0;color:var(--muted);font-size:12px;padding:7px 6px;border-radius:6px}.cadd:hover{background:#dfe3ec;color:var(--text)}
.cu-table{background:#fff;border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.cu-table table{font-size:13px}
.cu-table th{padding:8px 10px;background:#fafbfc;white-space:nowrap;user-select:none}
.cu-table td{padding:5px 10px;border-bottom:1px solid #f1f3f6}
.ghead td{background:#f7f8fa;padding:7px 10px;border-bottom:1px solid var(--line)}
.trow.overdue td{background:#fef2f2}.trow.today td{background:#fffbeb}
.trow:hover td{background:#f5f6fb}.trow.overdue:hover td{background:#fee2e2}
.tname{min-width:240px}.tname .ttl{cursor:pointer;font-weight:500}.tname .ttl:hover{color:#7b68ee}
.tname .arrow{display:inline-block;width:16px;cursor:pointer;color:var(--muted);font-size:11px}
.tname input{width:90%}
.cell{display:inline-block;min-width:30px;min-height:22px;cursor:pointer;padding:1px 4px;border-radius:5px}.cell:hover{background:#eef0f6}
.cu-table select,.cu-table td input[data-edit]{padding:3px 6px;font-size:12px;width:auto}
.subrow td{background:#fcfcfe;padding:3px 10px}.subrow label{display:flex;gap:8px;align-items:center;margin:0 0 0 38px;color:var(--text);font-weight:400}.subrow input{width:auto}
.addrow td{border-bottom:0}.addrow .qadd{width:100%;border:0;background:transparent;padding:6px 4px}.addrow .qadd:focus{background:#f5f6fb}
.cu-table input[type=checkbox],.cu-panel input[type=checkbox]{width:auto}
.cu-bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#eef2ff;border:1px solid #c7d2fe;border-radius:10px;padding:8px 12px;margin-bottom:10px}
.cu-bulk select{width:auto;font-size:12px;padding:5px 8px}
.cu-cal{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}
.calbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.fab{position:fixed;right:26px;bottom:26px;width:52px;height:52px;border-radius:50%;border:0;background:#7b68ee;color:#fff;font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(123,104,238,.5);z-index:40;transition:right .25s,transform .15s}
.fab:hover{transform:scale(1.08)}
main:not(.cu) .fab{display:none}
.swatches{display:flex;gap:8px;flex-wrap:wrap}.swatches input{display:none}
.swatches span{display:block;width:26px;height:26px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.swatches input:checked+span{border-color:#0f172a}
.strow{display:flex;gap:6px;align-items:center;margin-bottom:8px}.strow input[type=color]{width:38px;height:34px;padding:2px;flex:none}.strow select{width:auto}
/* right-hand task panel */
.cu-panel{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:#fff;box-shadow:-8px 0 30px rgba(15,23,42,.18);transform:translateX(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:45;overflow-y:auto;border-left:1px solid var(--line)}
.cu-panel.open{transform:none}
@media(min-width:1280px){body.cu-panel-open main.cu .cu-main{margin-right:520px}body.cu-panel-open .fab{right:546px}}
.ph{display:flex;gap:8px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.ptitle{font-size:18px;font-weight:700;border-color:transparent;flex:1}.ptitle:hover,.ptitle:focus{border-color:var(--line)}
.pclose{background:#f1f3f7;border:0;border-radius:8px;width:32px;height:32px;font-size:15px}
.pbody{padding:14px 18px 40px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.pf span{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.pf select,.pf input{padding:6px 8px;font-size:13px}
.stsel{color:#fff;font-weight:700;text-transform:uppercase;font-size:12px!important;border:0}
.tagbox{display:flex;flex-wrap:wrap;gap:4px;align-items:center}.tagbox input{width:90px;border:0;padding:3px 4px}
.tagchip a{cursor:pointer;opacity:.6;margin-left:2px}
.psec{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--muted);margin:18px 0 8px}
.logform{display:flex;gap:6px;margin-top:10px}.logform input{padding:6px 8px;font-size:12px}
.loglist{margin-top:8px;font-size:12px}.loglist div{display:flex;gap:10px;padding:3px 0;border-bottom:1px dashed var(--line)}.loglist a{margin-left:auto;cursor:pointer;color:var(--red)}
.rtbar{display:flex;gap:4px;margin-bottom:4px}.rtbar button{background:#f1f3f7;border:0;border-radius:5px;padding:3px 9px;font-size:12px}
.rte{min-height:90px;border:1px solid #cbd5e1;border-radius:8px;padding:9px 11px;font-size:13px;line-height:1.5;outline:none}
.rte:focus{border-color:#7b68ee;box-shadow:0 0 0 2px #e0dcfb}.rte:empty:before{content:attr(data-ph);color:#94a3b8}
.rte ul,.rte ol{margin-left:20px}
.sub{display:flex;justify-content:space-between;align-items:center;padding:4px 0}.sub label{display:flex;gap:8px;align-items:center;margin:0;color:var(--text);font-weight:400;font-size:13px}.sub a{cursor:pointer;color:var(--muted);padding:0 6px}
.cu-panel .qadd{margin-top:6px;width:100%;font-size:13px}
.act{display:flex;gap:10px;padding:8px 0;align-items:flex-start}.act .who{font-size:12px;color:var(--muted)}.act .who b{color:var(--text)}.act .txt{font-size:13px;margin-top:2px;white-space:pre-wrap}
.act.sys .txt{color:var(--muted);font-size:12px}
.cform{display:flex;gap:6px;margin-top:10px}.cform select{width:110px;flex:none}.cform input{flex:1}
@media(max-width:820px){
  .cu-wrap{display:block}.cu-tree{display:none;position:static;width:100%;height:auto;max-height:55vh}.cu-tree.open{display:block}
  .cu-treebtn{display:inline-block}.pgrid{grid-template-columns:1fr}.cu-main{padding:12px 12px 90px}
}
/* date filter bar */

<script>
/* ========= Config & storage ========= */
const ALLAH_RATE = 0.10;
const K = {inc:'income_entries', inv:'invoices', ch:'charity_expenses', exp:'expenses',
  pe:'personal_expenses', pi:'personal_income', pw:'personal_withdrawals', ra:'recurring_alerts', emp:'employees', sp:'salary_payments', el:'employee_leaves',
  cl:'clients', cus:'cu_spaces', cuf:'cu_folders', cul:'cu_lists', cut:'cu_tasks', cusb:'cu_subtasks', cuc:'cu_comments', cutl:'cu_time_logs'};
const load = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } };
const save = () => {
  syncIncome();
  try {
    localStorage.setItem(K.inc, JSON.stringify(income));
    localStorage.setItem(K.inv, JSON.stringify(invoices));
    localStorage.setItem(K.ch, JSON.stringify(charity));
    localStorage.setItem(K.exp, JSON.stringify(expenses));
    localStorage.setItem(K.pe, JSON.stringify(personalExp));
    localStorage.setItem(K.pi, JSON.stringify(personalInc));
    localStorage.setItem(K.pw, JSON.stringify(personalWd));
    localStorage.setItem(K.ra, JSON.stringify(recurring));
    localStorage.setItem(K.emp, JSON.stringify(employees));
    localStorage.setItem(K.sp, JSON.stringify(salaryPay));
    localStorage.setItem(K.el, JSON.stringify(empLeaves));
    localStorage.setItem(K.cl, JSON.stringify(clients));
    localStorage.setItem(K.cus, JSON.stringify(cuSpaces));
    localStorage.setItem(K.cuf, JSON.stringify(cuFolders));
    localStorage.setItem(K.cul, JSON.stringify(cuLists));
    localStorage.setItem(K.cut, JSON.stringify(cuTasks));
    localStorage.setItem(K.cusb, JSON.stringify(cuSubs));
    localStorage.setItem(K.cuc, JSON.stringify(cuComments));
    localStorage.setItem(K.cutl, JSON.stringify(cuTimeLogs));
  } catch(e){ toast('Could not save to localStorage'); }
};
let income, invoices, charity, expenses;
let personalExp = [], personalInc = [], personalWd = [];
let clients = [];
let cuSpaces = [], cuFolders = [], cuLists = [], cuTasks = [], cuSubs = [], cuComments = [], cuTimeLogs = [];   // Tasks: Space › Folder › List › Task › Subtask
let employees = [], salaryPay = [], empLeaves = [];   // Employees section: profiles, salary payments, leave log
let recurring = [];   // recurring invoice reminders: {client_name, frequency_days, last_invoice_date, next_alert_date, active, last_amount}   // Personal Finance: separate world, never used by agency maths

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const today = () => iso(new Date());
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return iso(d); };
const daysAhead = n => daysAgo(-n);
const fmt = n => '₨ ' + Math.round(n || 0).toLocaleString('en-US');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const monthKey = d => d.slice(0,7);
const monthLabel = k => new Date(k + '-01T00:00:00').toLocaleDateString('en-US',{month:'short',year:'numeric'});
const fdate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : '—';
/* Shares are based on NET PROFIT (received income − expenses); never negative for Allah's Share */
const allahOf = net => Math.max(0, net) * ALLAH_RATE;
const mineOf = net => net > 0 ? net * (1 - ALLAH_RATE) : net;

/* ONE source of truth: the invoice.
   invoice = {id, client, service, category, date, expectedBy, notes, total_amount, payments:[{id, amount, date, note}]}
   received_amount = sum of payments (money actually in hand) — ALL calculations use it.
   `income` (localStorage key income_entries) is the ledger view of the invoices, rebuilt on every save. */
const sum = (arr, f) => arr.reduce((t, x) => t + f(x), 0);
const invReceived = i => sum(i.payments || [], p => p.amount);
const invRemaining = i => Math.max(0, i.total_amount - invReceived(i));
const invById = id => invoices.find(x => x.id === id);
function invStatus(i){
  const rec = invReceived(i);
  if (i.total_amount - rec <= 0) return 'paid';
  if (i.expectedBy && today() > i.expectedBy) return 'overdue';
  return rec > 0 ? 'partial' : 'unpaid';
}
const STATUS_LABEL = {unpaid:'Unpaid', partial:'Partially Paid', paid:'Paid in Full', overdue:'Overdue'};
function syncIncome(){
  income = invoices.map(i => {
    const last = (i.payments || []).reduce((m, p) => p.date > m ? p.date : m, '');
    return {id:i.id, invoiceId:i.id, client:i.client, description:i.service, category:i.category || 'Services', date:last || i.date,
            total_amount:i.total_amount, received_amount:invReceived(i)};
  });
}
const incRemaining = e => e.total_amount - e.received_amount;
const incLabel = e => `${fmt(e.total_amount)} total / <b style="color:var(--green)">${fmt(e.received_amount)} received</b>`;
/* every payment actually received, dated when it came in */
const rcv = () => received().filter(e => inRange(e.date));
const expensesIn = () => expenses.filter(e => inRange(e.date));
const cType = c => c.type === 'voluntary' ? 'voluntary' : 'obligated';   // payments without a type are obligated
const charityIn = () => charity.filter(c => inRange(c.date));
const invoicesIn = () => invoices.filter(i => inRange(i.date));
/* ledger rows for the period: invoices that received a payment in range, or were created in range with no payment yet */
const incomeRows = () => income.filter(e => { const i = invById(e.invoiceId); return (i.payments || []).some(p => inRange(p.date)) || (!(i.payments || []).length && inRange(i.date)); });
const received = () => invoices.flatMap(i => (i.payments || []).map(p => ({date:p.date, client:i.client, category:i.category || 'Services', received_amount:p.amount})));

function resetData(){
  if (!confirm('Delete ALL data (income, expenses, invoices, Allah\'s Share payments)? This cannot be undone.')) return;
  invoices = []; charity = []; expenses = []; save(); render(); toast('All data cleared');
}
const DATA_VERSION = '4';
function init(){
  let ver = null; try { ver = localStorage.getItem('data_version'); } catch(e){}
  if (!ver) {   // first run: start completely empty, clearing any pre-loaded data
    income = []; invoices = []; charity = []; expenses = []; personalExp = []; personalInc = []; personalWd = []; recurring = []; employees = []; salaryPay = []; empLeaves = [];
    clients = []; cuSpaces = []; cuFolders = []; cuLists = []; cuTasks = []; cuSubs = []; cuComments = []; cuTimeLogs = [];
    save(); try { localStorage.setItem('cu_migrated', '1'); } catch(e){} try { localStorage.setItem('data_version', DATA_VERSION); } catch(e){}
    return;
  }
  income = load(K.inc); invoices = load(K.inv); charity = load(K.ch); expenses = load(K.exp);
  [income, invoices, charity, expenses] = [income, invoices, charity, expenses].map(a => Array.isArray(a) ? a : []);
  charity.forEach(c => { if (c.type !== 'voluntary') c.type = 'obligated'; });
  [personalExp, personalInc, personalWd] = [load(K.pe), load(K.pi), load(K.pw)].map(a => Array.isArray(a) ? a : []);
  if (ver !== DATA_VERSION) {   // merge the old separate income entries + invoices into single invoice records
    const direct = income.filter(e => !e.invoiceId);
    invoices.forEach(i => {
      if (i.total_amount === undefined) { i.total_amount = i.amount; delete i.amount; }
      if (!i.date) { i.date = i.issued || today(); delete i.issued; }
      delete i.number; delete i.status; delete i.due; delete i.paidDate;
      i.payments = i.payments || []; i.notes = i.notes || ''; i.category = i.category || 'Services';
    });
    direct.forEach(e => {
      const rec = e.received_amount ?? e.amount ?? 0, total = e.total_amount ?? Math.max(e.total || 0, rec);
      invoices.push({id:e.id, client:e.client, service:e.description || e.category || 'Income', category:e.category || 'Services', date:e.date, expectedBy:'', notes:'',
        total_amount:total, payments: rec > 0 ? [{id:uid(), amount:rec, date:e.date, note:''}] : []});
    });
    save(); try { localStorage.setItem('data_version', DATA_VERSION); } catch(e){}
  }
  [employees, salaryPay, empLeaves] = [load(K.emp), load(K.sp), load(K.el)].map(a => Array.isArray(a) ? a : []);
  [clients, cuSpaces, cuFolders, cuLists, cuTasks, cuSubs, cuComments, cuTimeLogs] = [K.cl, K.cus, K.cuf, K.cul, K.cut, K.cusb, K.cuc, K.cutl].map(k => { const a = load(k); return Array.isArray(a) ? a : []; });
  cuMigrateOld();
  const ra = load(K.ra);
  if (Array.isArray(ra)) recurring = ra;
  else { recurring = []; [...invoices].sort((a, b) => a.date.localeCompare(b.date)).forEach(recOnInvoice); save(); }   // first time: build reminders from existing invoices
  syncIncome();
}

/* ========= Date filter (shared by every tab, defaults to This Month) ========= */
let period = {mode:'month', from:'', to:''};
function rangeOf(){
  const n = new Date(), y = n.getFullYear(), m = n.getMonth();
  switch (period.mode) {
    case 'today': return {from:today(), to:today()};
    case 'week': { const dow = (n.getDay() + 6) % 7, a = new Date(y, m, n.getDate() - dow), b = new Date(y, m, n.getDate() - dow + 6); return {from:iso(a), to:iso(b)}; }
    case 'month': return {from:iso(new Date(y, m, 1)), to:iso(new Date(y, m + 1, 0))};

const REC_DAYS = [15, 30, 45, 60, 90];
const ckey = n => String(n).trim().toLowerCase();

const recFind = name => recurring.find(r => ckey(r.client_name) === ckey(name));

const recDue = () => recurring.filter(r => r.active && r.next_alert_date <= today());
/* every new invoice (re)schedules that client's next reminder: issue date + frequency, so an existing alert clears automatically */
function recOnInvoice(inv){
  let r = recFind(inv.client);
  if (!r) { r = {client_name:inv.client.trim(), frequency_days:30, last_invoice_date:'', next_alert_date:'', active:true, last_amount:0}; recurring.push(r); }
  if (!r.last_invoice_date || inv.date >= r.last_invoice_date) {
    r.client_name = inv.client.trim(); r.last_invoice_date = inv.date; r.last_amount = inv.total_amount;
    r.next_alert_date = addDays(inv.date, r.frequency_days);
  }
}
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5);

function editAlert(enc){
  const r = recFind(decodeURIComponent(enc)); if (!r) return;

    <div class="field"><label>Frequency</label><select name="frequency_days">${REC_DAYS.map(d => `<option value="${d}" ${d === r.frequency_days ? 'selected' : ''}>Every ${d} days</option>`).join('')}</select></div>

function saveAlert(e, enc){
  e.preventDefault(); const r = recFind(decodeURIComponent(enc)); if (!r) return; const f = Object.fromEntries(new FormData(e.target));

}

/* ========= Derived values ========= */
function totals(){
  const rec = rcv(), invs = invoicesIn();
  const totalIn = sum(rec, e => e.received_amount), totalExp = sum(expensesIn(), e => e.amount);
  const net = totalIn - totalExp;
  const allahTotal = allahOf(net), chIn = charityIn();
  const given = sum(chIn.filter(c => cType(c) === 'obligated'), c => c.amount);   // only obligated payments reduce what is owed
  const voluntary = sum(chIn.filter(c => cType(c) === 'voluntary'), c => c.amount);
  const netAll = sum(received(), e => e.received_amount) - sum(expenses, e => e.amount);
  return {
    invoiced: sum(invs, i => i.total_amount),
    outstanding: sum(invs, invRemaining),
    overdueAmt: sum(invs.filter(i => invStatus(i) === 'overdue'), invRemaining),
    totalIn, totalExp, net,
    mine: mineOf(net), allahTotal, given, voluntary, totalGiven: given + voluntary, remaining: allahTotal - given,
    allRemaining: allahOf(netAll) - sum(charity.filter(c => cType(c) === 'obligated'), c => c.amount),
    pct: allahTotal > 0 ? Math.min(100, given / allahTotal * 100) : 0
  };
}

/* chart buckets: by day for ranges up to ~2 months, otherwise by month */
function addDays(d, n){ const x = new Date(d + 'T00:00:00'); x.setDate(x.getDate() + n); return iso(x); }
function chartBuckets(){
  const rec = rcv(), ex = expensesIn();
  const dates = [...rec.map(e => e.date), ...ex.map(e => e.date)].sort();
  if (!dates.length) return {labels:[], inc:[], exp:[]};
  const r = rangeOf(), lo = r ? r.from : dates[0];
  const hi = r ? (r.to > today() ? (dates[dates.length-1] > today() ? dates[dates.length-1] : today()) : r.to) : dates[dates.length-1];
  const daily = (new Date(hi) - new Date(lo)) / 864e5 <= 62;
  const keys = [];
  if (daily) for (let d = lo; d <= hi; d = addDays(d, 1)) keys.push(d);
  else { let [y, m] = [+lo.slice(0,4), +lo.slice(5,7)]; while (y + '-' + String(m).padStart(2,'0') <= monthKey(hi)) { keys.push(y + '-' + String(m).padStart(2,'0')); if (++m > 12) { m = 1; y++; } } }
  const k = d => daily ? d : monthKey(d);
  return {labels:keys.map(x => daily ? new Date(x + 'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}) : monthLabel(x)),
    inc:keys.map(x => sum(rec.filter(e => k(e.date) === x), e => e.received_amount)),
    exp:keys.map(x => sum(ex.filter(e => k(e.date) === x), e => e.amount))};
}
function afterDashboard(){
  const b = chartBuckets();
  chart('cDash', {type:'bar', data:{labels:b.labels, datasets:[
    {label:'Received', data:b.inc, backgroundColor:'#0f766e', borderRadius:5},
    {label:'Expenses', data:b.exp, backgroundColor:'#94a3b8', borderRadius:5}
  ]}, options:{...chartOpts, scales:{x:{grid:{display:false}}, y:{ticks:{callback:axisFmt}}}}});
}

  const i = invById(id); if (!i) return;
  const doc = `<!DOCTYPE html><html><head><meta charset="utf-8"><title> </title><style>${$('invCss').textContent}
    body{margin:0;padding:24px;background:#e5e7eb}.inv-sheet{max-width:820px;margin:auto}@media print{body{background:#fff;padding:0.5in}.inv-sheet{border:0;border-radius:0;padding:0}}</style></head><body>${invoiceHTML(i)}</body></html>`;
  const filename = 'MEDIA-BEEM-Invoice-' + i.client.replace(/[^a-z0-9]+/gi, '-') + '.html';
  try {
    // inside claude.ai the viewer mediates downloads; opened as a plain file, fall back to a normal download
    const dl = window.claude ? await window.claude.use('downloads') : null;
    if (dl) { await dl.save({filename, data:doc}); toast('Invoice saved'); return; }
  } catch(e){ if (e && e.code === 'declined') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([doc], {type:'text/html'})); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

  if (!(total > 0) || !(rec >= 0)) { alert('Enter a valid Total Amount and Amount Received.'); return; }
  if (rec > total) { alert('Amount Received cannot be more than Total Amount.'); return; }
  Object.assign(i, {client:f.client.trim(), service:f.service.trim(), date:f.date, category:f.category, expectedBy:f.expectedBy || '', notes:f.notes.trim(), total_amount:total});
  const diff = rec - invReceived(i);
  if (diff > 0) addPayment(i, diff, today(), 'Added via edit');
  else if (diff < 0) {   // remove the difference from the most recent payments
    let cutBy = -diff;
    for (let k = i.payments.length - 1; k >= 0 && cutBy > 0; k--) {
      const p = i.payments[k];
      if (p.amount <= cutBy) { cutBy -= p.amount; i.payments.splice(k, 1); } else { p.amount -= cutBy; cutBy = 0; }
    }
  }
  save(); closeModal(); render(); toast('Invoice updated · totals recalculated');
}

const LEAVE_TYPES = ['Sick','Annual','Unpaid','WFH'];
let empSel = null, empTab = 'overview', bankShown = false, _empPhoto;
const ef = {q:'', f:'all'};
const empById = id => employees.find(e => e.id === id);
const curMonth = () => today().slice(0, 7);
const monthName = m => new Date(m + '-01T00:00:00').toLocaleDateString('en-US', {month:'long', year:'numeric'});
const onPayroll = e => !e.archived && (e.status === 'Active' || e.status === 'On Leave');
const empPayments = (id, m) => salaryPay.filter(p => p.employee_id === id && (!m || p.month === m));
/* Pro-rata for the joining month: (salary ÷ days in month) × days worked, rounded to the nearest rupee. Joining on the 1st = full salary. */
const monthDays = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo, 0).getDate(); };
function proInfo(e){
  if (!e.joinDate) return null;
  const m = e.joinDate.slice(0, 7), day = +e.joinDate.slice(8, 10);
  if (day <= 1) return null;
  const total = monthDays(m), days = total - day + 1;
  return {month:m, days, total, amount:Math.round((+e.salary || 0) / total * days), lastDay: day === total};
}
const dueAmount = (e, m) => { const p = proInfo(e); return p && p.month === m ? p.amount : (+e.salary || 0); };
const proText = p => `${p.days} day${p.days > 1 ? 's' : ''} of ${p.total} — ${fmt(p.amount)}`;
function payDueDate(e, m){ const [y, mo] = m.split('-').map(Number), last = new Date(y, mo, 0).getDate(); return m + '-' + String(Math.min(+e.payDay || 1, last)).padStart(2, '0'); }
/* paid = a salary payment has been recorded for this month; overdue = past this month's pay date and still unpaid */
function empMonthStatus(e){
  const m = curMonth();
  if (empPayments(e.id, m).length) return 'paid';
  if (!onPayroll(e) || (e.joinDate && e.joinDate.slice(0, 7) > m)) return 'na';
  return today() > payDueDate(e, m) ? 'overdue' : 'unpaid';
}
const payBadge = st => ({paid:'<span class="badge b-paid">Paid</span>', overdue:'<span class="badge b-overdue">Overdue</span>', unpaid:'<span class="badge b-unpaid">Unpaid</span>', na:'<span class="muted">—</span>'}[st]);
const stBadge = st => `<span class="badge b-${({'Active':'active','On Leave':'leave','Resigned':'resigned','Terminated':'terminated'})[st] || 'resigned'}">${esc(st)}</span>`;
function avatar(e, size = 44){
  if (e.photo) return `<img class="av" src="${e.photo}" alt="" style="width:${size}px;height:${size}px">`;
  const ini = e.name.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase(), hue = [...e.name].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 0);
  return `<span class="av" style="width:${size}px;height:${size}px;font-size:${size * .38}px;background:hsl(${hue} 45% 42%)">${esc(ini)}</span>`;
}
function empStats(){
  const pay = employees.filter(onPayroll), m = curMonth();
  return {active: employees.filter(e => !e.archived && e.status === 'Active').length, bill: sum(pay, e => +e.salary || 0),
    paid: sum(salaryPay.filter(p => p.month === m), p => p.amount),
    pending: sum(pay.filter(e => ['unpaid', 'overdue'].includes(empMonthStatus(e))), e => dueAmount(e, m))};
}
const maskNum = v => !v ? '—' : v.length <= 4 ? '••••' : '•'.repeat(Math.min(12, v.length - 4)) + v.slice(-4);

      ${['unpaid', 'overdue'].includes(ms) ? `<div class="inv-actions" style="margin-top:10px"><button class="btn sm" onclick="event.stopPropagation();salaryForm('${e.id}')">Mark Paid</button></div>` : ''}

}

function salaryForm(id, month){

    <div class="field"><label>Payment method</label><select name="method">${PAY_METHODS.map(x => `<option ${x === e.payMethod ? 'selected' : ''}>${x}</option>`).join('')}</select></div></div>

    <div class="modal-actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn">Save payment</button></div></form>`);
}
const proHint = pro => `<div class="hint" style="background:#fef3c7;border-color:#f4c542;color:#92400e"><span class="badge b-due">Pro-Rata</span> Joining month — ${proText(pro)}${pro.lastDay ? ' · ⚠ joined on the last day of the month (1 day)' : ''}</div>`;
function salMonthChanged(input, id){
  const e = empById(id), form = input.form, pro = proInfo(e), isPro = pro && pro.month === input.value;
  form.amount.value = dueAmount(e, input.value) || '';
  form.notes.value = isPro ? 'Pro-rata: ' + pro.days + ' of ' + pro.total + ' days' : '';
  $('salProHint').innerHTML = isPro ? proHint(pro) : '';

/* a salary payment and its Agency Expense (category Salaries) are always created together */
function addSalaryPayment(e, month, amount, date, method, notes){
  const pid = uid(), xid = uid();
  salaryPay.push({id:pid, employee_id:e.id, month, amount, date, method, notes, expense_id:xid});
  expenses.push({id:xid, date, category:'Salaries', description:'Salary – ' + e.name + ' (' + monthName(month) + ')' + (notes ? ' · ' + notes : ''), amount, employee_id:e.id, salary_payment_id:pid});
}
function saveSalary(ev, id){

function weekRange(){ const n = new Date(), dow = (n.getDay() + 6) % 7; return {from:iso(new Date(n.getFullYear(), n.getMonth(), n.getDate() - dow)), to:iso(new Date(n.getFullYear(), n.getMonth(), n.getDate() - dow + 6))}; }
function listProgress(l){

/* light sanitiser for the rich-text description */
function cleanHtml(html){
  const doc = new DOMParser().parseFromString('<body>' + html + '</body>', 'text/html'), ok = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'UL', 'OL', 'LI', 'BR', 'P', 'DIV', 'H3']);
  const walk = n => [...n.childNodes].map(c => c.nodeType === 3 ? esc(c.textContent) : c.nodeType === 1 ? (ok.has(c.tagName) ? `<${c.tagName.toLowerCase()}>${walk(c)}</${c.tagName.toLowerCase()}>` : walk(c)) : '').join('');

/* ----- scope, filters, sorting, grouping ----- */
const scopeLists = () => cuScope.type === 'list' ? [listById(cuScope.id)].filter(Boolean) : cuLists;
const scopeTasks = () => cuScope.type === 'list' ? cuTasks.filter(t => t.listId === cuScope.id) : cuScope.type === 'mine' ? cuTasks.filter(t => (t.assignee || '') === cuPerson) : cuTasks;
function cuFiltered(){
  const q = cf.q.toLowerCase(), wk = weekRange();
  return scopeTasks().filter(t => {
    if (cf.assignee === '__none' ? t.assignee : (cf.assignee && t.assignee !== cf.assignee)) return false;
    if (cf.priority && t.priority !== cf.priority) return false;
    if (cf.status === 'open' ? !isOpenT(t) : (cf.status && statusOf(t).name.toLowerCase() !== cf.status.toLowerCase())) return false;
    if (cf.tag && !(t.tags || []).includes(cf.tag)) return false;
    if (cf.due === 'today' && t.due !== today()) return false;
    if (cf.due === 'overdue' && !isOverdueT(t)) return false;
    if (cf.due === 'week' && !(t.due && t.due >= wk.from && t.due <= wk.to)) return false;
    if (cf.due === 'none' && t.due) return false;
    return !q || (t.title + ' ' + (t.description || '').replace(/<[^>]+>/g, ' ') + ' ' + (t.tags || []).join(' ')).toLowerCase().includes(q);
  });
}
function cuSorter(){
  const v = {due:t => t.due || '9999', priority:t => PRI[t.priority].o, created:t => t.created, title:t => t.title.toLowerCase(), status:t => statusOf(t).name.toLowerCase(), assignee:t => empName(t.assignee).toLowerCase() || '~', est:t => t.estimate || 0}[cuSortKey];
  return (a, b) => { const x = v(a), y = v(b); return (x < y ? -1 : x > y ? 1 : 0) * cuSortDir; };
}
function statusUnion(){ const seen = new Map(); scopeLists().forEach(l => l.statuses.forEach(s => { if (!seen.has(s.name.toLowerCase())) seen.set(s.name.toLowerCase(), s); })); return [...seen.values()]; }
function setStatusByName(t, name){ const s = listOf(t).statuses.find(x => x.name.toLowerCase() === name.toLowerCase()); if (!s) { toast('“' + name + '” is not a status in ' + listOf(t).name); return false; } cuSetStatus(t, s.id, true); return true; }
function groupDefs(){
  if (cuGroup === 'assignee') return [...employees.filter(e => !e.archived).map(e => ({key:'a' + e.id, label:e.name, color:'hsl(' + hueOf(e.name) + ' 45% 42%)', match:t => t.assignee === e.id, set:t => { t.assignee = e.id; return true; }})), {key:'a', label:'Unassigned', color:'#94a3b8', match:t => !t.assignee, set:t => { t.assignee = ''; return true; }}];
  if (cuGroup === 'priority') return Object.entries(PRI).map(([k, p]) => ({key:'p' + k, label:p.i + ' ' + p.l, color:p.c, match:t => t.priority === k, set:t => { t.priority = k; return true; }}));
  if (cuGroup === 'due') { const wk = weekRange(), td = today();
    return [['Overdue', '#ef4444', t => isOverdueT(t)], ['Earlier', '#94a3b8', t => !!t.due && t.due < td && !isOverdueT(t)], ['Today', '#f59e0b', t => t.due === td], ['This week', '#3b82f6', t => !!t.due && t.due > td && t.due <= wk.to], ['Later', '#64748b', t => !!t.due && t.due > wk.to], ['No date', '#94a3b8', t => !t.due]]
      .map(([label, color, match]) => ({key:'d' + label, label, color, match, set:null})); }
  return statusUnion().map(s => ({key:'s' + s.name.toLowerCase(), label:s.name, color:s.color, kind:s.kind, match:t => statusOf(t).name.toLowerCase() === s.name.toLowerCase(), set:t => setStatusByName(t, s.name)}));
}

function cuDelNode(kind, id){

function stMove(btn, d){ const row = btn.parentNode; if (d < 0 && row.previousElementSibling) row.parentNode.insertBefore(row, row.previousElementSibling); if (d > 0 && row.nextElementSibling) row.parentNode.insertBefore(row.nextElementSibling, row); }
function cuSaveStatuses(ev, lid){

function cuAddInline(gi, listId, input){

function nextDue(t){
  const base = t.due || today();
  if (t.repeat === 'daily') return addDays(base, 1);
  if (t.repeat === 'weekly') return addDays(base, 7);
  if (t.repeat === 'custom') return addDays(base, Math.max(1, +t.repeatDays || 1));
  const d = new Date(base + 'T00:00:00'), day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + 1); d.setDate(Math.min(day, monthDays(iso(d).slice(0, 7)))); return iso(d);
}
function cuSpawn(t){
  const l = listOf(t), n = cuNewTask({...t, id:uid(), status:l.statuses.find(s => s.kind === 'open').id, due:nextDue(t), spawned:false, created:new Date().toISOString(), activityText:'Recurring task created'});
  cuSubs.filter(s => s.taskId === t.id).forEach(s => cuSubs.push({id:uid(), taskId:n.id, title:s.title, done:false}));
  t.spawned = true; toast('Repeating task — next one created for ' + fdate(n.due));
}
function cuSetStatus(t, sid, noRender){
  const old = statusOf(t), l = listOf(t), s = l.statuses.find(x => x.id === sid); if (!s || s.id === t.status) return;
  t.status = sid; cuComments.push({id:uid(), taskId:t.id, at:new Date().toISOString(), by:'You', text:'Status: ' + old.name + ' → ' + s.name, kind:'activity'});
  if (s.kind === 'done' && t.repeat && !t.spawned) cuSpawn(t);
  save(); if (!noRender) render();
}
function cuSetField(id, field, val){
  const t = taskById(id); if (!t) return;
  if (field === 'status') { cuSetStatus(t, val); return; }
  if (field === 'tags') val = Array.isArray(val) ? val : parseTags(val);
  if (field === 'estimate') val = Math.max(0, +val || 0);
  if (field === 'title') { val = val.trim(); if (!val) return; }
  if (field === 'listId') { const l = listById(val), old = statusOf(t); t.status = (l.statuses.find(s => s.name.toLowerCase() === old.name.toLowerCase()) || l.statuses[0]).id; }
  t[field] = val; save(); render();
}
function cuMove(id, gi){
  const t = taskById(id), g = groupDefs()[gi]; if (!t || !g) return;
  if (!g.set) { toast('Cannot drop into a due-date group — change the date instead'); return; }
  if (g.match(t)) return; if (g.set(t)) { save(); render(); }
}
function cuDelTask(id){ const t = taskById(id); if (t && confirm('Delete "' + t.title + '" with its subtasks, comments and time logs?')) { cuRemoveTaskData(t); save(); render(); } }

/* ----- BOARD ----- */
function cuCardCls(t){ return isOverdueT(t) ? 'overdue' : isTodayT(t) ? 'today' : ''; }
function cuCard(t){
  const subs = cuSubs.filter(s => s.taskId === t.id), done = subs.filter(s => s.done).length, p = PRI[t.priority];
  return `<div class="cu-card ${cuCardCls(t)}" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${t.id}');this.classList.add('dragging')" ondragend="this.classList.remove('dragging')" onclick="cuOpen('${t.id}')">
    <div class="ct">${esc(t.title)}</div>${(t.tags || []).length ? `<div class="ctags">${t.tags.map(x => `<span class="tagchip">${esc(x)}</span>`).join('')}</div>` : ''}
    <div class="cm">${assigneeDot(t.assignee)}<span title="${p.l}">${p.i}</span>${t.due ? `<span class="cdue ${isOverdueT(t) ? 'od' : isTodayT(t) ? 'td' : ''}">📅 ${fdate(t.due)}</span>` : ''}${subs.length ? `<span class="muted">☑ ${done}/${subs.length}</span>` : ''}${t.repeat ? '<span title="Repeats">🔁</span>' : ''}${cuScope.type !== 'list' ? `<span class="muted clist">${esc((listOf(t) || {}).name)}</span>` : ''}</div></div>`;
}
function cuBoard(list){
  const groups = groupDefs();
  return `<div class="cu-board">${groups.map((g, gi) => { const col = list.filter(g.match).sort(cuSorter()), adding = cuAddCol === gi;
    return `<div class="cu-col" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="event.preventDefault();this.classList.remove('over');cuMove(event.dataTransfer.getData('text/plain'),${gi})">
      <div class="chead"><span class="spill" style="background:${g.color}">${esc(g.label)}</span><span class="muted">${col.length}</span></div>
      ${col.map(cuCard).join('')}
      ${adding ? `<input class="qadd" id="cuAddIn" placeholder="Task name — Enter to add" onkeydown="if(event.key==='Enter')cuAddInline(${gi},null,this);if(event.key==='Escape'){cuAddCol=null;render()}">` : `<button class="cadd" onclick="cuAddCol=${gi};render()">+ Add Task</button>`}</div>`; }).join('')}</div>`;
}

/* ----- LIST VIEW ----- */
function cuSortBy(k){ if (cuSortKey === k) cuSortDir = -cuSortDir; else { cuSortKey = k; cuSortDir = 1; } render(); }
const cuEditStart = (id, f) => { cuEdit = {id, f}; render(); };
const cuEditEnd = () => { if (cuEdit) { cuEdit = null; render(); } };
function cuCell(t, f){
  const ed = cuEdit && cuEdit.id === t.id && cuEdit.f === f, id = t.id, st = statusOf(t);
  const commit = (v) => `cuEdit=null;cuSetField('${id}','${f}',${v})`;
  if (f === 'assignee') return ed ? `<select data-edit onchange="${commit('this.value')}" onblur="cuEditEnd()">${empOpts(t.assignee)}</select>` : `<span class="cell" onclick="cuEditStart('${id}','assignee')"><span style="display:flex;gap:6px;align-items:center">${assigneeDot(t.assignee)}<span>${esc(empName(t.assignee))}</span></span></span>`;
  if (f === 'due') return ed ? `<input data-edit type="date" value="${t.due || ''}" onchange="${commit('this.value')}" onblur="cuEditEnd()">` : `<span class="cell cdue ${isOverdueT(t) ? 'od' : isTodayT(t) ? 'td' : ''}" onclick="cuEditStart('${id}','due')">${t.due ? fdate(t.due) : '<span class="muted">—</span>'}</span>`;
  if (f === 'priority') return ed ? `<select data-edit onchange="${commit('this.value')}" onblur="cuEditEnd()">${Object.entries(PRI).map(([k, p]) => `<option value="${k}" ${k === t.priority ? 'selected' : ''}>${p.i} ${p.l}</option>`).join('')}</select>` : `<span class="cell" onclick="cuEditStart('${id}','priority')">${PRI[t.priority].i} <span class="muted">${PRI[t.priority].l}</span></span>`;
  if (f === 'status') return ed ? `<select data-edit onchange="${commit('this.value')}" onblur="cuEditEnd()">${listOf(t).statuses.map(s => `<option value="${s.id}" ${s.id === t.status ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select>` : `<span class="cell" onclick="cuEditStart('${id}','status')">${statusPill(st)}</span>`;
  if (f === 'tags') return ed ? `<input data-edit value="${esc((t.tags || []).join(', '))}" placeholder="tag, tag" onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape'){cuEdit=null;render()}" onblur="cuEdit=null;cuSetField('${id}','tags',this.value)">` : `<span class="cell" onclick="cuEditStart('${id}','tags')">${(t.tags || []).map(x => `<span class="tagchip">${esc(x)}</span>`).join('') || '<span class="muted">—</span>'}</span>`;
  if (f === 'estimate') return ed ? `<input data-edit type="number" min="0" step="any" value="${t.estimate || ''}" style="width:70px" onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape'){cuEdit=null;render()}" onblur="cuEdit=null;cuSetField('${id}','estimate',this.value)">` : `<span class="cell" onclick="cuEditStart('${id}','estimate')">${t.estimate ? t.estimate + 'h' : '<span class="muted">—</span>'}</span>`;
}
function cuListView(list){
  const groups = groupDefs(), th = (k, l) => `<th style="cursor:pointer" onclick="cuSortBy('${k}')">${l}${cuSortKey === k ? (cuSortDir > 0 ? ' ▲' : ' ▼') : ''}</th>`;
  const n = [...cuSel].filter(taskById).length;
  const bulk = n ? `<div class="cu-bulk"><b>${n} selected</b><select onchange="cuBulk('status',this.value)"><option value="">Status…</option>${statusUnion().map(s => `<option>${esc(s.name)}</option>`).join('')}</select>
    <select onchange="cuBulk('priority',this.value)"><option value="">Priority…</option>${Object.entries(PRI).map(([k, p]) => `<option value="${k}">${p.i} ${p.l}</option>`).join('')}</select>
    <select onchange="cuBulk('assignee',this.value)"><option value="">Assign to…</option>${employees.map(e => `<option value="${e.id}">${esc(e.name)}</option>`).join('')}<option value="__none">Unassigned</option></select>
    <button class="btn sm danger" onclick="cuBulkDel()">Delete</button><button class="btn sm ghost" onclick="cuSel.clear();render()">Clear</button></div>` : '';
  const taskRows = t => { const subs = cuSubs.filter(s => s.taskId === t.id), open = cuExpanded.has(t.id), done = subs.filter(s => s.done).length;
    return `<tr class="trow ${cuCardCls(t)}"><td><input type="checkbox" ${cuSel.has(t.id) ? 'checked' : ''} onchange="cuSelT('${t.id}',this.checked)"></td>
      <td class="tname"><span class="arrow" style="visibility:${subs.length ? 'visible' : 'hidden'}" onclick="cuToggleSub('${t.id}')">${open ? '▾' : '▸'}</span>${cuEdit && cuEdit.id === t.id && cuEdit.f === 'title' ? `<input data-edit value="${esc(t.title)}" onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape'){cuEdit=null;render()}" onblur="cuEdit=null;cuSetField('${t.id}','title',this.value)">` : `<span class="ttl" onclick="cuOpen('${t.id}')" ondblclick="cuEditStart('${t.id}','title')" title="Click to open · double-click to rename">${esc(t.title)}</span>`}${subs.length ? `<span class="muted" style="font-size:11px;margin-left:6px">☑ ${done}/${subs.length}</span>` : ''}${t.repeat ? ' 🔁' : ''}${cuScope.type !== 'list' ? `<span class="muted clist">${esc((listOf(t) || {}).name)}</span>` : ''}</td>
      <td>${cuCell(t, 'assignee')}</td><td>${cuCell(t, 'due')}</td><td>${cuCell(t, 'priority')}</td><td>${cuCell(t, 'status')}</td><td>${cuCell(t, 'tags')}</td><td>${cuCell(t, 'estimate')}</td></tr>
      ${open ? subs.map(s => `<tr class="subrow"><td></td><td colspan="7"><label><input type="checkbox" ${s.done ? 'checked' : ''} onchange="cuToggleSubtask('${s.id}')"><span style="${s.done ? 'text-decoration:line-through;color:var(--muted)' : ''}">${esc(s.title)}</span></label></td></tr>`).join('') : ''}`; };
  return `${bulk}<div class="cu-table"><table><thead><tr><th style="width:28px"><input type="checkbox" onchange="cuSelAll(this.checked)"></th>${th('title', 'Task Name')}${th('assignee', 'Assignee')}${th('due', 'Due Date')}${th('priority', 'Priority')}${th('status', 'Status')}<th>Tags</th>${th('est', 'Time Estimate')}</tr></thead>
    ${groups.map((g, gi) => { const rows = list.filter(g.match).sort(cuSorter());
      return `<tbody><tr class="ghead"><td colspan="8"><span class="spill" style="background:${g.color}">${esc(g.label)}</span> <span class="muted">${rows.length}</span></td></tr>${rows.map(taskRows).join('')}
        <tr class="addrow"><td></td><td colspan="7"><input class="qadd" placeholder="+ Add task" onkeydown="if(event.key==='Enter')cuAddInline(${gi},null,this)"></td></tr></tbody>`; }).join('')}</table></div>`;
}
const cuToggleSub = id => { cuExpanded.has(id) ? cuExpanded.delete(id) : cuExpanded.add(id); render(); };
const cuSelT = (id, on) => { on ? cuSel.add(id) : cuSel.delete(id); render(); };
const cuSelAll = on => { cuFiltered().forEach(t => on ? cuSel.add(t.id) : cuSel.delete(t.id)); render(); };
function cuBulk(field, v){ if (!v) return; [...cuSel].map(taskById).filter(Boolean).forEach(t => { if (field === 'status') setStatusByName(t, v); else t[field] = v === '__none' ? '' : v; }); save(); render(); toast('Updated ' + cuSel.size + ' tasks'); }
function cuBulkDel(){ if (confirm('Delete ' + cuSel.size + ' selected tasks?')) { [...cuSel].map(taskById).filter(Boolean).forEach(cuRemoveTaskData); cuSel.clear(); save(); render(); } }
function cuToggleSubtask(sid){ const s = cuSubs.find(x => x.id === sid); if (s) { s.done = !s.done; save(); render(); } }

/* ----- CALENDAR ----- */
function cuNav(d){ if (d === 0) cuMonth = today().slice(0, 7); else { const [y, m] = cuMonth.split('-').map(Number); cuMonth = iso(new Date(y, m - 1 + d, 1)).slice(0, 7); } render(); }
function cuCalendar(list){
  const [y, mo] = cuMonth.split('-').map(Number), lead = (new Date(y, mo - 1, 1).getDay() + 6) % 7, days = monthDays(cuMonth), by = {};
  list.filter(t => t.due && t.due.startsWith(cuMonth)).forEach(t => (by[t.due] = by[t.due] || []).push(t));
  const cells = [...Array(lead).fill(null), ...Array.from({length:days}, (_, i) => cuMonth + '-' + String(i + 1).padStart(2, '0'))];
  return `<div class="cu-cal"><div class="calbar"><button class="btn sm ghost" onclick="cuNav(-1)">‹</button><b>${monthName(cuMonth)}</b><span><button class="btn sm ghost" onclick="cuNav(0)">Today</button> <button class="btn sm ghost" onclick="cuNav(1)">›</button></span></div>
    <div class="cal">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => `<div class="calh">${d}</div>`).join('')}
    ${cells.map(d => !d ? '<div class="cald empty-cell"></div>' : `<div class="cald ${d === today() ? 'today' : ''}" onclick="cuQuickAdd({due:'${d}'})" title="Click to add a task on this date"><span class="dn">${+d.slice(8)}</span>
      ${(by[d] || []).slice(0, 4).map(t => `<div class="cchip" style="background:${PRI[t.priority].c}${isOpenT(t) ? '' : ';opacity:.45;text-decoration:line-through'}" onclick="event.stopPropagation();cuOpen('${t.id}')" title="${esc(t.title)}">${esc(t.title)}</div>`).join('')}${(by[d] || []).length > 4 ? `<div class="muted" style="font-size:10px">+${by[d].length - 4} more</div>` : ''}</div>`).join('')}</div>
    <div class="muted" style="margin-top:8px;font-size:12px">${Object.values(PRI).map(p => `<span style="margin-right:12px"><span style="display:inline-block;width:9px;height:9px;border-radius:3px;background:${p.c}"></span> ${p.l}</span>`).join('')}· click a date to add a task, a pill to open it</div></div>`;
}

/* ----- TASK DETAIL PANEL (slides in from the right) ----- */
function cuOpen(id){ cuPanelId = id; cuLogOpen = false; cuRenderPanel(); $('cuPanel').classList.add('open'); document.body.classList.add('cu-panel-open'); }
function cuClose(){ cuPanelId = null; const p = $('cuPanel'); if (p) p.classList.remove('open'); document.body.classList.remove('cu-panel-open'); }
function cuRefreshPanel(){ if (!cuPanelId) return; const p = $('cuPanel'), sc = p.scrollTop; cuRenderPanel(); p.scrollTop = sc; }
function cuRenderPanel(){
  const t = taskById(cuPanelId), p = $('cuPanel'); if (!t) { cuClose(); return; }
  const l = listOf(t), st = statusOf(t), subs = cuSubs.filter(s => s.taskId === t.id), done = subs.filter(s => s.done).length;
  const cms = cuComments.filter(c => c.taskId === t.id).sort((a, b) => a.at.localeCompare(b.at)), logs = cuTimeLogs.filter(x => x.taskId === t.id).sort((a, b) => b.date.localeCompare(a.date));
  const fld = (label, inner) => `<div class="pf"><span>${label}</span>${inner}</div>`, id = t.id;
  p.innerHTML = `<div class="ph"><input class="ptitle" value="${esc(t.title)}" onchange="cuSetField('${id}','title',this.value)"><button class="pclose" onclick="cuClose()" title="Close">✕</button></div>
    <div class="pbody">
    <div class="pgrid">
      ${fld('Status', `<select class="stsel" style="background:${st.color}" onchange="cuSetField('${id}','status',this.value)">${l.statuses.map(s => `<option value="${s.id}" ${s.id === t.status ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select>`)}
      ${fld('Priority', `<select onchange="cuSetField('${id}','priority',this.value)">${Object.entries(PRI).map(([k, pr]) => `<option value="${k}" ${k === t.priority ? 'selected' : ''}>${pr.i} ${pr.l}</option>`).join('')}</select>`)}
      ${fld('Assignee', `<div style="display:flex;gap:6px;align-items:center">${assigneeDot(t.assignee, 24)}<select onchange="cuSetField('${id}','assignee',this.value)">${empOpts(t.assignee)}</select></div>`)}
      ${fld('Due Date', `<input type="date" value="${t.due || ''}" onchange="cuSetField('${id}','due',this.value)">`)}
      ${fld('List', `<select onchange="cuSetField('${id}','listId',this.value)">${cuLists.map(x => `<option value="${x.id}" ${x.id === t.listId ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>`)}
      ${fld('Tags', `<div class="tagbox">${(t.tags || []).map(x => `<span class="tagchip">${esc(x)} <a onclick="cuDelTag('${id}',${(t.tags || []).indexOf(x)})">×</a></span>`).join('')}<input placeholder="+ Add tag" onkeydown="if(event.key==='Enter'){event.preventDefault();cuSetField('${id}','tags',[...(taskById('${id}').tags||[]),...parseTags(this.value)])}"></div>`)}
      ${fld('Time Est', `<div style="display:flex;align-items:center;gap:6px"><input type="number" min="0" step="any" value="${t.estimate || 0}" style="width:80px" onchange="cuSetField('${id}','estimate',this.value)"> h</div>`)}
      ${fld('Time Log', `<div style="display:flex;align-items:center;gap:8px"><b>${+hoursOf(id).toFixed(2)}h logged</b><button class="btn sm ghost" onclick="cuLogOpen=!cuLogOpen;cuRefreshPanel()">+ Log time</button></div>`)}
      ${fld('Repeat', `<div style="display:flex;gap:6px"><select onchange="cuSetField('${id}','repeat',this.value)">${[['', 'Does not repeat'], ['daily', 'Daily'], ['weekly', 'Weekly'], ['monthly', 'Monthly'], ['custom', 'Custom']].map(([v, n]) => `<option value="${v}" ${v === (t.repeat || '') ? 'selected' : ''}>${n}</option>`).join('')}</select>${t.repeat === 'custom' ? `<input type="number" min="1" value="${t.repeatDays || 7}" style="width:64px" title="every N days" onchange="cuSetField('${id}','repeatDays',+this.value||1)">` : ''}</div>`)}
    </div>
    ${cuLogOpen ? `<form class="logform" onsubmit="cuAddLog(event,'${id}')"><input name="hours" type="number" min="0.1" step="any" placeholder="Hours" required style="width:90px"><input name="date" type="date" value="${today()}"><input name="note" placeholder="Note (optional)" style="flex:1"><button class="btn sm">Add</button></form>` : ''}
    ${logs.length ? `<div class="loglist">${logs.map(x => `<div><span>${fdate(x.date)}</span><b>${x.hours}h</b><span class="muted">${esc(x.note || '')} ${x.by ? '· ' + esc(x.by) : ''}</span><a onclick="cuDelLog('${x.id}')">✕</a></div>`).join('')}</div>` : ''}
    <div class="psec">DESCRIPTION</div>
    <div class="rtbar">${[['bold', '<b>B</b>'], ['italic', '<i>I</i>'], ['underline', '<u>U</u>'], ['insertUnorderedList', '• List'], ['insertOrderedList', '1. List']].map(([c, n]) => `<button type="button" onmousedown="event.preventDefault();document.execCommand('${c}')">${n}</button>`).join('')}</div>
    <div class="rte" contenteditable="true" data-ph="Write details here…" onblur="cuSaveDesc('${id}',this)">${t.description || ''}</div>
    <div class="psec">SUBTASKS <span class="muted" style="font-weight:400;letter-spacing:0">${subs.length ? done + '/' + subs.length : ''}</span></div>
    ${subs.map(s => `<div class="sub"><label><input type="checkbox" ${s.done ? 'checked' : ''} onchange="cuPanelSub('${s.id}')"><span style="${s.done ? 'text-decoration:line-through;color:var(--muted)' : ''}">${esc(s.title)}</span></label><a onclick="cuDelSub('${s.id}')">✕</a></div>`).join('')}
    <input class="qadd" placeholder="+ Add subtask" onkeydown="if(event.key==='Enter'){event.preventDefault();cuAddSub('${id}',this)}">
    <div class="psec">ACTIVITY / COMMENTS</div>
    ${cms.map(c => `<div class="act ${c.kind === 'activity' ? 'sys' : ''}">${miniAv(c.by, 24)}<div><div class="who"><b>${esc(c.by)}</b> — ${fmtShort(c.at)}</div><div class="txt">${c.kind === 'activity' ? esc(c.text) : '“' + esc(c.text) + '”'}</div></div></div>`).join('')}
    <form onsubmit="cuPost(event,'${id}')" class="cform"><select name="by">${['You', ...employees.filter(e => !e.archived).map(e => e.name)].map(a => `<option ${a === cuAuthor ? 'selected' : ''}>${esc(a)}</option>`).join('')}</select><input name="text" placeholder="Add a comment…" required><button class="btn sm">Post</button></form>
    <div style="margin-top:18px"><button class="btn sm danger" onclick="cuDelTask('${id}')">Delete task</button></div></div>`;
}
function cuDelTag(id, i){ const t = taskById(id); if (t) cuSetField(id, 'tags', t.tags.filter((_, k) => k !== i)); }
function cuSaveDesc(id, el){ const t = taskById(id); if (!t) return; const h = cleanHtml(el.innerHTML); if (h !== (t.description || '')) { t.description = h; save(); } }
function cuAddSub(id, input){ const v = input.value.trim(); if (!v) return; cuSubs.push({id:uid(), taskId:id, title:v, done:false}); cuExpanded.add(id); save(); render(); }
function cuPanelSub(sid){ const s = cuSubs.find(x => x.id === sid); if (s) { s.done = !s.done; save(); render(); } }
function cuDelSub(sid){ cuSubs = cuSubs.filter(x => x.id !== sid); save(); render(); }
function cuPost(ev, id){ ev.preventDefault(); const f = Object.fromEntries(new FormData(ev.target)); if (!f.text.trim()) return; cuAuthor = f.by; cuComments.push({id:uid(), taskId:id, at:new Date().toISOString(), by:f.by, text:f.text.trim(), kind:'comment'}); save(); render(); }
function cuAddLog(ev, id){ ev.preventDefault(); const f = Object.fromEntries(new FormData(ev.target)); cuTimeLogs.push({id:uid(), taskId:id, hours:+f.hours, date:f.date, note:(f.note || '').trim(), by:cuAuthor}); cuLogOpen = false; save(); render(); }
function cuDelLog(lid){ cuTimeLogs = cuTimeLogs.filter(x => x.id !== lid); save(); render(); }

function cuJump(id){ const t = taskById(id); if (!t) return; view = 'tasks'; cuScope = {type:'list', id:t.listId}; Object.keys(cf).forEach(k => cf[k] = ''); render(); cuOpen(id); }

/* ========= Wiring ========= */
/* keep the app name out of the printed page header */
let _title = document.title;
window.addEventListener('beforeprint', () => { _title = document.title; document.title = ' '; });
window.addEventListener('afterprint', () => { document.title = _title; });
$('nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { view = b.dataset.view; if (view === 'employees') { empSel = null; bankShown = false; } if (view === 'clients') clSel = null;  $('sidebar').classList.remove('open'); $('scrim').classList.remove('open'); render(); window.scrollTo(0,0); } });
$('menuBtn').onclick = () => { $('sidebar').classList.add('open'); $('scrim').classList.add('open'); };
$('scrim').onclick = () => { $('sidebar').classList.remove('open'); $('scrim').classList.remove('open'); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
init(); render();
</script>
