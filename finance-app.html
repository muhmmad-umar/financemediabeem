<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agency Finance Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --teal:#0f766e; --teal-d:#0b5a54; --navy:#0f2a3d; --side:#0d1f2d;
  --gold:#b8860b; --gold-l:#f6e7b4; --green:#15803d; --green-l:#dcfce7;
  --bg:#f1f5f9; --card:#fff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --red:#dc2626; --amber:#d97706; --blue:#2563eb;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;display:flex;min-height:100vh}
button{font-family:inherit;cursor:pointer}
/* sidebar */
.sidebar{width:240px;background:var(--side);color:#cbd5e1;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;padding:20px 14px;z-index:30;transition:transform .25s}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:17px;padding:4px 8px 22px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--teal),#14b8a6);display:grid;place-items:center;font-size:18px}
.nav button{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;color:#94a3b8;padding:11px 12px;border-radius:9px;font-size:14px;font-weight:500;margin-bottom:3px;text-align:left;transition:.15s}
.nav button:hover{background:#16324a;color:#fff}
.nav button.active{background:var(--teal);color:#fff}
.nav button.allah.active{background:linear-gradient(135deg,#a37507,#d4a017);color:#fff}
.nav button.allah{color:#e6c35c}
.side-foot{margin-top:auto;font-size:12px;padding:12px;background:#10293b;border-radius:10px;color:#e6c35c;line-height:1.5}
.side-foot button{margin-top:8px;background:none;border:1px solid #2b4760;color:#94a3b8;border-radius:6px;padding:4px 8px;font-size:11px}
/* main */
main{margin-left:240px;flex:1;padding:26px 30px 50px;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:24px;font-weight:700}
.topbar p{color:var(--muted);font-size:13px;margin-top:2px}
.menu-btn{display:none;background:var(--navy);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:18px}
.btn{background:var(--teal);color:#fff;border:0;border-radius:9px;padding:9px 16px;font-weight:600;font-size:13px;transition:.15s}
.btn:hover{background:var(--teal-d);transform:translateY(-1px)}
.btn.gold{background:var(--gold)}.btn.gold:hover{background:#8f6808}
.btn.ghost{background:#fff;color:var(--text);border:1px solid var(--line)}.btn.ghost:hover{background:#f8fafc}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn.danger{background:#fff;color:var(--red);border:1px solid #fecaca}.btn.danger:hover{background:#fef2f2}
/* cards */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.g-main{grid-template-columns:2fr 1fr}
.card{background:var(--card);border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(15,23,42,.06);border:1px solid var(--line);transition:.2s}
.card:hover{box-shadow:0 6px 18px rgba(15,23,42,.08)}
.card h3{font-size:15px;font-weight:600;margin-bottom:14px}
.stat .label{color:var(--muted);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.stat .value{font-size:24px;font-weight:700;margin-top:6px}
.stat .sub{color:var(--muted);font-size:12px;margin-top:4px}
.stat.teal{border-top:4px solid var(--teal)}.stat.navy{border-top:4px solid var(--navy)}.stat.amber{border-top:4px solid var(--amber)}
.allah-card{background:linear-gradient(135deg,#14532d,#166534 55%,#a37507);color:#fff;border:0;position:relative;overflow:hidden}
.allah-card::after{content:"☪";position:absolute;right:-8px;top:-24px;font-size:110px;opacity:.1}
.allah-card .label,.allah-card .sub{color:#e6e9c0}
.allah-card .value{color:#ffe58a}
.bar{height:12px;background:rgba(0,0,0,.18);border-radius:99px;overflow:hidden;margin-top:12px}
.bar>div{height:100%;background:linear-gradient(90deg,#fde68a,#f59e0b);border-radius:99px;transition:width .6s}
.bar.light{background:#e8e4cc}
.bar.light>div{background:linear-gradient(90deg,#16a34a,#b8860b)}
/* formula */
.flow{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap}
.fbox{flex:1;min-width:130px;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fbox span{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.fbox b{font-size:19px;display:block;margin-top:4px}
.fbox.net{background:#ecfeff;border-color:#99f6e4}.fbox.mine{background:#f0fdfa}
.fbox.allah{background:linear-gradient(135deg,#fefce8,#dcfce7);border-color:#d4a017}.fbox.allah b{color:#8f6808}
.fop{align-self:center;font-size:22px;font-weight:700;color:var(--muted)}
/* table */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr:hover td{background:#f8fafc}
td.num,th.num{text-align:right;white-space:nowrap}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600}
.b-received,.b-paid{background:#dcfce7;color:#166534}
.b-pending,.b-sent{background:#fef3c7;color:#92400e}
.b-draft{background:#e2e8f0;color:#475569}
.b-overdue{background:#fee2e2;color:#991b1b}
.gold-txt{color:var(--gold);font-weight:600}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:28px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
input,select,textarea{font-family:inherit;font-size:13px;padding:9px 11px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:var(--text);width:100%}
.filters input,.filters select{width:auto;min-width:140px;flex:1}
input:focus,select:focus,textarea:focus{outline:2px solid #5eead4;border-color:var(--teal)}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:480px;max-height:92vh;overflow:auto;animation:pop .2s}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:none;opacity:1}}
.modal h2{font-size:18px;margin-bottom:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{background:#fefce8;border:1px solid var(--gold-l);color:#854d0e;border-radius:8px;padding:8px 10px;font-size:12px;margin-bottom:12px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.chart-box{position:relative;height:280px}
.tx{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f1f5f9;gap:10px}
.tx:last-child{border:0}
.tx .t1{font-weight:600}.tx .t2{font-size:12px;color:var(--muted)}
.tx .amt{font-weight:700;text-align:right;white-space:nowrap}
.tx .amt small{display:block;font-weight:500;color:var(--gold);font-size:11px}
.toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;z-index:99;opacity:0;transform:translateY(10px);transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.scrim{display:none}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g-main{grid-template-columns:1fr}}
@media(max-width:820px){
  .sidebar{transform:translateX(-100%)}.sidebar.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}
  main{margin-left:0;padding:16px 14px 40px}.menu-btn{display:block}
  .g3,.g2{grid-template-columns:1fr}.stat .value{font-size:21px}.topbar h1{font-size:20px}
}
@media(max-width:520px){.g4{grid-template-columns:1fr}.row2{grid-template-columns:1fr}}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="logo">₨</div>Agency Finance</div>
  <nav class="nav" id="nav">
    <button data-view="dashboard">📊 Dashboard</button>
    <button data-view="income">💰 Income / Cash Flow</button>
    <button data-view="expenses">💸 Expenses</button>
    <button data-view="invoices">🧾 Invoices</button>
    <button data-view="allah" class="allah">🤲 Allah's Share</button>
    <button data-view="reports">📈 Reports</button>
  </nav>
  <div class="side-foot">
    <div id="sideAllah"></div>
    <button onclick="resetData()">Reset to sample data</button>
  </div>
</aside>
<div class="scrim" id="scrim"></div>

<main>
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div><h1 id="title"></h1><p id="subtitle"></p></div>
    </div>
    <div id="topActions"></div>
  </div>
  <div id="view"></div>
</main>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ========= Config & storage ========= */
const ALLAH_RATE = 0.10;
const K = {inc:'income_entries', inv:'invoices', ch:'charity_expenses', exp:'expenses'};
const load = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } };
const save = () => {
  try {
    localStorage.setItem(K.inc, JSON.stringify(income));
    localStorage.setItem(K.inv, JSON.stringify(invoices));
    localStorage.setItem(K.ch, JSON.stringify(charity));
    localStorage.setItem(K.exp, JSON.stringify(expenses));
  } catch(e){ toast('Could not save to localStorage'); }
};
let income, invoices, charity, expenses;

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const today = () => new Date().toISOString().slice(0,10);
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return d.toISOString().slice(0,10); };
const daysAhead = n => daysAgo(-n);
const fmt = n => '₨ ' + Math.round(n || 0).toLocaleString('en-US');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const monthKey = d => d.slice(0,7);
const monthLabel = k => new Date(k + '-01T00:00:00').toLocaleDateString('en-US',{month:'short',year:'numeric'});
const fdate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : '—';
/* Shares are based on NET PROFIT (received income − expenses); never negative for charity */
const allahOf = net => Math.max(0, net) * ALLAH_RATE;
const mineOf = net => net > 0 ? net * (1 - ALLAH_RATE) : net;

function mkIncome(o){ return {id:uid(), status:'received', description:'', category:'Services', ...o}; }
function seedExpenses(){
  const rows = [[170,'Salaries','Team salaries – Apr',120000],[165,'Software','Adobe & hosting subscriptions',25000],[140,'Salaries','Team salaries – May',120000],
    [135,'Office','Co-working rent',30000],[110,'Salaries','Team salaries – Jun',120000],[105,'Advertising','Ad spend for client campaigns',45000],
    [80,'Salaries','Team salaries – Jul',130000],[75,'Software','Adobe & hosting subscriptions',25000],[50,'Salaries','Team salaries – Aug',130000],
    [45,'Office','Co-working rent',30000],[22,'Salaries','Team salaries – Sep',130000],[12,'Advertising','Ad spend for client campaigns',60000],[5,'Utilities','Internet & electricity',18000]];
  return rows.map(r => ({id:uid(), date:daysAgo(r[0]), category:r[1], description:r[2], amount:r[3]}));
}

function seed(){
  income = []; invoices = []; charity = []; expenses = seedExpenses();
  const clients = ['Nexa Traders','BlueOrbit Tech','Karachi Eats','Lahore Fashion Hub','Zenith Real Estate','Alpha Logistics'];
  const rows = [
    [175,185000,0,'Social media management','Retainer'],[160,95000,1,'Brand identity design','Design'],
    [148,240000,2,'Website development','Development'],[130,120000,3,'Meta ads campaign','Marketing'],
    [118,160000,4,'Monthly retainer','Retainer'],[100,210000,5,'E-commerce store build','Development'],
    [88,125000,0,'Social media management','Retainer'],[72,80000,1,'Logo & packaging','Design'],
    [60,175000,2,'SEO package','Marketing'],[45,150000,4,'Monthly retainer','Retainer'],
    [33,300000,5,'Web portal development','Development'],[20,135000,0,'Social media management','Retainer'],
    [9,110000,3,'Video ad production','Marketing'],[4,90000,1,'Landing page design','Design']
  ];
  rows.forEach(r => income.push(mkIncome({amount:r[1], client:clients[r[2]], date:daysAgo(r[0]), description:r[3], category:r[4]})));
  income.push(mkIncome({amount:140000, client:'Zenith Real Estate', date:daysAgo(2), description:'Pending milestone payment', category:'Development', status:'pending'}));
  const inv = [
    ['INV-001','Nexa Traders','Social media management – Oct',130000,daysAgo(35),daysAgo(5),'sent'],
    ['INV-002','Alpha Logistics','Dashboard maintenance',85000,daysAgo(10),daysAhead(12),'sent'],
    ['INV-003','BlueOrbit Tech','App UI redesign',220000,daysAgo(3),daysAhead(20),'sent'],
    ['INV-004','Karachi Eats','Menu photography & ads',60000,daysAgo(1),daysAhead(14),'draft'],
  ];
  inv.forEach(i => invoices.push({id:uid(), number:i[0], client:i[1], service:i[2], amount:i[3], issued:i[4], due:i[5], status:i[6]}));
  const paid = {id:uid(), number:'INV-000', client:'Lahore Fashion Hub', service:'Campaign shoot', amount:100000, issued:daysAgo(30), due:daysAgo(15), status:'paid', paidDate:daysAgo(14)};
  invoices.push(paid);
  income.push(mkIncome({amount:paid.amount, client:paid.client, date:paid.paidDate, description:'Invoice ' + paid.number + ' – ' + paid.service, category:'Marketing', invoiceId:paid.id}));
  charity = [
    {id:uid(), amount:100000, cause:'Orphan care fund', date:daysAgo(120), notes:'Monthly sponsorship'},
    {id:uid(), amount:75000, cause:'Clean water well', date:daysAgo(80), notes:'Village project'},
    {id:uid(), amount:50000, cause:'Ramadan food packs', date:daysAgo(40), notes:'Distributed to 25 families'},
  ];
  save();
}
function init(){
  income = load(K.inc); invoices = load(K.inv); charity = load(K.ch); expenses = load(K.exp);
  if (!Array.isArray(income) || !Array.isArray(invoices) || !Array.isArray(charity)) seed();
  else if (!Array.isArray(expenses)) { expenses = seedExpenses(); save(); }
}
function resetData(){ if (confirm('Replace all data with sample data?')) { seed(); render(); toast('Sample data restored'); } }

/* ========= Derived values ========= */
const received = () => income.filter(e => e.status === 'received');
const sum = (arr, f) => arr.reduce((t, x) => t + f(x), 0);
const invStatus = i => (i.status === 'sent' && i.due < today()) ? 'overdue' : i.status;
function totals(){
  const rec = received(), cm = monthKey(today());
  const totalIn = sum(rec, e => e.amount), totalExp = sum(expenses, e => e.amount);
  const monthIn = sum(rec.filter(e => monthKey(e.date) === cm), e => e.amount);
  const monthExp = sum(expenses.filter(e => monthKey(e.date) === cm), e => e.amount);
  const net = totalIn - totalExp;
  const allahTotal = allahOf(net), given = sum(charity, c => c.amount);
  return {
    totalIn, totalExp, net, monthIn, monthExp, monthNet: monthIn - monthExp,
    mine: mineOf(net), allahTotal, given, remaining: allahTotal - given,
    pct: allahTotal > 0 ? Math.min(100, given / allahTotal * 100) : 0,
    outstanding: sum(invoices.filter(i => ['sent','overdue'].includes(invStatus(i))), i => i.amount),
    pending: sum(income.filter(e => e.status === 'pending'), e => e.amount)
  };
}

/* ========= UI helpers ========= */
const $ = id => document.getElementById(id);
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2400); }
function openModal(html){ $('modal').innerHTML = html; $('overlay').classList.add('open'); }
function closeModal(){ $('overlay').classList.remove('open'); }
$('overlay').addEventListener('mousedown', e => { if (e.target.id === 'overlay') closeModal(); });
const badge = s => `<span class="badge b-${s}">${s[0].toUpperCase() + s.slice(1)}</span>`;
const charts = [];
function chart(id, cfg){ const el = $(id); if (!el || typeof Chart === 'undefined') return; charts.push(new Chart(el, cfg)); }
function destroyCharts(){ while (charts.length) charts.pop().destroy(); }
const chartOpts = {responsive:true, maintainAspectRatio:false, plugins:{legend:{labels:{font:{family:'Inter'}}}}};
const axisFmt = v => v >= 1e6 ? (v/1e6) + 'M' : v >= 1e3 ? (v/1e3) + 'k' : v;

/* ========= Views ========= */
let view = 'dashboard';
const meta = {
  dashboard:['Dashboard','Overview of your agency finances'],
  income:['Income / Cash Flow','Received income, before expenses'],
  expenses:['Expenses','Business costs — deducted before the 90% / 10% split'],
  invoices:['Invoices','Create, send and track client invoices'],
  allah:["Allah's Share Tracker",'10% of net profit (income − expenses) — set aside for charity (sadaqah)'],
  reports:['Reports','Monthly breakdown, cumulative charity and top clients'],
};

function render(){
  destroyCharts();
  const t = totals();
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  $('title').textContent = meta[view][0]; $('subtitle').textContent = meta[view][1];
  $('topActions').innerHTML = {
    dashboard:'<button class="btn" onclick="incomeForm()">+ Add Income</button>',
    income:'<button class="btn" onclick="incomeForm()">+ Add Income</button>',
    expenses:'<button class="btn" onclick="expenseForm()">+ Add Expense</button>',
    invoices:'<button class="btn" onclick="invoiceForm()">+ New Invoice</button>',
    allah:'<button class="btn gold" onclick="charityForm()">+ Record Giving</button>',
    reports:''
  }[view];
  $('sideAllah').innerHTML = `🤲 <b>Allah's share</b><br>Set aside (10% of net): ${fmt(t.allahTotal)}<br>Remaining: ${fmt(t.remaining)}`;
  $('view').innerHTML = {dashboard:vDashboard, income:vIncome, expenses:vExpenses, invoices:vInvoices, allah:vAllah, reports:vReports}[view](t);
  ({dashboard:afterDashboard, reports:afterReports, allah:afterAllah}[view] || (()=>{}))(t);
}

function vDashboard(t){
  const recent = [...income].sort((a,b) => b.date.localeCompare(a.date)).slice(0,6);
  const neg = t.net <= 0;
  return `
  <div class="card formula" style="margin-bottom:16px">
    <h3>How your money is split</h3>
    <div class="flow">
      <div class="fbox"><span>Income received</span><b>${fmt(t.totalIn)}</b></div><div class="fop">−</div>
      <div class="fbox"><span>Expenses</span><b>${fmt(t.totalExp)}</b></div><div class="fop">=</div>
      <div class="fbox net"><span>Net Profit</span><b>${fmt(t.net)}</b></div><div class="fop">→</div>
      <div class="fbox mine"><span>My Share (90%)</span><b>${fmt(t.mine)}</b></div><div class="fop">+</div>
      <div class="fbox allah"><span>🤲 Allah's Share (10%)</span><b>${fmt(t.allahTotal)}</b></div>
    </div>
    ${neg ? '<div class="hint" style="margin:12px 0 0">Net profit is zero or negative, so nothing is owed to Allah\'s share right now.</div>' : ''}
  </div>
  <div class="grid g4" style="margin-bottom:16px">
    <div class="card stat teal"><div class="label">Total Income (All Time)</div><div class="value">${fmt(t.totalIn)}</div><div class="sub">Received payments only</div></div>
    <div class="card stat navy"><div class="label">This Month</div><div class="value">${fmt(t.monthIn)}</div><div class="sub">Expenses ${fmt(t.monthExp)} · Net ${fmt(t.monthNet)}</div></div>
    <div class="card stat teal"><div class="label">My Share (90% of net)</div><div class="value">${fmt(t.mine)}</div><div class="sub">After expenses &amp; charity</div></div>
    <div class="card stat amber"><div class="label">Outstanding Invoices</div><div class="value">${fmt(t.outstanding)}</div><div class="sub">Pending income: ${fmt(t.pending)}</div></div>
  </div>
  <div class="card allah-card" style="margin-bottom:16px">
    <div class="grid g3" style="gap:20px">
      <div><div class="label">🤲 Allah's Share (10% of net) — Set Aside</div><div class="value" style="font-size:30px">${fmt(t.allahTotal)}</div></div>
      <div><div class="label">Given So Far</div><div class="value" style="font-size:30px">${fmt(t.given)}</div></div>
      <div><div class="label">Still To Give</div><div class="value" style="font-size:30px">${fmt(t.remaining)}</div></div>
    </div>
    <div class="bar"><div style="width:${t.pct}%"></div></div>
    <div class="sub" style="margin-top:8px">${t.pct.toFixed(1)}% of what is owed has been given in Allah's way</div>
  </div>
  <div class="grid g-main">
    <div class="card"><h3>Income vs Expenses – Last 6 Months</h3><div class="chart-box"><canvas id="cDash"></canvas></div></div>
    <div class="card"><h3>Recent Transactions</h3>${recent.map(e => `
      <div class="tx"><div><div class="t1">${esc(e.client)}</div><div class="t2">${fdate(e.date)} · ${badge(e.status)}</div></div>
      <div class="amt">${fmt(e.amount)}</div></div>`).join('') || '<div class="empty">No transactions</div>'}
    </div>
  </div>`;
}
function lastMonths(n){
  const out = [], d = new Date(); d.setDate(1);
  for (let i = n - 1; i >= 0; i--) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); out.push(x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0')); }
  return out;
}
function afterDashboard(){
  const ms = lastMonths(6), rec = received();
  chart('cDash', {type:'bar', data:{labels:ms.map(monthLabel), datasets:[
    {label:'Income', data:ms.map(m => sum(rec.filter(e => monthKey(e.date) === m), e => e.amount)), backgroundColor:'#0f766e', borderRadius:5},
    {label:'Expenses', data:ms.map(m => sum(expenses.filter(e => monthKey(e.date) === m), e => e.amount)), backgroundColor:'#94a3b8', borderRadius:5}
  ]}, options:{...chartOpts, scales:{x:{grid:{display:false}}, y:{ticks:{callback:axisFmt}}}}});
}

/* ----- Income ----- */
const fi = {month:'', client:'', category:'', status:''};
function vIncome(t){
  const months = [...new Set(income.map(e => monthKey(e.date)))].sort().reverse();
  const clients = [...new Set(income.map(e => e.client))].sort();
  const cats = [...new Set(income.map(e => e.category))].sort();
  const list = income.filter(e => (!fi.month || monthKey(e.date) === fi.month) && (!fi.client || e.client === fi.client) && (!fi.category || e.category === fi.category) && (!fi.status || e.status === fi.status))
    .sort((a,b) => b.date.localeCompare(a.date));
  const opt = (arr, cur, f = x => x) => arr.map(x => `<option value="${esc(x)}" ${cur === x ? 'selected' : ''}>${esc(f(x))}</option>`).join('');
  const tot = sum(list.filter(e => e.status === 'received'), e => e.amount);
  return `
  <div class="card">
    <div class="filters">
      <select onchange="fi.month=this.value;render()"><option value="">All months</option>${opt(months, fi.month, monthLabel)}</select>
      <select onchange="fi.client=this.value;render()"><option value="">All clients</option>${opt(clients, fi.client)}</select>
      <select onchange="fi.category=this.value;render()"><option value="">All categories</option>${opt(cats, fi.category)}</select>
      <select onchange="fi.status=this.value;render()"><option value="">Any status</option>${opt(['received','pending'], fi.status)}</select>
    </div>
    <div class="muted" style="margin-bottom:10px">Showing ${list.length} entries · Received total <b>${fmt(tot)}</b></div>
    <div class="tablewrap"><table>
      <thead><tr><th>Date</th><th>Client</th><th>Description</th><th>Category</th><th>Status</th><th class="num">Amount</th><th></th></tr></thead>
      <tbody>${list.map(e => `<tr>
        <td>${fdate(e.date)}</td><td><b>${esc(e.client)}</b></td><td>${esc(e.description)}</td><td>${esc(e.category)}</td>
        <td>${badge(e.status)}</td><td class="num"><b>${fmt(e.amount)}</b></td>
        <td class="num">${e.status === 'pending' ? `<button class="btn sm" onclick="markReceived('${e.id}')">Mark received</button> ` : ''}${e.invoiceId ? '<span class="muted">via invoice</span>' : `<button class="btn sm danger" onclick="delIncome('${e.id}')">✕</button>`}</td>
      </tr>`).join('') || '<tr><td colspan="7" class="empty">No entries match</td></tr>'}</tbody>
    </table></div>
  </div>`;
}
function incomeForm(){
  openModal(`<h2>Add Income</h2><form onsubmit="saveIncome(event)">
    <div class="row2"><div class="field"><label>Amount (₨)</label><input name="amount" type="number" min="1" step="any" required></div>
    <div class="field"><label>Date</label><input name="date" type="date" value="${today()}" required></div></div>
    <div class="hint">Allah's 10% is taken from <b>net profit</b> (income − expenses), not from this amount alone.</div>
    <div class="field"><label>Client / Source</label><input name="client" required></div>
    <div class="row2"><div class="field"><label>Category</label><select name="category">${['Services','Retainer','Design','Development','Marketing','Consulting','Other'].map(c => `<option>${c}</option>`).join('')}</select></div>
    <div class="field"><label>Status</label><select name="status"><option value="received">Received</option><option value="pending">Pending</option></select></div></div>
    <div class="field"><label>Description</label><input name="description"></div>
    <div class="modal-actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn">Save</button></div></form>`);
}
function saveIncome(e){
  e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
  income.push(mkIncome({amount:+f.amount, client:f.client.trim(), date:f.date, description:f.description.trim(), category:f.category, status:f.status}));
  save(); closeModal(); render(); toast('Income added');
}
function markReceived(id){ const e = income.find(x => x.id === id); if (e) { e.status = 'received'; save(); render(); toast('Marked as received'); } }
function delIncome(id){ if (confirm('Delete this income entry?')) { income = income.filter(x => x.id !== id); save(); render(); } }

/* ----- Expenses ----- */
function vExpenses(t){
  const list = [...expenses].sort((a,b) => b.date.localeCompare(a.date));
  const byCat = {}; expenses.forEach(e => byCat[e.category] = (byCat[e.category] || 0) + e.amount);
  return `
  <div class="grid g3" style="margin-bottom:16px">
    <div class="card stat navy"><div class="label">Total Expenses</div><div class="value">${fmt(t.totalExp)}</div></div>
    <div class="card stat amber"><div class="label">This Month</div><div class="value">${fmt(t.monthExp)}</div></div>
    <div class="card stat teal"><div class="label">Net Profit (Income − Expenses)</div><div class="value">${fmt(t.net)}</div><div class="sub">Base for the 90% / 10% split</div></div>
  </div>
  <div class="card"><div class="muted" style="margin-bottom:10px">${Object.entries(byCat).sort((a,b) => b[1]-a[1]).map(([c,v]) => `${esc(c)}: <b>${fmt(v)}</b>`).join(' · ')}</div>
  <div class="tablewrap"><table>
    <thead><tr><th>Date</th><th>Category</th><th>Description</th><th class="num">Amount</th><th></th></tr></thead>
    <tbody>${list.map(e => `<tr><td>${fdate(e.date)}</td><td>${esc(e.category)}</td><td>${esc(e.description)}</td><td class="num"><b>${fmt(e.amount)}</b></td><td class="num"><button class="btn sm danger" onclick="delExpense('${e.id}')">✕</button></td></tr>`).join('') || '<tr><td colspan="5" class="empty">No expenses recorded</td></tr>'}</tbody>
  </table></div></div>`;
}
function expenseForm(){
  openModal(`<h2>Add Expense</h2><form onsubmit="saveExpense(event)">
    <div class="row2"><div class="field"><label>Amount (₨)</label><input name="amount" type="number" min="1" step="any" required></div>
    <div class="field"><label>Date</label><input name="date" type="date" value="${today()}" required></div></div>
    <div class="field"><label>Category</label><select name="category">${['Salaries','Software','Office','Advertising','Utilities','Travel','Other'].map(c => `<option>${c}</option>`).join('')}</select></div>
    <div class="field"><label>Description</label><input name="description" required></div>
    <div class="modal-actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn">Save</button></div></form>`);
}
function saveExpense(e){
  e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
  expenses.push({id:uid(), amount:+f.amount, date:f.date, category:f.category, description:f.description.trim()});
  save(); closeModal(); render(); toast('Expense added · net profit and shares updated');
}
function delExpense(id){ if (confirm('Delete this expense?')) { expenses = expenses.filter(x => x.id !== id); save(); render(); } }

/* ----- Invoices ----- */
const finv = {q:'', status:''};
function vInvoices(){
  const list = invoices.filter(i => (!finv.status || invStatus(i) === finv.status) &&
    (!finv.q || (i.client + i.number + i.service).toLowerCase().includes(finv.q.toLowerCase())))
    .sort((a,b) => b.issued.localeCompare(a.issued));
  const sumBy = s => sum(invoices.filter(i => invStatus(i) === s), i => i.amount);
  return `
  <div class="grid g4" style="margin-bottom:16px">
    ${['draft','sent','overdue','paid'].map(s => `<div class="card stat"><div class="label">${s}</div><div class="value" style="font-size:20px">${fmt(sumBy(s))}</div><div class="sub">${invoices.filter(i => invStatus(i) === s).length} invoices</div></div>`).join('')}
  </div>
  <div class="card">
    <div class="filters">
      <input placeholder="Search client, number, service…" value="${esc(finv.q)}" oninput="finv.q=this.value;renderKeep(this)">
      <select onchange="finv.status=this.value;render()"><option value="">All statuses</option>${['draft','sent','paid','overdue'].map(s => `<option value="${s}" ${finv.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select>
    </div>
    <div class="tablewrap"><table>
      <thead><tr><th>Invoice #</th><th>Client</th><th>Service</th><th>Due</th><th>Status</th><th class="num">Amount</th><th class="num">Actions</th></tr></thead>
      <tbody>${list.map(i => { const s = invStatus(i); return `<tr>
        <td><b>${esc(i.number)}</b></td><td>${esc(i.client)}</td><td>${esc(i.service)}</td><td>${fdate(i.due)}</td><td>${badge(s)}</td>
        <td class="num"><b>${fmt(i.amount)}</b></td>
        <td class="num">${s === 'draft' ? `<button class="btn sm ghost" onclick="setInv('${i.id}','sent')">Mark sent</button> ` : ''}${s === 'sent' || s === 'overdue' ? `<button class="btn sm" onclick="setInv('${i.id}','paid')">Mark paid</button> ` : ''}${s === 'paid' ? `<button class="btn sm ghost" onclick="setInv('${i.id}','sent')">Undo paid</button> ` : ''}<button class="btn sm danger" onclick="delInv('${i.id}')">✕</button></td></tr>`; }).join('') || '<tr><td colspan="7" class="empty">No invoices found</td></tr>'}</tbody>
    </table></div>
  </div>`;
}
function renderKeep(el){ const p = el.selectionStart; render(); const n = document.querySelector('.filters input'); if (n) { n.focus(); n.setSelectionRange(p, p); } }
function nextInvNo(){ const n = invoices.map(i => parseInt(String(i.number).replace(/\D/g,'')) || 0); return 'INV-' + String(Math.max(0, ...n) + 1).padStart(3,'0'); }
function invoiceForm(){
  openModal(`<h2>New Invoice</h2><form onsubmit="saveInvoice(event)">
    <div class="row2"><div class="field"><label>Invoice #</label><input name="number" value="${nextInvNo()}" required></div>
    <div class="field"><label>Amount (₨)</label><input name="amount" type="number" min="1" step="any" required></div></div>
    <div class="field"><label>Client Name</label><input name="client" required></div>
    <div class="field"><label>Service Description</label><input name="service" required></div>
    <div class="row2"><div class="field"><label>Issue Date</label><input name="issued" type="date" value="${today()}" required></div>
    <div class="field"><label>Due Date</label><input name="due" type="date" value="${daysAhead(14)}" required></div></div>
    <div class="field"><label>Status</label><select name="status"><option value="draft">Draft</option><option value="sent">Sent</option></select></div>
    <div class="modal-actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn">Create</button></div></form>`);
}
function saveInvoice(e){
  e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
  invoices.push({id:uid(), number:f.number.trim(), client:f.client.trim(), service:f.service.trim(), amount:+f.amount, issued:f.issued, due:f.due, status:f.status});
  save(); closeModal(); render(); toast('Invoice created');
}
function setInv(id, st){
  const i = invoices.find(x => x.id === id); if (!i) return;
  const wasPaid = i.status === 'paid';
  i.status = st;
  if (st === 'paid' && !wasPaid) {
    i.paidDate = today();
    if (!income.some(e => e.invoiceId === i.id))
      income.push(mkIncome({amount:i.amount, client:i.client, date:today(), description:'Invoice ' + i.number + ' – ' + i.service, category:'Services', invoiceId:i.id}));
    toast('Paid → added to income');
  } else if (wasPaid && st !== 'paid') {
    income = income.filter(e => e.invoiceId !== i.id); delete i.paidDate; toast('Reverted · income entry removed');
  } else toast('Invoice updated');
  save(); render();
}
function delInv(id){
  const i = invoices.find(x => x.id === id);
  if (!i || !confirm('Delete invoice ' + i.number + (i.status === 'paid' ? ' and its income entry' : '') + '?')) return;
  invoices = invoices.filter(x => x.id !== id); income = income.filter(e => e.invoiceId !== id); save(); render();
}

/* ----- Allah's share ----- */
function vAllah(t){
  const list = [...charity].sort((a,b) => b.date.localeCompare(a.date));
  return `
  <div class="card allah-card" style="margin-bottom:16px">
    <div class="label">Total owed in Allah's way (10% of net profit)</div>
    <div class="value" style="font-size:36px">${fmt(t.allahTotal)}</div>
    <div class="bar"><div style="width:${t.pct}%"></div></div>
    <div class="sub" style="margin-top:8px">${t.pct.toFixed(1)}% given · ${fmt(t.given)} of ${fmt(t.allahTotal)}</div>
    <div class="sub" style="margin-top:6px">${fmt(t.totalIn)} income − ${fmt(t.totalExp)} expenses = ${fmt(t.net)} net profit × 10%${t.net <= 0 ? ' (net profit is zero or negative → ₨ 0)' : ''}</div>
  </div>
  <div class="grid g3" style="margin-bottom:16px">
    <div class="card stat" style="border-top:4px solid var(--gold)"><div class="label">Accumulated</div><div class="value gold-txt">${fmt(t.allahTotal)}</div></div>
    <div class="card stat" style="border-top:4px solid var(--green)"><div class="label">Already Given</div><div class="value" style="color:var(--green)">${fmt(t.given)}</div></div>
    <div class="card stat" style="border-top:4px solid ${t.remaining < 0 ? 'var(--red)' : 'var(--amber)'}"><div class="label">Remaining To Give</div><div class="value">${fmt(t.remaining)}</div>${t.remaining < 0 ? '<div class="sub">Given more than the 10% set aside</div>' : ''}</div>
  </div>
  <div class="grid g-main">
    <div class="card"><h3>Giving History</h3><div class="tablewrap"><table>
      <thead><tr><th>Date</th><th>Cause / Recipient</th><th>Notes</th><th class="num">Amount</th><th></th></tr></thead>
      <tbody>${list.map(c => `<tr><td>${fdate(c.date)}</td><td><b>${esc(c.cause)}</b></td><td>${esc(c.notes)}</td><td class="num gold-txt">${fmt(c.amount)}</td><td class="num"><button class="btn sm danger" onclick="delCharity('${c.id}')">✕</button></td></tr>`).join('') || '<tr><td colspan="5" class="empty">Nothing recorded yet</td></tr>'}</tbody>
    </table></div></div>
    <div class="card"><h3>Given vs Remaining</h3><div class="chart-box"><canvas id="cAllah"></canvas></div></div>
  </div>`;
}
function afterAllah(t){
  chart('cAllah', {type:'doughnut', data:{labels:['Given','Remaining'], datasets:[{data:[t.given, Math.max(0, t.remaining)], backgroundColor:['#15803d','#d4a017'], borderWidth:0}]}, options:{...chartOpts, cutout:'65%'}});
}
function charityForm(){
  const t = totals();
  openModal(`<h2>Spent in Allah's Way</h2><form onsubmit="saveCharity(event)">
    <div class="hint">Remaining to give: <b>${fmt(t.remaining)}</b></div>
    <div class="row2"><div class="field"><label>Amount (₨)</label><input name="amount" type="number" min="1" step="any" required></div>
    <div class="field"><label>Date</label><input name="date" type="date" value="${today()}" required></div></div>
    <div class="field"><label>Cause / Recipient</label><input name="cause" required></div>
    <div class="field"><label>Notes</label><textarea name="notes" rows="2"></textarea></div>
    <div class="modal-actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn gold">Save</button></div></form>`);
}
function saveCharity(e){
  e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
  charity.push({id:uid(), amount:+f.amount, cause:f.cause.trim(), date:f.date, notes:f.notes.trim()});
  save(); closeModal(); render(); toast("Recorded — may Allah accept it 🤲");
}
function delCharity(id){ if (confirm('Delete this record?')) { charity = charity.filter(c => c.id !== id); save(); render(); } }

/* ----- Reports ----- */
function monthRows(){
  const rec = received();
  const keys = [...new Set([...rec.map(e => monthKey(e.date)), ...expenses.map(e => monthKey(e.date))])].sort();
  return keys.map(m => {
    const inc = sum(rec.filter(e => monthKey(e.date) === m), e => e.amount), exp = sum(expenses.filter(e => monthKey(e.date) === m), e => e.amount);
    return {m, inc, exp, net:inc - exp, mine:mineOf(inc - exp), allah:allahOf(inc - exp)};
  });
}
function vReports(){
  const rec = received(), rows = monthRows();
  const byClient = {}; rec.forEach(e => byClient[e.client] = (byClient[e.client] || 0) + e.amount);
  const top = Object.entries(byClient).sort((a,b) => b[1] - a[1]).slice(0,6);
  const totalIn = sum(rec, e => e.amount) || 1;
  return `
  <div class="grid g2" style="margin-bottom:16px">
    <div class="card"><h3>Monthly Income vs Expenses</h3><div class="chart-box"><canvas id="cMonthly"></canvas></div></div>
    <div class="card"><h3>Cumulative Allah's Share vs Given</h3><div class="chart-box"><canvas id="cCum"></canvas></div></div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>Top Clients by Revenue</h3>${top.map(([c,v],i) => `
      <div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between"><span><b>${i+1}. ${esc(c)}</b></span><span>${fmt(v)} <span class="muted">(${(v/totalIn*100).toFixed(0)}%)</span></span></div>
      <div class="bar light" style="height:8px"><div style="width:${v/top[0][1]*100}%;background:var(--teal)"></div></div></div>`).join('') || '<div class="empty">No data</div>'}</div>
    <div class="card"><h3>Monthly Breakdown</h3><div class="tablewrap"><table>
      <thead><tr><th>Month</th><th class="num">Income</th><th class="num">Expenses</th><th class="num">Net</th><th class="num">Me 90%</th><th class="num">Allah 10%</th></tr></thead>
      <tbody>${[...rows].reverse().map(r => `<tr><td>${monthLabel(r.m)}</td><td class="num">${fmt(r.inc)}</td><td class="num">${fmt(r.exp)}</td><td class="num"><b>${fmt(r.net)}</b></td><td class="num">${fmt(r.mine)}</td><td class="num gold-txt">${fmt(r.allah)}</td></tr>`).join('')}</tbody>
    </table></div></div>
  </div>`;
}
function afterReports(){
  const rows = monthRows(), ms = [...new Set([...rows.map(r => r.m), ...charity.map(c => monthKey(c.date))])].sort();
  const get = m => rows.find(r => r.m === m) || {inc:0, exp:0, net:0};
  chart('cMonthly', {type:'bar', data:{labels:ms.map(monthLabel), datasets:[
    {label:'Income', data:ms.map(m => get(m).inc), backgroundColor:'#0f766e', borderRadius:4},
    {label:'Expenses', data:ms.map(m => get(m).exp), backgroundColor:'#94a3b8', borderRadius:4}]}, options:{...chartOpts, scales:{y:{ticks:{callback:axisFmt}}}}});
  let net = 0, g = 0; const cumA = [], cumG = [];
  ms.forEach(m => { net += get(m).net; g += sum(charity.filter(c => monthKey(c.date) === m), c => c.amount); cumA.push(allahOf(net)); cumG.push(g); });
  chart('cCum', {type:'line', data:{labels:ms.map(monthLabel), datasets:[
    {label:"Allah's share (10% of cumulative net)", data:cumA, borderColor:'#d4a017', backgroundColor:'rgba(212,160,23,.15)', fill:true, tension:.3},
    {label:'Given', data:cumG, borderColor:'#15803d', tension:.3}]}, options:{...chartOpts, scales:{y:{ticks:{callback:axisFmt}}}}});
}

/* ========= Wiring ========= */
$('nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { view = b.dataset.view; $('sidebar').classList.remove('open'); $('scrim').classList.remove('open'); render(); window.scrollTo(0,0); } });
$('menuBtn').onclick = () => { $('sidebar').classList.add('open'); $('scrim').classList.add('open'); };
$('scrim').onclick = () => { $('sidebar').classList.remove('open'); $('scrim').classList.remove('open'); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
init(); render();
</script>
</body>
</html>
